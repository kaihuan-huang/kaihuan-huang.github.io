al }\noffset &#x8d8a;&#x6df1;&#x8d8a;&#x6162;&#x4e14;&#x8981;&#x7a33;&#x5b9a;&#x6392;&#x5e8f;&#xff1b;&#x5927;&#x8868;&#x6539; keyset &#xb7; deep offsets slow; keyset later\n</code></pre>","children":[],"payload":{"tag":"li","lines":"63,78"}}],"payload":{"tag":"li","lines":"62,78"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;limit/offset &#x5206;&#x9875;&#xff0c;limit &#x9ed8;&#x8ba4; 20&#x3001;&#x6700;&#x5927; 100&#xff0c;&#x8fd4;&#x56de; { items, total }&#xff1b;&#x975e;&#x6cd5;&#x53c2;&#x6570;&#x7531;&#x6846;&#x67b6;&#x6821;&#x9a8c;&#x8fd4;&#x56de; 422 &#xb7; limit/offset with default 20 and max 100, returning { items, total }; bad values get the framework&apos;s 422","children":[],"payload":{"tag":"li","lines":"79,80"}},{"content":"&#x4e0d;&#x7528; page/page_size &#x52a0; next/prev URL &#xb7; Not page numbers with next/prev URLs&#xff1a;&#x53c2;&#x8003;&#x5b9e;&#x73b0;&#x8fd9;&#x6837;&#x505a;&#xff1b;&#x91cd;&#x5199;&#x53ea;&#x8981;&#x4e00;&#x4e2a;&#x4fe1;&#x5c01;&#xff0c;URL &#x7531;&#x5ba2;&#x6237;&#x7aef;&#x62fc; &#xb7; the reference did this; the rewrite keeps one envelope and lets the client build links","children":[],"payload":{"tag":"li","lines":"80,81"}},{"content":"&#x4e0d;&#x7528; &#x6e38;&#x6807;&#x5206;&#x9875; &#xb7; Not cursor pagination&#xff1a;&#x7ba1;&#x7406;&#x53f0;&#x8868;&#x683c;&#x8981;&#x603b;&#x6570;&#x548c;&#x8df3;&#x9875;&#xff0c;&#x6e38;&#x6807;&#x7ed9;&#x4e0d;&#x4e86; total&#xff1b;&#x6570;&#x636e;&#x91cf;&#x5927;&#x3001;&#x8981;&#x7a33;&#x5b9a;&#x7ffb;&#x9875;&#x65f6;&#x624d;&#x503c;&#x5f97; &#xb7; admin tables need a total and page jumps; cursors pay off only for huge or fast-changing lists","children":[],"payload":{"tag":"li","lines":"81,82"}},{"content":"&#x4e0d;&#x7528; &#x81ea;&#x5df1;&#x5199;&#x6821;&#x9a8c;&#x8fd4;&#x56de; 400 &#xb7; Not hand-rolled 400s&#xff1a;Pydantic &#x7c7b;&#x578b;&#x5373;&#x6821;&#x9a8c;&#xff0c;422 &#x662f; FastAPI &#x9ed8;&#x8ba4;&#xff0c;&#x5168;&#x670d;&#x52a1;&#x4e00;&#x81f4; &#xb7; Pydantic types are the validation and 422 is the consistent framework default","children":[],"payload":{"tag":"li","lines":"82,83"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;offset &#x8d8a;&#x6df1;&#x8d8a;&#x6162;&#xff0c;&#x5e76;&#x53d1;&#x63d2;&#x5165;&#x65f6;&#x53ef;&#x80fd;&#x8df3;&#x884c;&#x6216;&#x91cd;&#x590d;&#xff1b;&#x6bcf;&#x6b21;&#x8fd8;&#x8981;&#x591a;&#x4e00;&#x6761; count &#x67e5;&#x8be2; &#xb7; deep offsets get slow, concurrent inserts can skip or repeat rows, and each call runs a count query","children":[],"payload":{"tag":"li","lines":"83,84"}},{"content":"&#x4ec0;&#x4e48;&#x65f6;&#x5019;&#x6362; &#xb7; Switch when&#xff1a;&#x5217;&#x8868;&#x5230;&#x51e0;&#x5341;&#x4e07;&#x884c;&#x6216;&#x9700;&#x8981;&#x65e0;&#x9650;&#x6eda;&#x52a8;&#x65f6;&#xff0c;&#x6539;&#x6210;&#x6309; (created_at, id) &#x7684;&#x952e;&#x96c6;&#x5206;&#x9875; &#xb7; move to keyset on (created_at, id) at hundreds of thousands of rows or infinite scroll","children":[],"payload":{"tag":"li","lines":"84,85"}},{"content":"&#x6765;&#x6e90; &#xb7; Source&#xff1a;docs/spec/04-api-surface.md&#xff08;&#x91cd;&#x5199;&#x8981;&#x6c42;&#xff1a;&#x4e00;&#x4e2a; { items, total } &#x4fe1;&#x5c01;&#xff0c;&#x4e0d;&#x8981; next/prev&#xff09;&#xff1b;&#x6e38;&#x6807;&#x90e8;&#x5206;&#x4e3a;&#x901a;&#x7528;&#x7406;&#x7531; &#xb7; docs/spec/04-api-surface.md records one envelope, no next/prev; the cursor reasoning is general","children":[],"payload":{"tag":"li","lines":"85,86"}}],"payload":{"tag":"li","lines":"78,86"}},{"content":"&#x2463; &#x6211;&#x7684;&#x6848;&#x4f8b; &#xb7; My case","children":[{"content":"&#x6211;&#x8bbe;&#x8ba1;&#x4e86; /api/v1/users &#x7aef;&#x70b9;&#xff0c;&#x4ee5;&#x8fd4;&#x56de;&#x5206;&#x9875;&#x7ed3;&#x679c;&#x5e76;&#x9a8c;&#x8bc1;&#x67e5;&#x8be2;&#x53c2;&#x6570;&#xff0c;&#x5bf9;&#x4e8e;&#x65e0;&#x6548;&#x8f93;&#x5165;&#x8fd4;&#x56de; 422&#x3002;","children":[],"payload":{"tag":"li","lines":"87,88"}},{"content":"I designed the /api/v1/users endpoint to return paginated results and validate query parameters, returning 422 for invalid input.","children":[],"payload":{"tag":"li","lines":"88,89"}}],"payload":{"tag":"li","lines":"86,89"}},{"content":"&#x2464; &#x4ee3;&#x7801; &#xb7; Code&#xff1a;<code>apps/api/src/govapi/schemas/common.py @ 67241c7</code> &#xb7; &#x4ee3;&#x7801;&#x5728;&#x79c1;&#x6709;&#x4ed3;&#x5e93;&#xff0c;&#x672c;&#x5730;&#x5bfc;&#x56fe;&#x91cc;&#x770b; &#xb7; private repo, see the local map","children":[],"payload":{"tag":"li","lines":"89,90"}},{"content":"&#x2465; &#x8bc1;&#x636e; &#xb7; Evidence&#xff08;2026-09-22&#xff09;","children":[{"content":"&quot;+ GET /api/v1/users returns { items, total }; 422 on bad limit/offset&quot;","children":[],"payload":{"tag":"li","lines":"91,93"}}],"payload":{"tag":"li","lines":"90,93"}}],"payload":{"tag":"h4","lines":"57,58"}},{"content":"API &#x8868;&#x9762;&#x8bbe;&#x8ba1; &#xb7; API Surface Design","children":[{"content":"&#x2460; &#x901a;&#x7528;&#x56de;&#x7b54; &#xb7; General answer","children":[{"content":"&#x5b9a;&#x4e49;&#x6e05;&#x6670;&#x7684;&#x7aef;&#x70b9;&#x3001;&#x8d1f;&#x8f7d;&#x5951;&#x7ea6;&#x548c;&#x7248;&#x672c;&#x63a7;&#x5236;&#x5bf9;&#x4e8e;&#x53ef;&#x7ef4;&#x62a4;&#x7684; API &#x81f3;&#x5173;&#x91cd;&#x8981;&#x3002;","children":[],"payload":{"tag":"li","lines":"96,97"}},{"content":"Defining clear endpoints, payload contracts, and versioning is essential for maintainable APIs.","children":[],"payload":{"tag":"li","lines":"97,98"}}],"payload":{"tag":"li","lines":"95,98"}},{"content":"&#x2461; &#x539f;&#x7406; &#xb7; How it works","children":[{"content":"\n<pre data-lines=\"99,112\"><code class=\"language-text\">&#x5148;&#x8bb0;&#x5f55;&#x65e7;&#x7cfb;&#x7edf;&#x7684;&#x89c2;&#x5bdf;&#xff0c;&#x518d;&#x5199;&#x91cd;&#x5199;&#x7684;&#x786c;&#x8981;&#x6c42; &#xb7; observed behaviour first, then rules\n  &#x65e7;&#x7cfb;&#x7edf; observed                     &#x91cd;&#x5199;&#x8981 l map","children":[],"payload":{"tag":"li","lines":"400,401"}},{"content":"&#x2465; &#x8bc1;&#x636e; &#xb7; Evidence&#xff08;2026-09-22&#xff09;","children":[{"content":"&quot;+ - bulk import: JSON rows or CSV upload; dry_run defaults to true and returns creates, updates (with changed fields) and rejects with row numbers; apply is one transaction; new users get a set-password e-mail instead of an imported password; role-escalation guard per row&quot;","children":[],"payload":{"tag":"li","lines":"402,403"}}],"payload":{"tag":"li","lines":"401,403"}},{"content":"&#x9762;&#x8bd5;&#x600e;&#x4e48;&#x95ee; &#xb7; Asked as&#xff1a;&#x60a8;&#x5c06;&#x5982;&#x4f55;&#x8bbe;&#x8ba1;&#x4e00;&#x4e2a;&#x652f;&#x6301;&#x6279;&#x91cf;&#x5bfc;&#x5165;&#x6570;&#x636e;&#x3001;&#x9a8c;&#x8bc1;&#x548c;&#x5e72;&#x8fd0;&#x884c;&#x529f;&#x80fd;&#x7684; API &#x7aef;&#x70b9;&#xff1f; &#xb7; How would you design an API endpoint that supports bulk import of data with validation and dry-run functionality?","children":[],"payload":{"tag":"li","lines":"403,405"}}],"payload":{"tag":"h4","lines":"368,369"}}],"payload":{"tag":"h3","lines":"366,367"}},{"content":"&#x6570;&#x636e;&#x5e93;&#x4e0e; SQL &#xb7; Databases &amp; SQL","children":[{"content":"&#x8f6f;&#x5220;&#x9664;&#x4e0e;&#x5b9e;&#x65f6;&#x552f;&#x4e00;&#x7ea6;&#x675f; &#xb7; Soft Delete and Live-Unique Constraints","children":[{"content":"&#x2460; &#x901a;&#x7528;&#x56de;&#x7b54; &#xb7; General answer","children":[{"content":"&#x6dfb;&#x52a0; deleted_at &#x5217;&#xff0c;&#x5728;&#x67e5;&#x8be2;&#x4e2d;&#x8fc7;&#x6ee4;&#x8f6f;&#x5220;&#x9664;&#x884c;&#xff0c;&#x5e76;&#x4ec5;&#x5bf9;&#x975e;&#x5220;&#x9664;&#x884c;&#x5f3a;&#x5236;&#x552f;&#x4e00;&#x7ea6;&#x675f;&#x3002;","children":[],"payload":{"tag":"li","lines":"410,411"}},{"content":"Add a deleted_at column, filter out soft-deleted rows in queries, and enforce unique constraints only on non-deleted rows.","children":[],"payload":{"tag":"li","lines":"411,412"}}],"payload":{"tag":"li","lines":"409,412"}},{"content":"&#x2461; &#x539f;&#x7406; &#xb7; How it works","children":[{"content":"\n<pre data-lines=\"413,427\"><code class=\"language-text\">&#x540d;&#x5b57;&#x53ea;&#x5728;&#x6d3b;&#x884c;&#x91cc;&#x552f;&#x4e00;&#xff0c;&#x8ba1;&#x6570;&#x53ea;&#x6570;&#x6d3b;&#x6210;&#x5458; &#xb7; unique among live rows; live counts\n  DELETE /departments/{id}\n        &#x25bc;\n  UPDATE departments SET deleted_at = now()   (&#x884c;&#x4fdd;&#x7559; row kept)\n        &#x2502;\n        &#x251c;&#x2500;&#x25b6; ux_departments_name_live  WHERE deleted_at IS NULL\n        &#x2502;     &#x65e7;&#x540d; &quot;Finance&quot; &#x8ba9;&#x51fa; &#x2500;&#x25b6; &#x65b0;&#x5efa;&#x540c;&#x540d;&#x90e8;&#x95e8;&#x6210;&#x529f; new &quot;Finance&quot; ok\n        &#x251c;&#x2500;&#x25b6; &#x5217;&#x8868; list  WHERE departments.deleted_at IS NULL\n        &#x2514;&#x2500;&#x25b6; user_count = count(users.id)\n                WHERE users.department_id = d.id AND users.deleted_at IS NULL\n  groups &#x540c;&#x7406; same: ux_groups_name_live + member_count\n&#x6807;&#x91cf;&#x5b50;&#x67e5;&#x8be2;&#x8ba1;&#x6570;&#x5728;&#x5927;&#x8868;&#x4e0a;&#x6162;&#xff1b;&#x9700;&#x8981;&#x65f6;&#x7269;&#x5316; &#xb7; subquery counts get slow at scale\n</code></pre>","children":[],"payload":{"tag":"li","lines":"413,427"}}],"payload":{"tag":"li","lines":"412,427"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;&#x90e8;&#x95e8;&#x548c;&#x7ec4;&#x52a0; deleted_at &#x8f6f;&#x5220;&#x9664;&#xff0c;&#x540d;&#x79f0;&#x53ea;&#x5728;&#x672a;&#x5220;&#x9664;&#x884c;&#x5185;&#x552f;&#x4e00;&#xff08;&#x90e8;&#x5206;&#x552f;&#x4e00;&#x7d22;&#x5f15;&#xff09;&#xff0c;&#x5217;&#x8868;&#x5e26;&#x7528;&#x6237;&#x6570;&#x548c;&#x6210;&#x5458;&#x6570; &#xb7; departments and groups soft-deleted, names unique among live rows via a partial index, with member counts","children":[],"payload":{"tag":"li","lines":"428,429"}},{"content":"&#x4e0d;&#x7528; &#x786c;&#x5220;&#x9664; &#xb7; Not hard delete&#xff1a;&#x7b56;&#x7565;&#x548c;&#x4e8b;&#x4ef6;&#x5f15;&#x7528;&#x7ec4;&#xff0c;&#x5220;&#x6389;&#x4f1a;&#x65ad;&#x6389;&#x5386;&#x53f2;&#xff1b;API &#x53ea;&#x5141;&#x8bb8;&#x8f6f;&#x5220;&#x9664; &#xb7; policies and incidents reference groups, and the API allows only soft delete","children":[],"payload":{"tag":"li","lines":"429,430"}},{"content":"&#x4e0d;&#x7528; &#x5168;&#x8868;&#x552f;&#x4e00; &#xb7; Not table-wide uniqueness&#xff1a;&#x5220;&#x6389;&#x7684;&quot;&#x8d22;&#x52a1;&#x90e8;&quot;&#x4f1a;&#x4e00;&#x76f4;&#x5360;&#x7740;&#x540d;&#x5b57;&#xff0c;&#x4e0d;&#x80fd;&#x91cd;&#x5efa; &#xb7; a deleted &quot;Finance&quot; would block creating it again","children":[],"payload":{"tag":"li","lines":"430,431"}},{"content":"&#x4e0d;&#x7528; &#x5220;&#x9664;&#x65f6;&#x6539;&#x540d;&#xff08;&#x52a0;&#x540e;&#x7f00;&#xff09; &#xb7; Not renaming on delete&#xff1a;&#x6539;&#x5199;&#x4e86;&#x5386;&#x53f2;&#x6570;&#x636e;&#xff0c;&#x62a5;&#x8868;&#x91cc;&#x663e;&#x793a;&#x7684;&#x540d;&#x5b57;&#x5c31;&#x4e0d;&#x5bf9;&#x4e86; &#xb7; rewrites history, so reports show the wrong name","children":[],"payload":{"tag":"li","lines":"431,432"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x6bcf;&#x4e2a;&#x67e5;&#x8be2;&#x548c;&#x8ba1;&#x6570;&#x90fd;&#x8981;&#x8fc7;&#x6ee4; deleted_at&#xff1b;&#x6210;&#x5458;&#x6570;&#x8981;&#x6392;&#x9664;&#x5df2;&#x5220;&#x9664;&#x7528;&#x6237; &#xb7; every query and count must filter deleted_at, including member counts","children":[],"payload":{"tag":"li","lines":"432,433"}},{"content":"&#x6765;&#x6e90; &#xb7; Source&#xff1a;docs/spec/08-tradeoffs-and-open-questions.md&#xff08;&#x503c;&#x5f97;&#x4fdd;&#x7559;&#x7684;&#x51b3;&#x5b9a;&#xff1a;&#x8f6f;&#x5220;&#x9664;&#xff0c;&#x53ea;&#x5728;&#x672a;&#x5220;&#x9664;&#x884c;&#x5185;&#x552f;&#x4e00;&#xff09; &#xb7; docs/spec/08-tradeoffs-and-open-questions.md, decisions worth keeping","children":[],"payload":{"tag":"li","lines":"433,434"}}],"payload":{"tag":"li","lines":"427,434"}},{"content":"&#x2463; &#x6211;&#x7684;&#x6848;&#x4f8b; &#xb7; My case","children":[{"content":"&#x6211;&#x4e3a;&#x90e8;&#x95e8;&#x548c;&#x7ec4;&#x6dfb;&#x52a0;&#x4e86;&#x8f6f;&#x5220;&#x9664;&#xff0c;&#x786e;&#x4fdd;&#x5b9e;&#x65f6;&#x552f;&#x4e00;&#x540d;&#x79f0;&#x5e76;&#x7ef4;&#x62a4;&#x7528;&#x6237;/&#x6210;&#x5458;&#x8ba1;&#x6570;&#x3002;","children":[],"payload":{"tag":"li","lines":"435,436"}},{"content":"I added soft delete to departments and groups, ensuring live-unique names and maintaining user/member counts.","children":[],"payload":{"tag":"li","lines":"436,437"}}],"payload":{"tag":"li","lines":"434,437"}},{"content":"&#x2464; &#x4ee3;&#x7801; &#xb7; Code&#xff1a;<code>apps/api/src/govapi/models/org.py @ 01ca777</code> &#xb7; &#x4ee3;&#x7801;&#x5728;&#x79c1;&#x6709;&#x4ed3;&#x5e93;&#xff0c;&#x672c;&#x5730;&#x5bfc;&#x56fe;&#x91cc;&#x770b; &#xb7; private repo, see the local map","children":[],"payload":{"tag":"li","lines":"437,438"}},{"content":"&#x2465; &#x8bc1;&#x636e; &#xb7; Evidence&#xff08;2026-09-22&#xff09;","children":[{"content":"&quot;+ - departments and groups with live-unique names, soft delete, user/member counts&quot;","children":[],"payload":{"tag":"li","lines":"439,440"}}],"payload":{"tag":"li","lines":"438,440"}},{"content":"&#x9762;&#x8bd5;&#x600e;&#x4e48;&#x95ee; &#xb7; Asked as&#xff1a;&#x60a8;&#x53ef;&#x4ee5;&#x4f7f;&#x7528;&#x54ea;&#x4e9b;&#x7b56;&#x7565;&#x5728;&#x5b9e;&#x73b0;&#x8f6f;&#x5220;&#x9664;&#x7684;&#x540c;&#x65f6;&#x4fdd;&#x6301;&#x552f;&#x4e00;&#x7ea6;&#x675f;&#xff1f; &#xb7; What strategies can you use to implement soft delete while maintaining unique constraints?","children":[],"payload":{"tag":"li","lines":"440,442"}}],"payload":{"tag":"h4","lines":"407,408"}}],"payload":{"tag":"h3","lines":"405,406"}},{"content":"&#x6d4b;&#x8bd5;&#x7b56;&#x7565; &#xb7; Testing Strategy","children":[{"content":"&#x6279;&#x91cf;&#x5bfc;&#x5165;&#x7684;&#x6d4b;&#x8bd5;&#x7b56;&#x7565; &#xb7; Testing Strategy for Bulk Import","children":[{"content":"&#x2460; &#x901a;&#x7528;&#x56de;&#x7b54; &#xb7; General answer","children":[{"content":"&#x5355;&#x5143;&#x6d4b;&#x8bd5;&#x5e94;&#x8986;&#x76d6; CSV &#x89e3;&#x6790;&#x903b;&#x8f91;&#x548c;&#x8fb9;&#x754c;&#x60c5;&#x51b5;&#xff0c;&#x786e;&#x4fdd;&#x6bcf;&#x4e00;&#x884c;&#x88ab;&#x6b63;&#x786e;&#x89e3;&#x91ca;&#x3002;&#x96c6;&#x6210;&#x6d4b;&#x8bd5;&#x5219;&#x9a8c;&#x8bc1;&#x6279;&#x91cf;&#x5bfc;&#x5165; API &#x7684;&#x529f;&#x80fd;&#xff0c;&#x68c0;&#x67e5; dry-run &#x6458;&#x8981;&#x662f;&#x5426;&#x51c6;&#x786e;&#xff0c;&#x5e76;&#x786e;&#x4fdd;&#x53ea;&#x6709;&#x6240;&#x6709;&#x884c;&#x90fd;&#x5408;&#x6cd5;&#x65f6;&#x624d;&#x63d0;&#x4ea4;&#x4e8b;&#x52a1;&#x3002;&#x4e8b;&#x52a1;&#x6d4b;&#x8bd5;&#x786e;&#x8ba4;&#x4efb;&#x4f55;&#x9519;&#x8bef;&#x90fd;&#x4f1a;&#x89e6;&#x53d1;&#x56de;&#x6eda;&#xff0c;&#x4fdd;&#x6301;&#x6570;&#x636e;&#x5e93;&#x4e0d;&#x53d8;&#x3002;","children":[],"payload":{"tag":"li","lines":"447,448"}},{"content":"Unit tests should cover CSV parsing logic and edge cases, ensuring that each row is correctly interpreted. Integration tests exercise the bulk-import API endpoint, verifying that the dry-run summary is accurate and that the transaction commits only when all rows are valid. Transactional tests confirm that any failure triggers a rollback, leaving the database unchanged.","children":[],"payload":{"tag":"li","lines":"448,449"}}],"payload":{"tag":"li","lines":"446,449"}},{"content":"&#x2461; &#x539f;&#x7406; &#xb7; How it works","children":[{"content":"\n<pre data-lines=\"450,463\"><code class=\"language-text\">&#x4e00;&#x4e2a; CSV &#x8986;&#x76d6;&#x6bcf;&#x79cd;&#x62d2;&#x7edd;&#x539f;&#x56e0;&#xff0c;&#x518d;&#x65ad;&#x8a00;&#x96f6;&#x5199;&#x5165; &#xb7; one fixture, every reject, no writes\n  CSV fixture &#x884c;&#x53f7; row:\n   2 &#x65b0;&#x7528;&#x6237; &#x2500;&#x25b6; creates      3 &#x5df2;&#x6709;&#x7528;&#x6237; &#x2500;&#x25b6; updates[changes]\n   4 &#x574f;&#x90ae;&#x ; new roles, is_active)\n        &#x25bc;\n  changed = &#x65b0;&#x589e; added &#x222a; &#x79fb;&#x9664; removed\n        &#x25bc;\n  guard_role_grant(actor, changed) &#x2500;&#x2500; actor &#x7f3a;&#x8fd9;&#x4e9b;&#x6743;&#x9650;? &#x2500;&#x2500;&#x25b6; reject &#x884c;\n        &#x25bc;\n  current == actor &#x4e14; is_active=false ? &#x2500;&#x2500;&#x25b6; &quot;&#x4e0d;&#x80fd;&#x505c;&#x7528;&#x81ea;&#x5df1;&quot; reject\n        &#x25bc;\n  current &#x662f;&#x6d3b;&#x8dc3; admin &#x4e14;&#x5c06;&#x5931;&#x53bb; admin/&#x88ab;&#x505c;&#x7528; ?\n        &#x2514;&#x2500; count_active_holders_of_role(admin, &#x6392;&#x9664;&#x81ea;&#x5df1;)==0 &#x2500;&#x25b6; &#x6700;&#x540e;&#x7ba1;&#x7406;&#x5458; reject\n        &#x25bc; &#x5168;&#x90e8;&#x901a;&#x8fc7; &#x2500;&#x25b6; &#x8ba1;&#x5165; updates\n&#x8ba1;&#x6570;&#x68c0;&#x67e5;&#x4e0e;&#x5199;&#x5165;&#x4e4b;&#x95f4;&#x4ecd;&#x6709;&#x5e76;&#x53d1;&#x7a97;&#x53e3;&#xff1b;&#x9700;&#x884c;&#x9501; &#xb7; count-then-write still races\n</code></pre>","children":[],"payload":{"tag":"li","lines":"487,502"}}],"payload":{"tag":"li","lines":"486,502"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;RBAC &#x591a;&#x89d2;&#x8272;&#xff0c;&#x670d;&#x52a1;&#x5c42;&#x7684; role-grant &#x5b88;&#x536b;&#x68c0;&#x67e5;&#x589e;&#x51cf;&#x7684;&#x89d2;&#x8272;&#xff0c;&#x7981;&#x6b62;&#x81ea;&#x6211;&#x505c;&#x7528;&#x3001;&#x4fdd;&#x7559;&#x6700;&#x540e;&#x4e00;&#x4e2a;&#x6d3b;&#x8dc3;&#x7ba1;&#x7406;&#x5458;&#xff0c;&#x914d;&#x8868;&#x9a71;&#x52a8;&#x6743;&#x9650;&#x77e9;&#x9635;&#x6d4b;&#x8bd5; &#xb7; RBAC with a service-layer role-grant guard, no self-deactivation, last admin kept, and a table-driven matrix test","children":[],"payload":{"tag":"li","lines":"503,504"}},{"content":"&#x4e0d;&#x7528; ReBAC / OpenFGA / Cerbos &#xb7; Not ReBAC or a policy engine&#xff1a;&#x8868;&#x8fbe;&#x529b;&#x5f3a;&#xff0c;&#x4f46;&#x :"481,482"}}],"payload":{"tag":"h3","lines":"479,480"}}],"payload":{"tag":"h2","lines":"364,365"}},{"content":"M3 &#x4e0a;&#x62a5;&#x3001;&#x7b56;&#x7565;&#x4e0e;&#x4e8b;&#x4ef6;&#x5355; &#xb7; Ingestion, policy &amp; incidents","children":[{"content":"API &#x8bbe;&#x8ba1;&#x4e0e; REST &#xb7; API Design &amp; REST","children":[{"content":"&#x5982;&#x4f55;&#x8bbe;&#x8ba1;&#x4e00;&#x4e2a; RESTful &#x7aef;&#x70b9;&#x6765;&#x68c0;&#x7d22;&#x7528;&#x6237;&#x7684;&#x7b56;&#x7565;&#xff1f; &#xb7; How would you design a RESTful endpoint to retrieve a user&apos;s policy?","children":[{"content":"&#x2460; &#x901a;&#x7528;&#x56de;&#x7b54; &#xb7; General answer","children":[{"content":"RESTful API &#x901a;&#x8fc7;&#x5728; URL &#x4e2d;&#x4f7f;&#x7528;&#x540d;&#x8bcd;&#x6765;&#x66b4;&#x9732;&#x8d44;&#x6e90;&#xff0c;&#x5e76;&#x7528; HTTP &#x52a8;&#x8bcd;&#x8868;&#x793a;&#x64cd;&#x4f5c;&#x3002;&#x8bbe;&#x8ba1;&#x65f6;&#x5e94;&#x4fdd;&#x6301;&#x65e0;&#x72b6;&#x6001;&#x3001;&#x53ef;&#x7f13;&#x5b58;&#xff0c;&#x5e76;&#x4f7f;&#x7528;&#x6807;&#x51c6;&#x72b6;&#x6001;&#x7801;&#x6765;&#x4f20;&#x8fbe;&#x8bf7;&#x6c42;&#x7ed3;&#x679c;&#x3002;&#x6b63;&#x786e;&#x4f7f;&#x7528;&#x5e42;&#x7b49;&#x65b9;&#x6cd5;&#xff08;&#x5982; GET&#x3001;PUT&#x3001;DELETE&#x3001;PATCH&#xff09;&#x80fd;&#x63d0;&#x5347; API &#x7684;&#x5065;&#x58ee;&#x6027;&#x3002;","children":[],"payload":{"tag":"li","lines":"525,526"}},{"content":"RESTful APIs expose resources via nouns in the URL and use HTTP verbs to indicate actions. The design should be stateless, cacheable, and use standard status codes to convey the result of a request. Proper use of idempotent methods like GET, PUT, DELETE, and PATCH improves robustness.","children":[],"payload":{"tag":"li","lines":"526,527"}}],"payload":{"tag":"li","lines":"524,527"}},{"content":"&#x2461; &#x539f;&#x7406; &#xb7; How it works","children":[{"content":"\n<pre data-lines=\"528,542\"><code class=\"language-text\">&#x8eab;&#x4efd;&#x6765;&#x81ea;&#x673a;&#x5668;&#x5bc6;&#x94a5;&#x800c;&#x975e; URL&#xff1b;ETag &#x8ba9;&#x8f6e;&#x8be2;&#x5f88;&#x4fbf;&#x5b9c; &#xb7; identity from key, cheap polls\n  &#x684c;&#x9762;&#x5ba2;&#x6237;&#x7aef; desktop &#x2500;&#x2500; GET /ingest/policy  Authorization: ApiKey &#x2026;\n                        If-None-Match: &quot;ab12&#x2026;&quot;\n        &#x25bc;\n  MachineDep &#x2500;&#x25b6; client.bound_user_id  (URL &#x91cc;&#x6ca1;&#x6709; user id)\n        &#x251c;&#x2500;&#x2500; &#x975e; desktop / &#x672a;&#x7ed1;&#x5b9a; / &#x7528;&#x6237;&#x505c;&#x7528; &#x2500;&#x2500;&#x25b6; 409 Conflict\n        &#x25bc;\n  effective_policy_for(user) &#x2500;&#x25b6; &#x89c4;&#x8303;&#x5316; JSON &#x2500;&#x25b6; sha256[:32] = ETag\n        &#x251c;&#x2500;&#x2500; ETag == If-None-Match &#x2500;&#x2500;&#x25b6; 304 Not Modified (&#x7a7a; body)\n        &#x2514;&#x2500;&#x2500; &#x4e0d;&#x540c; &#x2500;&#x25b6; 200 ClientPolicyOut + ETag + Cache-Control max-age=60\n  &#x5207;&#x6362;&#x5230; enforce &#x6700;&#x591a; 60 &#x79d2;&#x5230;&#x8fbe;&#x5ba2;&#x6237;&#x7aef; &#xb7; enforce reaches clients within 60 s\n&#x7f13;&#x5b58;&#x671f;&#x5185;&#x7b56;&#x7565;&#x53d8;&#x5316;&#x6709;&#x5ef6;&#x8fdf;&#xff1b;&#x8981;&#x5373;&#x65f6;&#x5c31;&#x5f97;&#x63a8;&#x9001; &#xb7; up to 60 s stale; instant needs push\n</code></pre>","children":[],"payload":{"tag":"li","lines":"528,542"}}],"payload":{"tag":"li","lines":"527,542"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;GET /ingest/policy&#xff0c;&#x7528;&#x6237;&#x7531;&#x673a;&#x5668; key &#x7ed1;&#x5b9a;&#x51b3;&#x5b9a;&#xff0c;&#x4e0d;&#x8d70; URL&#xff1b;&#x8fd4;&#x56de; ETag &#x4e0e; Cache-Control: private, max-age=60&#xff0c;If-None-Match &#x547d;&#x4e2d;&#x8fd4;&#x56de; 304 &#xb7; GET /ingest/policy with the user taken from the key, plus ETag, private max-age=60 and 304 on If-None-Match","children":[],"payload":{"tag":"li","lines":"543,544"}},{"content":"&#x4e0d;&#x7528; /users/{id}/policy &#xb7; Not /users/{id}/policy&#xff1a;&#x53c2;&#x8003;&#x5b9e;&#x73b0;&#x4fe1;&#x4efb; URL &#x91cc;&#x7684;&#x7528;&#x6237; id&#xff1b;ADR-0007 &#x89c4;&#x5b9a;&#x4e3b;&#x4f53;&#x6c38;&#x8fdc;&#x6765;&#x81ea;&#x51ed;&#x636e; &#xb7; the reference trusted the id in the URL; ADR-0007 says the subject always comes from the credential","children":[],"payload":{"tag":"li","lines":"544,545"}},{"content":"&#x4e0d;&#x7528; &#x6bcf;&#x6b21;&#x8fd4;&#x56de;&#x5b8c;&#x6574;&#x54cd;&#x5e94; &#xb7; Not a full response every time&#xff1a;&#x684c;&#x9762;&#x7aef;&#x4f1a;&#x9891;&#x7e41;&#x8f6e;&#x8be2;&#xff0c;304 &#x7701;&#x5e26;&#x5bbd;&#x4e5f;&#x7701;&#x5e8f;&#x5217;&#x5316; &#xb7; desktop clients poll often, and a 304 saves bandwidth and work","children":[],"payload":{"tag":"li","lines":"545,546"}},{"content":"&#x4e0d;&#x7528; WebSocket &#x63a8;&#x9001; &#xb7; Not WebSocket push&#xff1a;&#x8981;&#x957f;&#x8fde;&#x63a5;&#x548c;&#x91cd;&#x8fde;&#x903b;&#x8f91;&#xff1b;&#x7b56;&#x7565;&#x53d8;&#x5316;&#x4e0d;&#x9891;&#x7e41;&#xff0c;60 &#x79d2;&#x8f6e;&#x8be2;&#x591f;&#x7528; &#xb7; needs long-lived connections and reconnects; policies change rarely, so 60 s polling is enough","children":[],"payload":{"tag":"li","lines":"546,547"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x7b56;&#x7565;&#x6539;&#x52a8;&#x6700;&#x591a;&#x5ef6;&#x8fdf;&#x7ea6; 60 &#x79d2;&#x624d;&#x5230;&#x5ba2;&#x6237;&#x7aef;&#xff1b;ETag &#x6bcf;&#x6b21;&#x90fd;&#x8981;&#x7b97;&#x4e00;&#x6b21;&#x54c8;&#x5e0c; &#xb7; a policy change can take about 60 s to reach clients, and the ETag hash is computed per request","children":[],"payload":{"tag":"li","lines":"547,548"}},{"content":"&#x4ec0;&#x4e48;&#x65f6;&#x5019;&#x6362; &#xb7; Switch when&#xff1a;&#x9700;&#x8981;&#x79d2;&#x7ea7;&#x751f;&#x6548;&#xff08;&#x6bd4;&#x5982;&#x7d27;&#x6025;&#x963b;&#x65ad;&#xff09;&#x65f6;&#x52a0;&#x63a8;&#x9001;&#x901a;&#x9053; &#xb7; add a push channel when changes must land within seconds, such as an emergency block","children":[],"payload":{"tag":"li","lines":"548,549"}},{"content":"&#x6765;&#x6e90; &#xb7; Source&#xff1a;spec/m3-policies-and-incidents.md&#xff08;R8a&#xff1a;ETag&#x3001;max-age=60&#x3001;304&#x3001;&#x8fde;&#x63a5;&#x5668; key &#x8fd4;&#x56de; 409&#xff09;&#xff1b;&#x63a8;&#x9001;&#x90e8;&#x5206;&#x4e3a;&#x901a;&#x7528;&#x7406;&#x7531; &#xb7; spec/m3-policies-and-incidents.md R8a; the push reasoning is general","children":[],"payload":{"tag":"li","lines":"549,550"}}],"payload":{"tag":"li","lines":"542,550"}},{"content":"&#x2463; &#x6211;&#x7684;&#x6848;&#x4f8b; &#xb7; My case","children":[{"content":"&#x6211;&#x5c06; /ingest/policy &#x7aef;&#x70b9;&#x8bbe;&#x8ba1;&#x4e3a; GET &#x8def;&#x7531;&#xff0c;&#x8fd4;&#x56de;&#x7528;&#x6237;&#x7684;&#x6709;&#x6548;&#x7b56;&#x7565;&#xff0c;&#x4f7f;&#x7528;&#x6e05;&#x6670;&#x7684;&#x54cd;&#x5e94;&#x6a21;&#x578b;&#x548c;&#x9002;&#x5f53;&#x7684;&#x72b6;&#x6001;&#x7801;&#x3002;","children":[],"payload":{"tag":"li","lines":"551,552"}},{"content":"I designed the /ingest/policy endpoint as a GET route that returns the user&#x2019;s effective policy, using a clear response model and proper status codes.","children":[],"payload":{"tag":"li","lines":"552,553"}}],"payload":{"tag":"li","lines":"550,553"}},{"content":"&#x2464; &#x4ee3;&#x7801; &#xb7; Code&#xff1a;<code>apps/api/src/govapi/routers/ingest.py @ 02c042f</code> &#xb7; &#x4ee3;&#x7801;&#x5728;&#x79c1;&#x6709;&#x4ed3;&#x5e93;&#xff0c;&#x672c;&#x5730;&#x5bfc;&#x56fe;&#x91cc;&#x770b; &#xb7; private repo, see the local map","children":[],"payload":{"tag":"li","lines":"553,554"}},{"content":"&#x2465; &#x8bc1;&#x636e; &#xb7; Evidence&#xff08;2026-09-22&#xff09;","children":[{"content":"&quot;feat(api): GET /ingest/policy &#x2014; desktop clients fetch their bound user&apos;s effective policy with ETag caching (spec R8a)&quot;","children":[],"payload":{"tag":"li","lines":"555,557"}}],"payload":{"tag":"li","lines":"554,557"}}],"payload":{"tag":"h4","lines":"522,523"}},{"content":"API &#x8bbe;&#x8ba1;&#x4e0e; REST &#x2013; &#x5e42;&#x7b49;&#x7aef;&#x70b9; &#xb7; API Design &amp; REST &#x2013; Idempotent Endpoints","children":[{"content":"&#x2460; &#x901a;&#x7528;&#x56de;&#x7b54; &#xb7; General answer","children":[{"content":"&#x5e42;&#x7b49;&#x7aef;&#x70b9;&#x53ef;&#x4ee5;&#x5b89;&#x5168;&#x91cd;&#x8bd5;&#x800c;&#x4e0d;&#x4f1a;&#x4ea7;&#x751f;&#x91cd;&#x590d;&#x526f;&#x4f5c;&#x7528;&#xff1b;&#x5b83;&#x901a;&#x5e38;&#x4f7f;&#x7528;&#x76f8;&#x540c;&#x7684; HTTP &#x65b9;&#x6cd5;&#xff0c;&#x5e76;&#x5bf9;&#x76f8;&#x540c;&#x8bf7;&#x6c42;&#x8fd4;&#x56de;&#x76f8;&#x540c;&#x7ed3;&#x679c;&#x3002;","children":[],"payload":{"tag":"li","lines":"560,561"}},{"content":"An idempotent endpoint can be safely retried without causing duplicate side effects; it typically uses the same HTTP method and returns the same result for identical requests.","children":[],"payload":{"tag":"li","lines":"561,562"}}],"payload":{"tag":"li","lines":"559,562"}},{"content":"&#x2461; &#x539f;&#x7406; &#xb7; How it works","children":[{"content":"\n<pre data-lines=\"563,576\"><code class=\"language-text\">&#x6bcf;&#x6761;&#x8bb0;&#x5f55;&#x6309;&#x81ea;&#x7136;&#x952e;&#x67e5;&#x5230;&#x5c31;&#x7528;&#x3001;&#x6ca1;&#x6709;&#x624d;&#x5efa; &#xb7; get-or-create by natural key\n  run 1                          run 2 (&#x6216;&#x5931;&#x8d25;&#x540e;&#x91cd;&#x8dd1; rerun)\n  group &quot;Finance&quot; ?  &#x65e0; &#x2500;&#x25b6; &#x521b;&#x5efa;     &#x6709; &#x2500;&#x25b6; &#x590d;&#x7528; id\n  policy &quot;Cards&quot;  ?  &#x65e0; &#x2500;&#x25b6; &#x521b;&#x5efa;     &#x6709; &#x2500;&#x25b6; &#x590d;&#x7528;\n  client &quot;Demo laptop A&quot;? &#x65e0; &#x2500;&#x25b6; &#x5efa;  &#x6709; &#x2500;&#x25b6; &#x590d;&#x7528;\n  event client_event_id=demo-0001 &#x2500;&#x25b6; ingest &#x8fd4;&#x56de;&#x5df2;&#x5b58;&#x5728;&#x4e8b;&#x4ef6; existing\n  random.Random(SEED)  &#x6bcf;&#x6b21;&#x6309;&#x540c;&#x6837;&#x987a;&#x5e8f;&#x62bd;&#x53d6; &#xb7; same draws, same order\n        &#x25bc;\n  &#x72b6;&#x6001; state(run 1) == &#x72b6;&#x6001; state(run 2)   &#x5b8c;&#x6210;&#x7684;&#x8fd0;&#x884c;&#x4ec0;&#x4e48;&#x90fd;&#x4e0d;&#x6539;\n  &#x5199;&#x5165;&#x8d70;&#x771f;&#x5b9e; service / ingest / worker&#xff0c;&#x4e0d;&#x76f4;&#x63a5;&#x63d2;&#x8868; &#xb7; through the real code path\n&#x81ea;&#x7136;&#x952e;&#x82e5;&#x88ab;&#x6539;&#x540d;&#x5c31;&#x4f1a;&#x91cd;&#x590d;&#x521b;&#x5efa;&#xff1b;&#x9700;&#x552f;&#x4e00;&#x7ea6;&#x675f;&#x515c;&#x5e95; &#xb7; needs a unique key to be safe\n</code></pre>","children":[],"payload":{"tag":"li","lines":"563,576"}}],"payload":{"tag":"li","lines":"562,576"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;&#x6f14;&#x793a;&#x79cd;&#x5b50;&#x8d70;&#x771f;&#x5b9e;&#x7684;&#x670d;&#x52a1;&#x3001;&#x4e0a;&#x62a5;&#x8def;&#x5f84;&#x548c; worker&#xff0c;&#x6309;&#x540d;&#x79f0;&#x6216; client_event_id &#x53d6;&#x5df2;&#x6709;&#x3001;&#x6ca1;&#x6709;&#x624d;&#x5efa;&#xff0c;&#x53ef;&#x4e2d;&#x65ad;&#x7eed;&#x8dd1;&#xff0c;&#x8dd1;&#x4e24;&#x6b21;&#x7ed3;&#x679c;&#x4e0d;&#x53d8; &#xb7; the demo seed goes through real services and the worker, get-or-create by name or client_event_id, resumable and idempotent","children":[],"payload":{"tag":"li","lines":"577,578"}},{"content":"&#x4e0d;&#x7528; &#x5f00;&#x5934;&#x67e5;&#x6807;&#x8bb0;&#x5c31;&#x76f4;&#x63a5;&#x8fd4;&#x56de; &#xb7; Not an early-return marker&#xff1a;&#x7b2c;&#x4e00;&#x6b21;&#x771f;&#x5b9e;&#x8fd0;&#x884c;&#x4e2d;&#x9014;&#x5931;&#x8d25;&#xff0c;&#x6807;&#x8bb0;&#x628a;&#x534a;&#x6210;&#x54c1;&#x72b6;&#x6001;&#x85cf;&#x4f4f;&#x4e86;&#xff0c;&#x6240;&#x4ee5;&#x6539;&#x6210;&#x53ef;&#x7eed;&#x8dd1; &#xb7; the first real run failed half-way and the marker hid the partial state, so it became resumable","children":[],"payload":{"tag":"li","lines":"578,579"}},{"content":"&#x4e0d;&#x7528; &#x76f4;&#x63a5;&#x5199; SQL &#x56fa;&#x5b9a;&#x6570;&#x636e; &#xb7; Not raw SQL fixtures&#xff1a;&#x4e8b;&#x4ef6;&#x548c;&#x5386;&#x53f2;&#x94fe;&#x8981;&#x7531;&#x751f;&#x4ea7;&#x4ee3;&#x7801;&#x4ea7;&#x751f;&#xff0c;&#x624d;&#x80fd;&#x8bc1;&#x660e;&#x6574;&#x6761;&#x94fe;&#x8def;&#x662f;&#x901a;&#x7684; &#xb7; incidents and the hash chain must come from production code to prove the path works","children":[],"payload":{"tag":"li","lines":"579,580"}},{"content":"&#x4e0d;&#x7528; &#x6bcf;&#x6b21;&#x6e05;&#x5e93;&#x91cd;&#x704c; &#xb7; Not truncate and reseed&#xff1a;&#x4f1a;&#x5220;&#x6389;&#x64cd;&#x4f5c;&#x5458;&#x624b;&#x5de5;&#x9020;&#x7684;&#x6570;&#x636e;&#xff0c;&#x8fd8;&#x4f1a;&#x6253;&#x65ad;&#x54c8;&#x5e0c;&#x94fe; &#xb7; wipes operator-made data and breaks the history chain","children":[],"payload":{"tag":"li","lines":"580,581"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x6bcf;&#x6b65;&#x90fd;&#x8981;&#x5148;&#x67e5;&#x518d;&#x5199;&#xff0c;&#x6bd4;&#x4e00;&#x6b21;&#x6027;&#x63d2;&#x5165;&#x6162;&#xff1b;&#x968f;&#x673a;&#x62bd;&#x53d6;&#x5fc5;&#x987b;&#x6309;&#x56fa;&#x5b9a;&#x987a;&#x5e8f;&#x624d;&#x80fd;&#x4fdd;&#x8bc1;&#x786e;&#x5b9a;&#x6027; &#xb7; every step reads before writing, and random draws must run in a fixed order to stay deterministic","children":[],"payload":{"tag":"li","lines":"581,582"}},{"content":"&#x6765;&#x6e90; &#xb7; Source&#xff1a;docs/plans/2026-09-22-m3b-web.md&#xff08;&#x504f;&#x5dee;&#x4e00;&#x8282;&#xff1a;&#x6807;&#x8bb0;&#x7b56;&#x7565;&#x85cf;&#x4f4f;&#x534a;&#x6210;&#x54c1;&#xff0c;&#x6539;&#x4e3a;&#x53ef;&#x7eed;&#x8dd1;&#xff09;&#xff1b;spec R15a &#x8981;&#x6c42;&#x8d70;&#x771f;&#x5b9e;&#x670d;&#x52a1; &#xb7; docs/plans/2026-09-22-m3b-web.md deviations; spec R15a requires real services","children":[],"payload":{"tag":"li","lines":"582,583"}}],"payload":{"tag":"li","lines":"576,583"}},{"content":"&#x2463; &#x6211;&#x7684;&#x6848;&#x4f8b; &#xb7; My case","children":[{"content":"&#x6211;&#x6dfb;&#x52a0;&#x4e86;&#x4e00;&#x4e2a;&#x5408;&#x6210;&#x6f14;&#x793a;&#x79cd;&#x5b50;&#x7aef;&#x70b9;&#xff0c;&#x4ec5;&#x5728;&#x8bb0;&#x5f55;&#x4e0d;&#x5b58;&#x5728;&#x65f6;&#x5199;&#x5165;&#x6570;&#x636e;&#x5e93;&#xff0c;&#x786e;&#x4fdd;&#x91cd;&#x590d;&#x8bf7;&#x6c42;&#x4ea7;&#x751f;&#x76f8;&#x540c;&#x72b6;&#x6001;&#x3002;","children":[],"payload":{"tag":"li","lines":"584,585"}},{"content":"I added a synthetic demo seed endpoint that writes to the database only if the record does not already exist, ensuring that repeated requests produce the same state.","children":[],"payload":{"tag":"li","lines":"585,586"}}],"payload":{"tag":"li","lines":"583,586"}},{"content":"&#x2464; &#x4ee3;&#x7801; &#xb7; Code&#xff1a;<code>apps/api/src/govapi/demo.py @ 9de1317</code> &#xb7; &#x4ee3;&#x7801;&#x5728;&#x79c1;&#x6709;&#x4ed3;&#x5e93;&#xff0c;&#x672c;&#x5730;&#x5bfc;&#x56fe;&#x91cc;&#x770b; &#xb7; private repo, see the local map","children":[],"payload":{"tag":"li","lines":"586,587"}},{"content":"&#x2465; &#x8bc1;&#x636e; &#xb7; Evidence&#xff08;2026-09-22&#xff09;","children":[{"content":"&quot;feat(api): synthetic demo seed through the real services, ingest path and worker; resumable and idempotent (R15a)&quot;","children":[],"payload":{"tag":"li","lines":"588,589"}}],"payload":{"tag":"li","lines":"587,589"}},{"content":"&#x9762;&#x8bd5;&#x600e;&#x4e48;&#x95ee; &#xb7; Asked as&#xff1a;&#x4f60;&#x4f1a;&#x5982;&#x4f55;&#x8bbe;&#x8ba1;&#x4e00;&#x4e2a;&#x5e42;&#x7b49;&#x7684; API &#x7aef;&#x70b9;&#xff1f; &#xb7; How would you design an idempotent API endpoint?","children":[],"payload":{"tag":"li","lines":"589,591"}}],"payload":{"tag":"h4","lines":"557,558"}},{"content":"&#x9a8c;&#x8bc1;&#x548c;&#x51b2;&#x7a81;&#x7684; HTTP &#x72b6;&#x6001;&#x7801; &#xb7; HTTP status codes for validation and conflict","children":[{"content":"&#x2460; &#x901a;&#x7528;&#x56de;&#x7b54; &#xb7; General answer","children":[{"content":"&#x9a8c;&#x8bc1;&#x5931;&#x8d25;&#x65f6;&#x8fd4;&#x56de; 422 Unprocessable Entity&#xff0c;&#x8d44;&#x6e90;&#x51b2;&#x7a81;&#x65f6;&#x8fd4;&#x56de; 409 Conflict&#xff0c;&#x683c;&#x5f0f;&#x9519;&#x8bef;&#x7684;&#x8bf7;&#x6c42;&#x8fd4;&#x56de; 400 Bad Request&#x3002;&#x8fd9;&#x6837;&#x53ef;&#x4ee5;&#x6e05;&#x6670;&#x5730;&#x5411;&#x5ba2;&#x6237;&#x7aef;&#x8bf4;&#x660e;&#x9519;&#x8bef;&#x7c7b;&#x578b;&#x3002;","children":[],"payload":{"tag":"li","lines":"594,595"}},{"content":"Return 422 Unprocessable Entity for validation failures, 409 Conflict when a resource has changed since the client last fetched it, and 400 Bad Request for malformed input. These codes clearly communicate the nature of the error to the client.","children":[],"payload":{"tag":"li","lines":"595,596"}}],"payload":{"tag":"li","lines":"593,596"}},{"content":"&#x2461; &#x539f;&#x7406; &#xb7; How it works","children":[{"content":"\n<pre data-lines=\"597,611\"><code class=\"language-text\">&#x9884;&#x89c8;&#x5e26;&#x7248;&#x672c;&#x6458;&#x8981;&#xff0c;&#x5e94;&#x7528;&#x65f6;&#x6bd4;&#x5bf9;&#xff1b;&#x7f3a;&#x4e86; 422&#xff0c;&#x53d8;&#x4e86; 409 &#xb7; preview digest, apply compares\n  POST confirm-enforce {}         &#x2500;&#x25b6; 200 impact + preview_version=sha256(&#x72b6;&#x6001;)\n        &#x72b6;&#x6001; = pending, rules, priority, active, users, groups, impact\n  POST {dry_run:false}                 &#x2500;&#x25b6; 422  &#x8bf7;&#x6c42;&#x672c;&#x8eab;&#x4e0d;&#x5b8c;&#x6574; malformed request\n  POST {dry_run:false, version:v1}\n        &#x25bc;\n  SELECT policy ... FOR UPDATE  (&#x5e94;&#x7528;&#x671f;&#x95f4;&#x9501;&#x884c; row locked while applying)\n  &#x91cd;&#x65b0;&#x8ba1;&#x7b97; recompute v_now\n        &#x251c;&#x2500;&#x2500; v_now &#x2260; v1 &#x2500;&#x2500;&#x25b6; 409 Conflict &quot;policy changed since the preview&quot;\n        &#x2514;&#x2500;&#x2500; v_now = v1 &#x2500;&#x2500;&#x25b6; mode=enforce &#x2500;&#x25b6; commit &#x2500;&#x25b6; 200\n  &#x524d;&#x7aef;&#x6536;&#x5230; 409 &#x2500;&#x25b6; &#x91cd;&#x65b0;&#x52a0;&#x8f7d;&#x9884;&#x89c8; reload preview\n&#x6458;&#x8981;&#x6f0f;&#x6389;&#x4efb;&#x4e00;&#x5f71;&#x54cd;&#x56e0;&#x7d20;&#x5c3 ":{"tag":"li","lines":"651,652"}},{"content":"&#x6765;&#x6e90; &#xb7; Source&#xff1a;e607f3d&#xff08;preview_version&#xff1a;&#x7f3a;&#x5931; 422&#xff0c;&#x7b56;&#x7565;&#x5df2;&#x53d8; 409&#xff09; &#xb7; e607f3d: missing preview_version gives 422, a changed policy gives 409","children":[],"payload":{"tag":"li","lines":"652,653"}}],"payload":{"tag":"li","lines":"646,653"}},{"content":"&#x2463; &#x6211;&#x7684;&#x6848;&#x4f8b; &#xb7; My case","children":[{"content":"&#x6211;&#x66f4;&#x65b0;&#x4e86; confirm-enforce&#xff0c;&#x4f7f;&#x5176;&#x5728; preview_version &#x7f3a;&#x5931;&#x65f6;&#x8fd4;&#x56de; 422&#xff0c;&#x5728;&#x7b56;&#x7565;&#x66f4;&#x6539;&#x65f6;&#x8fd4;&#x56de; 409&#xff0c;&#x7b26;&#x5408; API &#x5408;&#x540c;&#x3002;","children":[],"payload":{"tag":"li","lines":"654,655"}},{"content":"I updated confirm-enforce to return 422 when preview_version is missing and 409 when the policy changed, matching the API contract.","children":[],"payload":{"tag":"li","lines":"655,656"}}],"payload":{"tag":"li","lines":"653,656"}},{"content":"&#x2464; &#x4ee3;&#x7801; &#xb7; Code&#xff1a;<code>apps/api/src/govapi/schemas/policies.py @ e607f3d</code> &#xb7; &#x4ee3;&#x7801;&#x5728;&#x79c1;&#x6709;&#x4ed3;&#x5e93;&#xff0c;&#x672c;&#x5730;&#x5bfc;&#x56fe;&#x91cc;&#x770b; &#xb7; private repo, see the local map","children":[],"payload":{"tag":"li","lines":"656,657"}},{"content":"&#x2465; &#x8bc1;&#x636e; &#xb7; Evidence&#xff08;2026-09-23&#xff09;","children":[{"content":"&quot;fix: confirm-enforce applies exactly the reviewed preview (audit M2)&quot;","children":[],"payload":{"tag":"li","lines":"658,660"}}],"payload":{"tag":"li","lines":"657,660"}}],"payload":{"tag":"h4","lines":"626,627"}}],"payload":{"tag":"h3","lines":"520,521"}},{"content":"&#x5e76;&#x53d1;&#x4e0e;&#x5f02;&#x6b65; &#xb7; Concurrency &amp; Async","children":[{"content":"&#x884c;&#x7ea7;&#x9501;&#x5b9a;&#x4ee5;&#x9632;&#x6b62;&#x7ade;&#x4e89;&#x6761;&#x4ef6; &#xb7; Row-level locking to prevent race conditions","children":[{"content":"&#x2460; &#x901a;&#x7528;&#x56de;&#x7b54; &#xb7; General answer","children":[{"content":"&#x5728;&#x4e8b;&#x52a1;&#x4e2d;&#x4f7f;&#x7528; <code>SELECT &#x2026; FOR UPDATE</code> &#x7b49;&#x884c;&#x7ea7;&#x9501;&#xff0c;&#x786e;&#x4fdd;&#x540c;&#x4e00;&#x884c;&#x53ea;&#x80fd;&#x88ab;&#x4e00;&#x4e2a;&#x4f1a;&#x8bdd;&#x4fee;&#x6539;&#xff0c;&#x76f4;&#x5230;&#x4e8b;&#x52a1;&#x63d0;&#x4ea4;&#xff0c;&#x4ece;&#x800c;&#x907f;&#x514d;&#x7ade;&#x4e89;&#x6761;&#x4ef6;&#x3002;","children":[],"payload":{"tag":"li","lines":"665,666"}},{"content":"Use row-level locking such as <code>SELECT &#x2026; FOR UPDATE</code> inside a transaction to prevent concurrent updates to the same record. This ensures that only one session can modify a row until the transaction commits, thereby avoiding race conditions.","children":[],"payload":{"tag":"li","lines":"666,667"}}],"payload":{"tag":"li","lines":"664,667"}},{"content":"&#x2461; &#x539f;&#x7406; &#xb7; How it works","children":[{"content":"\n<pre data-lines=\"668,681\"><code class=\"language-text\">&#x68c0;&#x67e5;&#x548c;&#x5199;&#x5165;&#x5728;&#x540c;&#x4e00;&#x628a;&#x884c;&#x9501;&#x91cc;&#xff0c;&#x53e6;&#x4e00;&#x4e2a;&#x4e8b;&#x52a1;&#x53ea;&#x80fd;&#x7b49; &#xb7; check and write under one row lock\n  &#x6ca1;&#x9501; without lock:\n    T1 &#x8bfb; status=open &#x2500;&#x2510;           T1 &#x5199; resolved\n    T2 &#x8bfb; status=open &#x2500;&#x2534;&#x2500; &#x90fd;&#x901a;&#x8fc7;&#x68c0;&#x67e5; &#x2500; T2 &#x5199; dismissed   &#x2190; &#x4e24;&#x6b21;&#x7ec8;&#x6001;&#x8f6c;&#x6362; double\n  &#x6709;&#x9501; with SELECT ... FOR UPDATE:\n    T1 &#x2500;&#x2500; lock row &#x2500;&#x2500; &#x68c0;&#x67e5; open&#x2192;resolved &#x2500;&#x2500; &#x5199; &#x2500;&#x2500; COMMIT (&#x91ca;&#x653e;)\n    T2 &#x2500;&#x2500; lock row &#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7; &#x7b49;&#x5f85; wait &#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#x25b6; &#x8bfb;&#x5230; resolved\n                                                    &#x2514;&#x2500; &#x4e0d;&#x5141;&#x8bb8;&#x8f6c;&#x6362; &#x2500;&#x25b6; 400\n  with_for_update(of=Incident) &#x53ea;&#x9501;&#x4e8b;&#x4ef6;&#x884c; &#xb7; lock only the incident row\n  populate_existing=True  &#x8ba9;&#x4f1a;&#x8bdd;&#x91cc;&#x7684;&#x65e7;&#x5bf9;&#x8c61;&#x88ab;&#x65b0;&#x503c;&#x8986;&#x76d6; &#xb7; refresh the identity map\n&#x9501;&#x6301;&#x6709;&#x5230;&#x4e8b;&#x52a1;&#x7ed3;&#x675f;&#xff1b;&#x4e8b;&#x52a1;&#x91cc;&#x522b;&#x505a;&#x6162; I/O&#xff0c;&#x5426;&#x5219;&#x6392;&#x961f;&#x53d8;&#x957f; &#xb7; keep the locked txn short\n</code></pre>","children":[],"payload":{"tag":"li","lines":"668,681"}}],"payload":{"tag":"li","lines":"667,681"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;IncidentRepository.get &#x52a0; for_update&#xff0c;transition() &#x5728;&#x4e8b;&#x52a1;&#x91cc;&#x7528; SELECT ... FOR UPDATE &#x8bfb;&#x4e8b;&#x4ef6;&#x5355;&#xff0c;&#x68c0;&#x67e5;&#x72b6;&#x6001;&#x548c;&#x5199;&#x5165;&#x4e0d;&#x4f1a;&#x88ab;&#x4ea4;&#x9519; &#xb7; get(for_update=True) so transition() reads with SELECT ... FOR UPDATE, and the check and write cannot interleave","children":[],"payload":{"tag":"li","lines":"682,683"}},{"content":"&#x4e0d;&#x7528; &#x4e50;&#x89c2;&#x9501;&#x7248;&#x672c;&#x5217; &#xb7; Not an optimistic version column&#xff1a;&#x8981;&#x52a0;&#x8fc1;&#x79fb;&#xff0c;&#x51b2;&#x7a81;&#x65f6;&#x8ba9;&#x8c03;&#x7528;&#x65b9;&#x91cd;&#x8bd5;&#xff1b;&#x8fd9;&#x91cc;&#x5e76;&#x53d1;&#x4f4e;&#xff0c;&#x6392;&#x961f;&#x7b49;&#x9501;&#x66f4;&#x7b80;&#x5355; &#xb7; needs a migration and caller retries; with low contention, waiting on the lock is simpler","children":[],"payload":{"tag":"li","lines":"683,684"}},{"content":"&#x4e0d;&#x7528; SERIALIZABLE &#x9694;&#x79bb;&#x7ea7;&#x522b; &#xb7; Not SERIALIZABLE isolation&#xff1a;&#x6574;&#x4e2a;&#x4e8b;&#x52a1;&#x90fd;&#x8981;&#x51c6;&#x5907;&#x91cd;&#x8bd5;&#xff0c;&#x5f71;&#x54cd;&#x9762;&#x6bd4;&#x9501;&#x4e00;&#x884c;&#x5927;&#x5f97;&#x591a; &#xb7; every transaction must be ready to retry, far wider than locking one row","children":[],"payload":{"tag":"li","lines":"684,685"}},{"content":"&#x4e0d;&#x7528; &#x8fdb;&#x7a0b;&#x5185;&#x4e92;&#x65a5;&#x9501; &#xb7; Not an in-process mutex&#xff1a;&#x591a;&#x4e2a; API &#x8fdb;&#x7a0b;&#x6216; worker &#x4e4b;&#x95f4;&#x4e0d;&#x751f;&#x6548; &#xb7; does nothing across several API processes or workers","children":[],"payload":{"tag":"li","lines":"685,686"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x7b2c;&#x4e8c;&#x4e2a;&#x8bf7;&#x6c42;&#x8981;&#x7b49;&#x7b2c;&#x4e00;&#x4e2a;&#x63d0;&#x4ea4;&#xff1b;&#x9501;&#x7684;&#x987a;&#x5e8f;&#x4e0d;&#x4e00;&#x81f4;&#x65f6;&#x53ef;&#x80fd;&#x6b7b;&#x9501; &#xb7; the second request waits for the first to commit, and inconsistent lock order can deadlock","children":[],"payload":{"tag":"li","lines":"686,687"}},{"content":"&#x6765;&#x6e90; &#xb7; Source&#xff1a;8d9b7a9&#xff08;FOR UPDATE &#x540e;&#xff0c;&#x7b2c;&#x4e8c;&#x4e2a;&#x5e76;&#x53d1;&#x7ec8;&#x6001;&#x6d41;&#x8f6c;&#x770b;&#x5230;&#x65b0;&#x72b6;&#x6001;&#x5e76;&#x5f97;&#x5230; 400&#xff09;&#xff1b;&#x5907;&#x9009;&#x90e8;&#x5206;&#x4e3a;&#x901a;&#x7528;&#x7406;&#x7531; &#xb7; 8d9b7a9 records the lock and the 400 for the second transition; the alternatives are general","children":[],"payload":{"tag":"li","lines":"687,688"}}],"payload":{"tag":"li","lines":"681,688"}},{"content":"&#x2463; &#x6211;&#x7684;&#x6848;&#x4f8b; &#xb7; My case","children":[{"content":"&#x6211;&#x5728; IncidentRepository.get &#x4e2d;&#x6dfb;&#x52a0;&#x4e86; for_update &#x6807;&#x5fd7;&#xff0c;&#x5e76;&#x5728; transition &#x65b9;&#x6cd5;&#x4e2d;&#x4f7f;&#x7528; SELECT ... FOR UPDATE &#x9501;&#x5b9a;&#x4e8b;&#x4ef6;&#x884c;&#xff0c;&#x786e;&#x4fdd;&#x5e76;&#x53d1; triager &#x8f6c;&#x6362;&#x4e0d;&#x4f1a;&#x4ea4;&#x9519;&#x3002;","children":[],"payload":{"tag":"li","lines":"689,690"}},{"content": ext\">&#x53ea;&#x4fe1;&#x4efb;&#x53ef;&#x4fe1;&#x4ee3;&#x7406;&#x8ffd;&#x52a0;&#x7684;&#x90e8;&#x5206;&#xff0c;&#x4ece;&#x53f3;&#x6570;&#x8df3;&#x6570; &#xb7; trust proxy-added entries, from right\n  &#x5ba2;&#x6237;&#x7aef; client &#x2500;&#x25b6; &#x8d1f;&#x8f7d;&#x5747;&#x8861; LB &#x2500;&#x25b6; API\n  X-Forwarded-For: &quot;&lt;&#x5ba2;&#x6237;&#x7aef;&#x81ea;&#x586b; forged&gt;, &lt;LB &#x770b;&#x5230;&#x7684;&#x5730;&#x5740; seen by LB&gt;&quot;\n                     &#x25b2; &#x6700;&#x5de6;&#xff1a;&#x5ba2;&#x6237;&#x7aef;&#x968f;&#x4fbf;&#x5199;        &#x25b2; &#x6700;&#x53f3;&#xff1a;&#x53ef;&#x4fe1;&#x4ee3;&#x7406;&#x8ffd;&#x52a0;\n  trust_proxy_headers = false &#x2500;&#x25b6; &#x76f4;&#x63a5;&#x7528; TCP &#x5bf9;&#x7aef;&#x5730;&#x5740; peer address\n  trust_proxy_headers = true, hops = 1\n        &#x251c;&#x2500;&#x2500; &#x6761;&#x76ee;&#x6570; &#x2265; hops &#x2500;&#x25b6; entries[-hops]   (&#x53f3;&#x6570;&#x7b2c; 1 &#x4e2a;)\n        &#x2514;&#x2500;&#x2500; &#x6761;&#x76ee;&#x4e0d;&#x8db3; &#x2500;&#x25b6; &#x56de;&#x9000;&#x5230;&#x5bf9;&#x7aef;&#x5730;&#x5740; fall back to peer\n  &#x7528;&#x9014; use: &#x9650;&#x6d41;&#x952e; rate-limit key&#x3001;&#x5ba1;&#x8ba1; audit\n&#x53d6;&#x6700;&#x5de6;&#x503c;&#x53ef;&#x88ab;&#x4f2a;&#x9020;&#x7ed5;&#x8fc7;&#x9650;&#x6d41;&#xff1b;&#x8df3;&#x6570;&#x914d;&#x9519;&#x4e5f;&#x4f1a;&#x9519; &#xb7; leftmost is spoofable; so is bad hops\n</code></pre>","children":[],"payload":{"tag":"li","lines":"810,822"}}],"payload":{"tag":"li","lines":"809,822"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;&#x9ed8;&#x8ba4;&#x4e0d;&#x4fe1; X-Forwarded-For&#xff1b;&#x53ea;&#x6709;&#x5f00;&#x5173;&#x6253;&#x5f00;&#x65f6;&#xff0c;&#x624d;&#x4ece;&#x53f3;&#x5f80;&#x5de6;&#x6570;&#x5230;&#x53ef;&#x4fe1;&#x4ee3;&#x7406;&#x7684;&#x8df3;&#x6570;&#x53d6;&#x5730;&#x5740;&#xff0c;&#x6761;&#x76ee;&#x4e0d;&#x591f;&#x5c31;&#x7528;&#x5bf9;&#x7aef;&#x5730;&#x5740; &#xb7; ignore X-Forwarded-For by default; when enabled, count trusted hops from the right, falling back to the peer","children":[],"payload":{"tag":"li","lines":"823,824"}},{"content":"&#x4e0d;&#x7528; &#x53d6;&#x6700;&#x5de6;&#x8fb9;&#x7684; IP &#xb7; Not the leftmost entry&#xff1a;&#x6700;&#x5de6;&#x8fb9;&#x662f;&#x5ba2;&#x6237;&#x7aef;&#x81ea;&#x5df1;&#x586b;&#x7684;&#xff0c;&#x4f2a;&#x9020;&#x4e00;&#x4e2a;&#x5c31;&#x80fd;&#x7ed5;&#x8fc7;&#x6309; IP &#x9650;&#x6d41; &#xb7; the leftmost entry is client-supplied, so a fake one bypasses per-IP rate limits","children":[],"payload":{"tag":"li","lines":"824,825"}},{"content":"&#x4e0d;&#x7528; &#x6c38;&#x8fdc;&#x53ea;&#x7528;&#x5bf9;&#x7aef;&#x5730;&#x5740; &#xb7; Not only the peer address&#xff1a;&#x5728;&#x8d1f;&#x8f7d;&#x5747;&#x8861;&#x540e;&#x9762;&#xff0c;&#x6240;&#x6709;&#x8bf7;&#x6c42;&#x770b;&#x8d77;&#x6765;&#x90fd;&#x6765;&#x81ea;&#x540c;&#x4e00;&#x4e2a; IP &#xb7; behind a load balancer every request looks like one IP","children":[],"payload":{"tag":"li","lines":"825,826"}},{"content":"&#x4e0d;&#x7528; &#x65e0;&#x6761;&#x4ef6;&#x4fe1;&#x4efb; X-Real-IP / Forwarded &#xb7; Not trusting X-Real-IP or Forwarded blindly&#xff1a;&#x540c;&#x6837;&#x53ef;&#x4ee5;&#x4f2a;&#x9020;&#xff0c;&#x53ea;&#x6709;&#x53ef;&#x4fe1;&#x4ee3;&#x7406;&#x5199;&#x7684;&#x90a3;&#x4e00;&#x6bb5;&#x624d;&#x53ef;&#x4fe1; &#xb7; just as forgeable; only the part written by a trusted proxy counts","children":[],"payload":{"tag":"li","lines":"826,827"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x8df3;&#x6570;&#x5fc5;&#x987b;&#x548c;&#x771f;&#x5b9e;&#x90e8;&#x7f72;&#x62d3;&#x6251;&#x4e00;&#x81f4;&#xff0c;&#x591a;&#x52a0;&#x4e00;&#x5c42; CDN &#x5fd8;&#x4e86;&#x6539;&#x5c31;&#x4f1a;&#x53d6;&#x9519;&#x5730;&#x5740; &#xb7; the hop count must match the real topology; adding a CDN layer without updating it picks the wrong address","children":[],"payload":{"tag":"li","lines":"827,828"}},{"content":"&#x6765;&#x6e9  SQL\n            &#x25bc;\n          Repository  &#x552f;&#x4e00;&#x78b0; ORM / &#x4f1a;&#x8bdd; / SQL &#x7684;&#x5c42; only SQL   &#x65e0; HTTP &#x6982;&#x5ff5;\n            &#x25bc;\n          Model       &#x8868;&#x7ed3;&#x6784;&#x4e0e;&#x7ea6;&#x675f; tables + constraints\n  &#x7ec4;&#x5408;&#x6839; composition root: core/deps.py &#x628a;&#x4f1a;&#x8bdd; &#x2500;&#x25b6; &#x4ed3;&#x50a8; &#x2500;&#x25b6; &#x670d;&#x52a1; &#x63a5;&#x8d77;&#x6765;\n  &#x5b88;&#x95e8; guard: tests/test_layering.py &#x7528; AST &#x8ba9;&#x8d8a;&#x5c42; import &#x5931;&#x8d25;\n  &#x5148;&#x5199;&#x8fdb; CLAUDE.md &#x5f53;&#x89c4;&#x5219;&#xff0c;&#x518d;&#x7528;&#x6d4b;&#x8bd5;&#x6267;&#x884c; &#xb7; rule in CLAUDE.md, enforced by a test\n&#x5c0f;&#x529f;&#x80fd;&#x4e5f;&#x8981;&#x7a7f;&#x8fc7;&#x56db;&#x5c42;&#xff0c;&#x6837;&#x677f;&#x591a;&#xff1b;&#x6362;&#x6765;&#x53ef;&#x6d4b; &#xb7; more boilerplate, easier to test\n</code></pre>","children":[],"payload":{"tag":"li","lines":"906,920"}}],"payload":{"tag":"li","lines":"905,920"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;Router &#x2192; Service &#x2192; Repository &#x2192; Model&#xff0c;&#x8def;&#x7531;&#x53ea;&#x6821;&#x9a8c;&#x548c;&#x7ec4;&#x88c5;&#x54cd;&#x5e94;&#xff0c;&#x53ea;&#x6709; Repository &#x78b0; ORM&#xff0c;&#x7531; AST &#x6d4b;&#x8bd5;&#x5f3a;&#x5236; &#xb7; Router &#x2192; Service &#x2192; Repository &#x2192; Model, only repositories touch the ORM, enforced by an AST test","children":[],"payload":{"tag":"li","lines":"921,922"}},{"content":"&#x4e0d;&#x7528; &#x80d6;&#x8def;&#x7531; &#xb7; Not fat routers&#xff1a;&#x4e1a;&#x52a1;&#x903b;&#x8f91;&#x548c; HTTP &#x6df7;&#x5728;&#x4e00;&#x8d77;&#xff0c;worker &#x548c; CLI &#x6ca1;&#x6cd5;&#x590d;&#x7528;&#x540c;&#x4e00;&#x4efd;&#x903b;&#x8f91; &#xb7; mixes business logic with HTTP, so the worker and CLI cannot reuse it","children":[],"payload":{"tag":"li","lines":"922,923"}},{"content":"&#x4e0d;&#x7528; Django Ninja &#xb7; Not Django Ninja&#xff1a;&#x7ed1;&#x5b9a; Django ORM &#x7684; Active Record &#x98ce;&#x683c;&#xff0c;&#x548c;&#x8fd9;&#x5957;&#x5206;&#x5c42;&#x4e0d;&#x8d34;&#x5408; &#xb7; tied to Django&apos;s active-record ORM, which does not fit this layering","children":[],"payload":{"tag":"li","lines":"923,924"}},{"content":"&#x4e0d;&#x7528; &#x5b8c;&#x6574;&#x7684;&#x516d;&#x8fb9;&#x5f62;&#x67b6;&#x6784; &#xb7; Not full hexagonal ports and adapters&#xff1a;&#x6bcf;&#x4e2a;&#x4f9d;&#x8d56;&#x90fd;&#x8981;&#x63a5;&#x53e3;&#x548c;&#x9002;&#x914d;&#x5668;&#xff0c;&#x8fd9;&#x4e2a;&#x89c4;&#x6a21;&#x4e0b;&#x662f;&#x8fc7;&#x5ea6;&#x8bbe;&#x8ba1; &#xb7; every dependency needs a port and adapter, which is overkill at this size","children":[],"payload":{"tag":"li","lines":"924,925"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x7b80;&#x5355;&#x7684; CRUD &#x4e5f;&#x8981;&#x7a7f;&#x8fc7;&#x56db;&#x5c42;&#xff0c;&#x6587;&#x4ef6;&#x591a;&#x3001;&#x6837;&#x677f;&#x591a; &#xb7; even simple CRUD crosses four layers, with more files and boilerplate","children":[],"payload":{"tag":"li","lines":"925,926"}},{"content":"&#x6765;&#x6e90; &#xb7; Source&#xff1a;docs/adr/0002-backend-and-frontend-stack.md&#xff08;SQLAlchemy &#x663e;&#x5f0f;&#x4f1a;&#x8bdd;&#x8ba9; Repository &#x6210;&#x4e3a;&#x552f;&#x4e00;&#x78b0; ORM &#x7684;&#x5c42;&#xff1b;Ninja &#x4e0d;&#x8d34;&#x5408;&#x5206;&#x5c42;&#xff09;&#xff1b;&#x516d;&#x8fb9;&#x5f62;&#x90e8;&#x5206;&#x4e3a;&#x901a;&#x7528;&#x7406;&#x7531; &#xb7; docs/adr/0002-backend-and-frontend-stack.md; the hexagonal reasoning is general","children":[],"payload":{"tag":"li","lines":"926,927"}}],"payload":{"tag":"li","lines":"920,927"}},{"content":"&#x2463; &#x6211;&#x7684;&#x6848;&#x4f8b; &#xb7; My case","children":[{"content":"&#x6211;&#x5df2;&#x5728; CLAUDE.md &#x4e2d;&#x8bb0;&#x5f55;&#x4e86;&#x5206;&#x5c42;&#xff0c;&#x4ee5;&#x786e;&#x4fdd;&#x8def;&#x7531;&#x5668;&#x4e0d;&#x5305;&#x542b;&#x4e1a;&#x52a1;&#x903b;&#x8f91;&#xff0c;&#x4ed3;&#x5e93;&#x4e0d;&#x5305;&#x542b; HTTP &#x5173;&#x6ce8;&#x70b9;&#x3002;","children":[],"payload":{"tag":"li","lines":"928,929"}},{"content":"I documented the layering in CLAUDE.md to ensure routers hold no business logic and repositories hold no HTTP concerns.","children":[],"payload":{"tag":"li","lines":"929,930"}}],"payload":{"tag":"li","lines":"927,930"}},{"content":"&#x2464; &#x4ee3;&#x7801; &#xb7; Code&#xff1a;<code>CLAUDE.md @ dfd89a4</code> &#xb7; &#x4ee3;&#x7801;&#x5728;&#x79c1;&#x6709;&#x4ed3;&#x5e93;&#xff0c;&#x672c;&#x5730;&#x5bfc;&#x56fe;&#x91cc;&#x770b; &#xb7; private repo, see the local map","children":[],"payload":{"tag":"li","lines":"930,931"}},{"content":"&#x2465; &#x8bc1;&#x636e; &#xb7; Evidence&#xff08;2026-09-22 @ dfd89a4&#xff09;","children":[{"content":"&quot;+Target layering: <code>Router &#x2192; Service &#x2192; Repository &#x2192; Model</code>; routers hold no business logic, repositories hold no HTTP concerns.&quot;","children":[],"payload":{"tag":"li","lines":"932,933"}}],"payload":{"tag":"li","lines":"931,933"}},{"content":"&#x9762;&#x8bd5;&#x600e;&#x4e48;&#x95ee; &#xb7; Asked as&#xff1a;&#x5982;&#x4f55;&#x6784;&#x5efa; API &#x4ee5;&#x4fdd;&#x6301;&#x5173;&#x6ce8;&#x70b9;&#x5206;&#x79bb;&#xff1f; &#xb7; How do you structure your API to maintain separation of concerns?","children":[],"payload":{"tag":"li","lines":"933,934"}},{"content":"&#x7ecf;&#x5178;&#x8ffd;&#x95ee; Classic follow-ups&#xff1a;How would you design a model ,","children":[],"payload":{"tag":"li","lines":"934,936"}}],"payload":{"tag":"h4","lines":"900,901"}}],"payload":{"tag":"h3","lines":"862,863"}},{"content":"&#x5e76;&#x53d1;&#x4e0e;&#x5f02;&#x6b65; &#xb7; Concurrency &amp; Async","children":[{"content":"&#x5f02;&#x6b65;&#x6570;&#x636e;&#x5e93;&#x64cd;&#x4f5c; &#xb7; Asynchronous database operations","children":[{"content":"&#x2460; &#x901a;&#x7528;&#x56de;&#x7b54; &#xb7; General answer","children":[{"content":"&#x4f7f;&#x7528;&#x5f02;&#x6b65; sessionmaker &#x548c; async &#x4e0a;&#x4e0b;&#x6587;&#x7ba1;&#x7406;&#x5668;&#x4ee5;&#x975e;&#x963b;&#x585e;&#x65b9;&#x5f0f;&#x6253;&#x5f00;&#x6570;&#x636e;&#x5e93;&#x8fde;&#x63a5;&#xff0c;&#x8ba9;&#x5176;&#x4ed6;&#x4efb;&#x52a1;&#x5728; I/O &#x7b49;&#x5f85;&#x671f;&#x95f4;&#x7ee7;&#x7eed;&#x6267;&#x884c;&#x3002;&#x901a;&#x8fc7;&#x5728; async &#x4e0a;&#x4e0b;&#x6587;&#x4e2d; await &#x67e5;&#x8be2;&#x7ed3;&#x679c;&#xff0c;&#x4fdd;&#x6301;&#x4e8b;&#x4ef6;&#x5faa;&#x73af;&#x54cd;&#x5e94;&#xff0c;&#x907f;&#x514d;&#x7ebf;&#x7a0b;&#x963b;&#x585e;&#x3002;","children":[],"payload":{"tag":"li","lines":"941,942"}},{"content":"Use an async sessionmaker and async context managers to open database connections in a non-blocking way, allowing other tasks to run while I/O waits. Await the query results within the async context to keep the event loop responsive and avoid thread-blocking operations.","children":[],"payload":{"tag":"li","lines":"942,943"}}],"payload":{"tag":"li","lines":"940,943"}},{"content":"&#x2461; &#x539f;&#x7406; &#xb7; How it works","children":[{"content":"\n<pre data-lines=\"944,957\"><code class=\"language-text\">&#x4e00;&#x4e2a;&#x4f1a;&#x8bdd;&#x5de5;&#x5382;&#xff0c;&#x6309;&#x9636;&#x6bb5;&#x5f00;&#x77ed;&#x4f1a;&#x8bdd; &#xb7; one session factory, short sessions per phase\n  seed_demo(sessions: async_sessionmaker[AsyncSession])\n        &#x2502;\n        &#x251c;&#x2500; async with sessions() as session:   &#x9636;&#x6bb5; 1 &#x5efa;&#x7ec4;/&#x7b56;&#x7565;/&#x5ba2;&#x6237;&#x7aef;/&#x4e8b;&#x4ef6;\n        &#x2502;     await repo.get_by_name(...) &#x2500;&#x25b6; &#x8ba9;&#x51fa; yield &#x2500;&#x25b6; asyncpg &#x2500;&#x25b6; Postgres\n        &#x2502;  &#x2514;&#x2500; &#x9000;&#x51fa;&#x5373;&#x5173;&#x95ed;&#x4f1a;&#x8bdd;&#x3001;&#x5f52;&#x8fd8;&#x8fde;&#x63a5; close + return to pool\n        &#x251c;&#x2500; IngestWorker(unit_factory(sessions))\n        &#x2502;     while await worker.process_once(): &#x6bcf;&#x6279;&#x81ea;&#x5df1;&#x5f00;&#x4f1a;&#x8bdd; own session\n        &#x2514;&#x2500; async with sessions() as session:   &#x9636;&#x6bb5; 3 &#x5206;&#x6d3e;&#x4e0e;&#x8f6c;&#x6362;&#x4e8b;&#x4ef6;&#x5355;\n  &#x4f20;&#x5de5;&#x5382;&#x4e0d;&#x4f20;&#x4f1a;&#x8bdd;&#xff1a;&#x5404;&#x9636;&#x6bb5;&#x4e8b;&#x52a1;&#x72ec;&#x7acb; &#xb7; pass the factory, not a session\nCLI &#x91cc;&#x662f;&#x987a;&#x5e8f; await&#xff0c;&#x65e0;&#x5e76;&#x53d1;&#x6536;&#x76ca;&#xff1b;&#x6536;&#x76ca;&#x5728;&#x670d;&#x52a1;&#x91cc; &#xb7; sequential here, no parallel gain\n</code></pre>","children":[],"payload":{"tag":"li","lines":"944,957"}}],"payload":{"tag":"li","lines":"943,957"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;SQLAlchemy 2.0 async &#x52a0; asyncpg&#xff0c;&#x7528; async_sessionmaker[AsyncSession] &#x5f00;&#x4f1a;&#x8bdd;&#xff0c;seed_demo &#x4e5f;&#x8d70;&#x540c;&#x4e00;&#x4e2a;&#x4f1a;&#x8bdd;&#x5de5;&#x5382; &#xb7; SQLAlchemy 2.0 async with asyncpg and async_sessionmaker[AsyncSession], shared by seed_demo","children":[],"payload":{"tag":"li","lines":"958,959"}},{"content":"&#x4e0d;&#x7528; &#x540c;&#x6b65; SQLAlchemy &#x653e;&#x7ebf;&#x7a0b;&#x6c60; &#xb7; Not sync SQLAlchemy in a thread pool&#xff1a;FastAPI &#x548c;&#x5185;&#x5d4c; worker &#x90fd;&#x8dd1;&#x5728;&#x4e8b;&#x4ef6;&#x5faa;&#x73af;&#x4e0a;&#xff0c;&#x540c;&#x6b65; I/O &#x4f1a;&#x5360;&#x4f4f;&#x7ebf;&#x7a0b; &#xb7; the API and the embedded worker live on the event loop, and sync I/O ties up threads","children":[],"payload":{"tag":"li","lines":"959,960"}},{"content":"&#x4e0d;&#x7528; &#x76f4;&#x63a5;&#x5199; asyncpg SQL &#xb7; Not raw asyncpg&#xff1a;&#x6ca1;&#x6709; ORM &#x6620;&#x5c04;&#x548c; select() &#x6784;&#x9020;&#xff0c;&#x8fc1;&#x79fb;&#x548c;&#x7c7b;&#x578b;&#x68c0;&#x67e5;&#x90fd;&#x8981;&#x81ea;&#x5df1;&#x7ef4;&#x62a4; &#xb7; no ORM mapping or select() builder, so schema and typing are all hand-maintained","children":[],"payload":{"tag":"li","lines":"960,961"}},{"content":"&#x4e0d;&#x7528; SQLModel / Tortoise &#xb7; Not SQLModel or Tortoise&#xff1a;&#x751f;&#x6001;&#x548c; Alembic &#x96c6;&#x6210;&#x4e0d;&#x5982; SQLAlchemy &#x6210;&#x719f; &#xb7; less mature ecosystem and Alembic integration than SQLAlchemy","children":[],"payload":{"tag":"li","lines":"961,962"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;CPU &#x5bc6;&#x96c6;&#x7684;&#x4ee3;&#x7801;&#x4f1a;&#x5361;&#x4f4f;&#x4e8b;&#x4ef6;&#x5faa;&#x73af;&#xff0c;&#x68c0;&#x6d4b;&#x670d;&#x52a1;&#x5c31;&#x56e0;&#x6b64;&#x6539;&#x6210;&#x666e;&#x901a; def &#x8dd1;&#x5728;&#x7ebf;&#x7a0b;&#x6c60;&#xff1b;&#x61d2;&#x52a0;&#x8f7d;&#x5c5e;&#x6027;&#x5728; async &#x4e0b;&#x4f1a;&#x62a5;&#x9519; &#xb7; CPU-bound code stalls the loop (the detector moved to a plain def), and lazy loads fail under async","children":[],"payload":{"tag":"li","lines":"962,963"}},{"content":"&#x6765;&#x6e90; &#xb7; Source&#xff1a;docs/adr/0002-backend-and-frontend-stack.md&#xff08;SQLAlchemy 2.0 async + asyncpg&#xff09;&#xff1b;2a3bb29 &#x8bb0;&#x5f55;&#x4e8b;&#x4ef6;&#x5faa;&#x73af;&#x95ee;&#x9898;&#xff1b;&#x5907;&#x9009;&#x90e8;&#x5206;&#x4e3a;&#x901a;&#x7528;&#x7406;&#x7531; &#xb7; docs/adr/0002-backend-and-frontend-stack.md; 2a3bb29 records the event-loop issue; alternatives general","children":[],"payload":{"tag":"li","lines":"963,964"}}],"payload":{"tag":"li","lines":"957,964"}},{"content":"&#x2463; &#x6211;&#x7684;&#x6848;&#x4f8b; &#xb7; My case","children":[{"content":"&#x6211;&#x5728; seed_demo &#x4e2d;&#x4f7f;&#x7528; async_sessionmaker[AsyncSession] &#x5f02;&#x6b65;&#x79cd;&#x690d;&#x6f14;&#x793a;&#x6570;&#x636e;&#x3002;","children":[],"payload":{"tag":"li","lines":"965,966"}},{"content":"I used async_sessionmaker[AsyncSession] in seed_demo to asynchronously seed demo data.","children":[],"payload":{"tag":"li","lines":"966,967"}}],"payload":{"tag":"li","lines":"964,967"}},{"content":"&#x2464; &#x4ee3;&#x7801; &#xb7; Code&#xff1a;<code>apps/api/src/govapi/d "974,977"}},{"content":"&#x2461; &#x539f;&#x7406; &#xb7; How it works","children":[{"content":"\n<pre data-lines=\"978,990\"><code class=\"language-text\">&#x9501;&#x4f4f;&#x4ee4;&#x724c;&#x884c;&#xff0c;&#x7b2c;&#x4e8c;&#x4e2a;&#x5237;&#x65b0;&#x7b49;&#x63d0;&#x4ea4;&#x540e;&#x8d70;&#x5bbd;&#x9650;&#x8def;&#x5f84; &#xb7; lock the row; 2nd waits, then grace\n  &#x4e24;&#x4e2a;&#x6807;&#x7b7e;&#x9875;&#x540c;&#x65f6;&#x5237;&#x65b0; two tabs refresh with token R\n  T1: SELECT R FOR UPDATE &#x2500; &#x8f6e;&#x6362; rotate: R.revoked, R&apos; &#x65b0;&#x5efa; &#x2500; COMMIT\n  T2: SELECT R FOR UPDATE &#xb7;&#xb7;&#xb7;&#xb7; &#x7b49;&#x5f85; wait &#xb7;&#xb7;&#xb7;&#xb7;&#x25b6; &#x8bfb;&#x5230; R &#x5df2;&#x64a4;&#x9500; revoked\n        &#x25bc;\n  &#x64a4;&#x9500;&#x65f6;&#x95f4;&#x5728;&#x5bbd;&#x9650;&#x671f;&#x5185; &#x4e14; R&apos; &#x4ecd;&#x5b58;&#x6d3b; ?\n        &#x251c;&#x2500;&#x2500; &#x662f; &#x2500;&#x25b6; stored = R&apos;&#xff0c;&#x518d;&#x8f6e;&#x6362;&#x4e00;&#x6b21; &#x2500;&#x25b6; &#x6700;&#x7ec8;&#x53ea;&#x5269;&#x4e00;&#x4e2a;&#x6d3b;&#x4ee4;&#x724c; one live token\n        &#x2514;&#x2500;&#x2500; &#x5426; &#x2500;&#x25b6; &#x89c6;&#x4e3a;&#x91cd;&#x653e; replay &#x2500;&#x25b6; revoke_family&#xff0c;&#x6574;&#x6761;&#x4f1a;&#x8bdd;&#x5931;&#x6548; &#x2500;&#x25b6; 401\n  &#x6ca1;&#x9501;&#x65f6;: T1&#x3001;T2 &#x90fd;&#x8bfb;&#x5230;&#x672a;&#x64a4;&#x9500;&#x7684; R &#x2500;&#x25b6; &#x5404;&#x81ea;&#x8f6e;&#x6362; &#x2500;&#x25b6; &#x4e24;&#x4e2a;&#x6d3b;&#x4ee4;&#x724c; two live tokens\n&#x884c;&#x9501;&#x53ea;&#x5728;&#x5355;&#x5e93;&#x6709;&#x6548;&#xff1b;&#x4ee4;&#x724c;&#x5b58;&#x7f13;&#x5b58;&#x8981;&#x6362;&#x5206;&#x5e03;&#x5f0f;&#x9501; &#xb7; one DB only; else a distributed lock\n</code></pre>","children":[],"payload":{"tag":"li","lines":"978,990"}}],"payload":{"tag":"li","lines":"977,990"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; ck. Using mocks isolates external dependencies and keeps tests reliable.","children":[],"payload":{"tag":"li","lines":"1045,1046"}}],"payload":{"tag":"li","lines":"1043,1046"}},{"content":"&#x2461; &#x539f;&#x7406; &#xb7; How it works","children":[{"content":"\n<pre data-lines=\"1047,1062\"><code class=\"language-text\">&#x7528; MockTransport &#x622a;&#x4f4f;&#x8f6c;&#x53d1;&#xff0c;&#x65ad;&#x8a00;&#x539f;&#x6837;&#x900f;&#x4f20; &#xb7; intercept the hop, assert pass-through\n  &#x6d4b;&#x8bd5; client &#x2500;&#x25b6; POST /api/v1/ingest/detect  {layers, categories}\n                    &#x2502; Router &#x2500;&#x25b6; Service &#x2500;&#x25b6; DetectorClient\n                    &#x25bc;\n            httpx.MockTransport(handler)   &#x25c0;&#x2500;&#x2500; &#x66ff;&#x4ee3;&#x771f;&#x5b9e;&#x68c0;&#x6d4b;&#x670d;&#x52a1; no real detector\n                    &#x2502; sent.append(&#x8bf7;&#x6c42;&#x4f53;)\n                    &#x2502; &#x8fd4;&#x56de;&#x4f2a;&#x9020;&#x54cd;&#x5e94; layers_run:[&quot;rules&quot;,&quot;model&quot;]\n                    &#x25bc;\n  &#x65ad;&#x8a00; assert:\n   &#x51fa;&#x7ad9; outbound: sent[0].layers / categories == &#x8bf7;&#x6c42;&#x503c;\n   &#x56de;&#x7a0b; inbound:  body.layers_run / versions / spans.source == &#x68c0;&#x6d4b;&#x670d;&#x52a1;&#x6240;&#x7ed9;\n  app.dependency_overrides &#x6ce8;&#x5165;&#x5047;&#x5ba2;&#x6237;&#x7aef; inject the fake client\n&#x53ea;&#x8bc1;&#x660e;&#x900f;&#x4f20;&#xff0c;&#x4e0d;&#x8bc1;&#x660e;&#x6a21;&#x578b;&#x771f;&#x7684;&#x8dd1;&#x4e86; &#xb7; only live checks prove the model ran\n</code></pre>","children":[],"payload":{"tag":"li","lines":"1047,1062"}}],"payload":{"tag":"li","lines":"1046,1062"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;&#x6d4b;&#x8bd5;&#x901a;&#x8fc7;&#x4f9d;&#x8d56;&#x8986;&#x76d6;&#x628a;&#x68c0;&#x6d4b;&#x5ba2;&#x6237;&#x7aef;&#x6362;&#x6210; httpx MockTransport&#xff0c;&#x65ad;&#x8a00;&#x8f6c;&#x53d1;&#x8def;&#x7531;&#x539f;&#x6837;&#x4f20;&#x9012; layers &#x548c; categories&#xff0c;&#x5e76;&#x8fd4;&#x56de;&#x68c0;&#x6d4b;&#x5668;&#x81ea;&#x5df1;&#x7684; layers_run &#xb7; override the detector client with an httpx MockTransport and assert layers pass through and layers_run returns","children":[],"payload":{"tag":"li","lines":"1063,1064"}},{"content":"&#x4e0d;&#x7528; &#x8fde;&#x771f;&#x5b9e;&#x68c0;&#x6d4b;&#x670d;&#x52a1; &#xb7; Not the real detector&#xff1a;&#x8981;&#x4e0b;&#x8f7d;&#x6a21;&#x578b;&#x3001;&#x8981; GPU&#xff0c;CI &#x91cc;&#x8dd1;&#x4e0d;&#x4e86;&#xff0c;&#x4e5f;&#x4e0d;&#x7a33;&#x5b9a; &#xb7; needs model downloads and a GPU, so it cannot run reliably in CI","children":[],"payload":{"tag":"li","lines":"1064,1065"}},{"content":"&#x4e0d;&#x7528; &#x53ea;&#x6d4b; service &#x51fd;&#x6570; &#xb7; Not service-only unit tests&#xff1a;&#x53c2;&#x6570;&#x5728;&#x8def;&#x7531;&#x548c; schema &#x8fd9;&#x4e00;&#x5c42;&#x88ab;&#x4e22;&#x6389;&#xff0c;&#x5355;&#x6d4b; service &#x770b;&#x4e0d;&#x51fa;&#x6765; &#xb7; a field dropped at the router or schema layer is invisible to a service test","children":[],"payload":{"tag":"li","lines":"1065,1066"}},{"content":"&#x4e0d;&#x7528; unittest.mock &#x6253;&#x8865;&#x4e01; &#xb7; Not patching with unittest.mock&#xff1a;&#x66ff;&#x6362;&#x5728; HTTP &#x8fb9;&#x754c;&#x4e0a;&#xff0c;&#x8bf7;&#x6c42;&#x4f53;&#x771f;&#x7684;&#x88ab;&#x5e8f;&#x5217;&#x5316;&#xff0c;&#x6d4b;&#x5230;&#x7684;&#x66f4;&#x63a5;&#x8fd1;&#x771f;&#x5b9e; &#xb7; replacing at the HTTP boundary serialises the real request body, closer to production","children":[],"payload":{"tag":"li","lines":"1066,1067"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x5047;&#x54cd;&#x5e94;&#x8981;&#x548c;&#x68c0;&#x6d4b;&#x670d;&#x52a1;&#x7684;&#x771f;&#x5b9e;&#x5951;&#x7ea6;&#x4fdd;&#x6301;&#x4e00;&#x81f4;&#xff0c;&#x670d;&#x52a1;&#x6539;&#x5951;&#x7ea6;&#x65f6;&#x6d4b;&#x8bd5;&#x4e0d;&#x4f1a;&#x81ea;&#x52a8;&#x53d1;&#x73b0      &#x25bc;\n  monkeypatch mark_replaced: &#x5230;&#x8fbe;&#x540e;&#x7b49;&#x53e6;&#x4e00;&#x4e2a;&#x4e5f;&#x5230;&#x8fbe;&#xff08;&#x6700;&#x591a; 0.5 s&#xff09;\n        &#x25bc;\n  asyncio.gather(POST /auth/refresh, POST /auth/refresh)  &#x540c;&#x4e00;&#x4e2a; cookie\n        &#x2502;\n        &#x251c;&#x2500; &#x6ca1;&#x9501; no lock: &#x4e24;&#x4e2a;&#x90fd;&#x8bfb;&#x5230;&#x540c;&#x4e00;&#x4ee4;&#x724c; &#x2500;&#x25b6; &#x4e24;&#x6b21;&#x8f6e;&#x6362; &#x2500;&#x25b6; 2 &#x4e2a;&#x6d3b;&#x4ee4;&#x724c;  &#x2717;\n        &#x2514;&#x2500; &#x6709;&#x9501; lock:   &#x7b2c;&#x4e8c;&#x4e2a;&#x7b49;&#x63d0;&#x4ea4; &#x2500;&#x25b6; &#x5bbd;&#x9650;&#x8def;&#x5f84; &#x2500;&#x25b6; 1 &#x4e2a;&#x6d3b;&#x4ee4;&#x724c;      &#x2713;\n        &#x25bc;\n  async_sessionmaker &#x5f00;&#x65b0;&#x4f1a;&#x8bdd;&#x76f4;&#x63a5;&#x67e5;&#x5e93;: count(revoked_at IS NULL) == 1\n&#x7b49;&#x5f85;&#x6709;&#x4e0a;&#x9650;&#x9632;&#x6b7b;&#x7b49;&#xff1b;&#x65f6;&#x95f4;&#x654f;&#x611f;&#x6d4b;&#x8bd5;&#x5728;&#x6162; CI &#x4e0a;&#x4f1a;&#x6296; &#xb7; bounded wait; timing can flake\n</code></pre>","children":[],"payload":{"tag":"li","lines":"1083,1097"}}],"payload":{"tag":"li","lines":"1082,1097"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;pytest &#x52a0; httpx AsyncClient &#x8c03;&#x5e94;&#x7528;&#xff0c;&#x8fde;&#x72ec;&#x7acb;&#x7684; govapi_test Postgres&#xff0c;&#x6bcf;&#x4e2a;&#x6d4b;&#x8bd5;&#x6e05;&#x8868;&#xff1b;&#x5e76;&#x53d1;&#x573a;&#x666f;&#x7528;&#x591a;&#x4e2a;&#x534f;&#x7a0b;&#x540c;&#x65f6;&#x53d1;&#x8bf7;&#x6c42; &#xb7; pytest with httpx AsyncClient against a separate govapi_test Postgres, truncated per test, concurrency via parallel coroutines","children":[],"payload":{"tag":"li","lines":"1098,1099"}},{"content":"&#x4e0d;&#x7528; &#x540c;&#x6b65; TestClient &#xb7; Not the sync TestClient&#xff1a;&#x6ca1;&#x6cd5;&#x5728;&#x540c;&#x4e00;&#x4e2a;&#x sh; use systemd\n</code></pre>","children":[],"payload":{"tag":"li","lines":"1178,1191"}}],"payload":{"tag":"li","lines":"1177,1191"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;runbook &#x7528; setsid -f &#x5728;&#x672c;&#x5730; GPU &#x4e3b;&#x673a;&#x4e0a;&#x542f;&#x52a8;&#x68c0;&#x6d4b;&#x670d;&#x52a1;&#xff0c;&#x8f93;&#x51fa;&#x91cd;&#x5b9a;&#x5411;&#x5230; detector.log&#xff0c;stdin &#x63a5; /dev/null&#xff0c;SSH &#x7acb;&#x523b;&#x8fd4;&#x56de; &#xb7; start the detector with setsid -f, output to detector.log, stdin from /dev/null, so SSH returns at once","children":[],"payload":{"tag":"li","lines":"1192,1193"}},{"content":"&#x4e0d;&#x7528; nohup &#x2026; &amp; &#xb7; Not nohup with &amp;&#xff1a;&#x5728; Tailscale SSH &#x4e0b;&#x4f1a;&#x8ba9;&#x4f1a;&#x8bdd;&#x4e00;&#x76f4;&#x6302;&#x7740;&#xff0c;&#x76f4;&#x5230;&#x8fdb;&#x7a0b;&#x9000;&#x51fa; &#xb7; under Tailscale SSH it keeps the session open until the process exits","children":[],"payload":{"tag":"li","lines":"1193,1194"}},{"content":"&#x4e0d;&#x7528; systemd &#x670d;&#x52a1; &#xb7; Not a systemd unit&#xff1a;&#x5f00;&#x53d1;&#x671f;&#x5b9e;&#x4f8b;&#x662f;&#x4e34;&#x65f6;&#x7684;&#xff0c;&#x7528;&#x4f4e;&#x6743;&#x9650;&#x5b9e;&#x9a8c;&#x8d26;&#x53f7;&#xff0c;&#x4e0d;&#x60f3;&#x6539;&#x7cfb;&#x7edf;&#x914d;&#x7f6e; &#xb7; a temporary dev instance under a low-privilege lab user, with no system config changes","children":[],"payload":{"tag":"li","lines":"1194,1195"}},{"content":"&#x4e0d;&#x7528; tmux / screen &#xb7; Not tmux or screen&#xff1a;&#x8981;&#x4eba;&#x5de5;&#x8fdb;&#x4f1a;&#x8bdd;&#x7ba1;&#x7406;&#xff0c;&#x811a;&#x672c;&#x5316;&#x542f;&#x52a8;&#x548c;&#x68c0;&#x67e5;&#x90fd;&#x4e0d;&#x65b9;&#x4fbf; &#xb7; needs someone attaching to sessions, awkward to script","children":[],"payload":{"tag":"li","lines":"1195,1196"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x8fdb;&#x7a0b;&#x6302 ]*              &#x2502;\n  &#x2502;   record.args &#x2192; &quot;?token=[redacted]&amp;x=1&quot; &#x2502;\n  &#x2514;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2518;\n        &#x2502;\n        &#x25bc;\n  handler &#x2500;&#x2500;&#x25b6; stdout / &#x65e5;&#x5fd7;&#x6587;&#x4ef6; log file   &#x539f;&#x59cb; token &#x51fa;&#x73b0; 0 &#x6b21; &#xb7; 0 raw tokens\n&#x53ea;&#x6302;&#x5728; uvicorn.access &#x4e0a; &#xb7; other loggers printing URLs could still leak\n</code></pre>","children":[],"payload":{"tag":"li","lines":"1398,1413"}}],"payload":{"tag":"li","lines":"1397,1413"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;&#x7ed9; uvicorn.access logger &#x52a0;&#x4e00;&#x4e2a; logging.Filter&#xff0c;&#x5199;&#x65e5;&#x5fd7;&#x524d;&#x628a; ?token= &#x7684;&#x503c;&#x6362;&#x6210; [redacted] &#xb7; a logging.Filter on the uvicorn.access logger that replaces ?token= values with [redacted] before output","children":[],"payload":{"tag":"li","lines":"1414,1415"}},{"content":"&#x4e0d;&#x7528;&#x5173;&#x6389; access log &#xb7; Not disabling the access log&#xff1a;&#x4f1a;&#x4e22;&#x6389;&#x6392;&#x969c;&#x8981;&#x7528;&#x7684;&#x8def;&#x5f84;&#x3001;&#x72b6;&#x6001;&#x7801;&#x548c;&#x8017;&#x65f6; &#xb7; loses the path, status and timing needed for debugging","children":[],"payload":{"tag":"li","lines":"1415,1416"}},{"content":"&#x4e0d;&#x7528;&#x628a; token &#x632a;&#x5230;&#x8bf7;&#x6c42;&#x5934; &#xb7; Not moving the token to a header&#xff1a;&#x4e0b;&#x8f7d;&#x94fe;&#x63a5;&#x8981;&#x80fd;&#x76f4;&#x63a5;&#x70b9;&#x5f00;&#xff0c;&#x6d4f;&#x89c8;&#x5668;&#x70b9;&#x94fe;&#x63a5;&#x5e26;&#x4e0d;&#x4e86;&#x81ea;&#x5b9a;&#x4e49;&#x5934; &#xb7; a download link must work when clicked, and a plain link cannot carry a custom header","children":[],"payload":{"tag":"li","lines":"1416,1417"}},{"content":"&#x4e0d;&#x7528;&#x5728;&#x65e5;&#x5fd7;&#x6536;&#x96c6;&#x7aef;&#xff08;&#x5982; Fluent Bit&#xff09;&#x518d;&#x8131;&#x654f; &#xb7; Not redacting downstream in the shipper&#xff1a;&#x539f;&#x59cb;&#x503c;&#x5df2;&#x7ecf;&#x5199;&#x5230; stdout &#x548c;&#x672c;&#x5730;&#x6587;&#x4ef6;&#xff0c;&#x665a;&#x4e86;&#x4e00;&#x6b65; &#xb7; the raw value has already hit stdout and local files","children":[],"payload":{"tag":"li","lines":"1417,1418"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x53ea;&#x6309;&#x6b63;&#x5219;&#x6321; ?token=&#xff0c;&#x4ee5;&#x540e;&#x6362;&#x4e86;&#x53c2;&#x6570;&#x540d;&#x8981;&#x540c;&#x6b65;&#x6539;&#x89c4;&#x5219; &#xb7; a regex on ?token= only; a renamed parameter needs the rule updated too","children":[],"payload":{"tag":"li","lines":"1418,1419"}},{"content":"&#x6765;&#x6e90; &#xb7; Source&#xff1a;b1272c9 &#x4e0e; apps/api/src/govapi/core/logging.py &#x6ce8;&#x91ca;&#xff1a;&#x7b7e;&#x540d;&#x94fe;&#x63a5;&#x628a;&#x51ed;&#x636e;&#x653e;&#x5728; ?token=&#xff0c;access log &#x4f1a;&#x8bb0;&#x8def;&#x5f84;&#xff1b;&#x4e0d;&#x7528;&#x522b;&#x7684;&#x662f;&#x901a;&#x7528;&#x7406;&#x7531; &#xb7; b1272c9 and the logging.py docstring say signed links carry the credential in ?token=; the alternatives are general reasoning","children":[],"payload":{"tag":"li","lines":"1419,1420"}}],"payload":{"tag":"li","lines":"1413,1420"}},{"content":"&#x2463; &#x6211;&#x7684;&#x6848;&#x4f8b; &#xb7; My case","children":[{"content":"&#x6211;&#x5728; uvicorn.access &#x65e5;&#x5fd7;&#x4e2d;&#x8131;&#x654f;&#x4e86; ?token= &#x503c;&#xff0c;&#x9a8c;&#x8bc1;&#x65e5;&#x5fd7;&#x4e2d;&#x4e0d;&#x51fa;&#x73b0;&#x539f;&#x59cb;&#x4ee4;&#x724c;&#x3002;","children":[],"payload":{"tag":"li","lines":"1421,1422"}},{"content":"I redacted ?token= values in the uvicor  Not each vendor SDK directly&#xff1a;&#x8c03;&#x7528;&#x65b9;&#x8981;&#x61c2;&#x6bcf;&#x5bb6;&#x7684;&#x53c2;&#x6570;&#xff0c;&#x6362;&#x63d0;&#x4f9b;&#x65b9;&#x5c31;&#x8981;&#x6539;&#x4e1a;&#x52a1;&#x4ee3;&#x7801; &#xb7; callers learn every vendor&apos;s API; switching providers touches business code","children":[],"payload":{"tag":"li","lines":"1530,1531"}},{"content":"&#x4e0d;&#x7528;&#x6d41;&#x5f0f;&#x63a5;&#x53e3;&#x8d77;&#x6b65; &#xb7; Not streaming first&#xff1a;&#x5148;&#x6574;&#x6bb5;&#x8fd4;&#x56de;&#xff0c;&#x8131;&#x654f;&#x3001;&#x8ba1;&#x91cf;&#x548c;&#x843d;&#x5e93;&#x90fd;&#x66f4;&#x7b80;&#x5355; &#xb7; a whole reply keeps masking, metering and storage simple","children":[],"payload":{"tag":"li","lines":"1531,1532"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x5404;&#x5bb6;&#x7279;&#x6709;&#x529f;&#x80fd;&#xff08;&#x5de5;&#x5177;&#x8c03;&#x7528;&#x3001;&#x6d41;&#x5f0f;&#x3001;&#x7f13;&#x5b58;&#xff09;&#x63a5;&#x53e3;&#x91cc;&#x6682;&#x65f6;&#x7528;&#x4e0d;&#x5230; &#xb7; vendor-specific features such as tools, streaming and caching are not exposed yet","children":[],"payload":{"tag":"li","lines":"1532,1533"}},{"content":"&#x6765;&#x6e90; &#xb7; Source&#xff1a;docs/adr/0013-llm-access.md &#x51b3;&#x7b56; 1 &#x4e0e;&#x5907;&#x9009;&#x65b9;&#x6848;&#xff1a;&#x5b89;&#x5168;&#x8ba1;&#x5212;&#x660e;&#x786e;&#x4e0d;&#x505a;&#x7f51;&#x5173; &#xb7; ADR-0013 decision 1 and alternatives: the security plan rules out a gateway","children":[],"payload":{"tag":"li","lines":"1533,1534"}}],"payload":{"tag":"li","lines":"1527,1534"}},{"content":"&#x2463; &#x6211;&#x7684;&#x6848;&#x4f8b; &#xb7; My case","children":[{"content":"&#x6211;&#x5728; LLM &#x8bbf;&#x95ee;&#x670d;&#x52a1;&#x4e2d;&#x5b9a;&#x4e49;&#x4e86; <code>complete(messages, model)</code> &#x65b9;&#x6cd5;&#xff0c;&#x62bd;&#x8c61;&#x4e86; OpenAI&#x3001;Mistral&#x3001;Azure &#x548c; Anthropic &#x63d0;&#x4f9b;&#x5546;&#xff0c;&#x5e76;&#x786e;&#x4fdd;&#x6bcf;&#x6b21;&#x8c03;&#x7528;&#x90fd;&#x4ece; vault &#x83b7;&
