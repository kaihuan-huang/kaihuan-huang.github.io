a8;&#x4f5c; &#xb7; evaluate is a pure function, tested with in-memory RuleViews built by a _rule helper","children":[],"payload":{"tag":"li","lines":"1564,1565"}},{"content":"&#x4e0d;&#x7528;&#x8d70; API &#x7684;&#x96c6;&#x6210;&#x6d4b;&#x8bd5; &#xb7; Not API integration tests&#xff1a;&#x8981;&#x8d77;&#x6570;&#x636e;&#x5e93;&#x548c;&#x9274;&#x6743;&#xff0c;&#x6162;&#xff0c;&#x5931;&#x8d25;&#x65f6;&#x770b;&#x4e0d;&#x51fa;&#x662f;&#x54ea;&#x6761;&#x4f18;&#x5148;&#x7ea7;&#x89c4;&#x5219;&#x9519;&#x4e86; &#xb7; need a database and auth, run slowly, and hide which ranking rule failed","children":[],"payload":{"tag":"li","lines":"1565,1566"}},{"content":"&#x4e0d;&#x7528; mock &#x6570;&#x636e;&#x5e93; &#xb7; Not mocking the database&#xff1a;&#x7eaf;&#x51fd;&#x6570;&#x4e0d;&#x9700;&#x8981;&#xff0c;mock &#x53ea;&#x4f1a;&#x8ba9;&#x6d4b;&#x8bd5;&#x7ed1;&#x5b9a;&#x5b9e;&#x73b0;&#x7ec6;&#x8282; &#xb7; a pure function needs no mocks, and mocks couple tests to internals","children":[],"payload":{"tag":"li","lines":"1566,1567"}},{"content":"&#x4e0d;&#x7528;&#x5c5e;&#x6027;&#x6d4b;&#x8bd5;&#xff08;Hypothesis&#xff09;&#x8d77;&#x6b65; &#xb7; Not property tests first&#xff1a;&#x89c4;&#x5219;&#x53ea;&#x6709;&#x51e0;&#x6761;&#xff0c;&#x9010;&#x6761;&#x5217;&#x4e3e;&#x66f4;&#x597d;&#x8bfb;&#xff1b;&#x7ec4;&#x5408;&#x53d8;&#x591a;&#x518d;&#x52a0; &#xb7; a handful of rules reads better enumerated; add them when combinations grow","children":[],"payload":{"tag":"li","lines":"1567,1568"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x6d4b;&#x4e0d;&#x5230;&#x7b56;&#x7565;&#x4ece;&#x6570;&#x636e;&#x5e93;&#x52a0;&#x8f7d;&#x6210; RuleView &#x8fd9;&#x4e00;&#x6b65;&#xff0c;&#x8981;&#x9760;&#x53e6;&#x5916;&#x7684; API &#x6d4b;&#x8bd5;&#x8865;&#x4e0a; &#xb7; the database-to-RuleView loading path needs separate API tests","children":[],"payload":{"tag":"li","lines":"1568,1569"}},{"content":"&#x6765;&#x6e90; &#xb7; Source&#xff1a;&#x901a;&#x7528;&#x7406;&#x7531;&#xff0c;&#x4ed3;&#x5e93;&#x91cc;&#x6ca1;&#x6709;&#x8bb0;&#x5f55;&#x4e3a;&#x4ec0;&#x4e48;&#x4e0d;&#x7528;&#x522b;&#x7684; &#xb7; general reasoning; the repo records no reason","children":[],"payload":{"tag":"li","lines":"1569,1570"}}],"payload":{"tag":"li","lines":"1563,1570"}},{"content":"&#x2463; &#x6211;&#x7684;&#x6848;&#x4f8b; &#xb7; My case","children":[{"content":"&#x6211;&#x521b;&#x5efa;&#x4e86;&#x6d4b;&#x8bd5;&#x6587;&#x4ef6; <code>test_mask_action.py</code>&#xff0c;&#x5176;&#x4e2d;&#x5b9a;&#x4e49;&#x4e86;&#x8f85;&#x52a9;&#x51fd;&#x6570; <code>_rule</code> &#x5e76;&#x65ad;&#x8a00;&#x8bc4;&#x4f30;&#x7ed3;&#x679c;&#x3002;","children":[],"payload":{"tag":"li","lines":"1571,1572"}},{"content":"I created a test file <code>test_mask_action.py</code> that defines helper <code>_rule</code> and asserts the evaluation outcome.","children":[],"payload":{"tag":"li","lines":"1572,1573"}}],"payload":{"tag":"li","lines":"1570,1573"}},{"content":"&#x2464; &#x4ee3;&#x7801; &#xb7; Code&#xff1a;<code>apps/api/tests/test_mask_action.py @ b5b4c38</code> &#xb7; &#x4ee3;&#x7801;&#x5728;&#x79c1;&#x6709;&#x4ed3;&#x5e93;&#xff0c;&#x672c;&#x5730;&#x5bfc;&#x56fe;&#x91cc;&#x770b; &#xb7; private repo, see the local map","children":[],"payload":{"tag":"li","lines":"1573,1574"}},{"content":"&#x2465; &#x8bc1;&#x636e; &#xb7; Evidence&#xff08;2026-09-23&#xff09;","children":[{"content":"&quot;+ def _rule(action: str, *, priority: int = 0, mode: str = &quot;monitor&quot;) -&gt; RuleView:&quot;","children":[],"payload":{"tag":"li","lines":"1575,1576"}}],"payload":{"tag":"li","lines":"1574,1576"}},{"content":"&#x9762;&#x8bd5;&#x600e;&#x4e48;&#x95ee; &#xb7; Asked as&#xff1a;&#x4f60;&#x5982;&#x4f55;&#x6d4b;&#x8bd5;&#x7b56;&#x7565;&#x8bc4;&#x4f30;&#x903b;&#x8f91;&#xff1f; &#xb7; What is your approach to testing policy evaluation logic?","children":[],"payload":{"tag":"li","lines":"1576,1578"}}],"payload":{"tag":"h4","lines":"1544,1545"}}],"payload":{"tag":"h3","lines":"1542,1543"}},{"content":"&#x5b89;&#x5168;&#x4e0e;&#x9274;&#x6743; &#xb7; Security &amp; Auth","children":[{"content":"&#x5b89;&#x5168;&#x5bc6;&#x94a5;&#x7ba1;&#x7406; &#xb7; Secure Key Management","children":[{"content":"&#x2460; &#x901a;&#x7528;&#x56de;&#x7b54; &#xb7; General answer","children":[{"content":"&#x5c06;&#x51ed;&#x8bc1;&#x52a0;&#x5bc6;&#x5b58;&#x50a8;&#x5728; vault &#x4e2d;&#xff0c;&#x5e76;&#x5728;&#x8fd0;&#x884c;&#x65f6;&#x68c0;&#x7d22;&#xff1b;&#x6c38;&#x4e0d;&#x5411;&#x5ba2;&#x6237;&#x7aef;&#x66b4;&#x9732;&#x5bc6;&#x94a5;&#x3002;","children":[],"payload":{"tag":"li","lines":"1583,1584"}},{"content":"Store credentials encrypted in a vault and retrieve them at runtime; never expose keys to clients.","children":[],"payload":{"tag":"li","lines":"1584,1585"}}],"payload":{"tag":"li","lines":"1582,1585"}},{"content":"&#x2461; &#x539f;&#x7406; &#xb7; How it works","children":[{"content":"\n<pre data-lines=\"1586,1599\"><code class=\"language-text\">key &#x53ea;&#x5728;&#x670d;&#x52a1;&#x7aef;&#x89e3;&#x5bc6;&#x4e00;&#x6b21;&#xff0c;&#x4e0d;&#x56de;&#x754c;&#x9762; &#xb7; decrypted server-side, per call only\n  &#x6d4f;&#x89c8;&#x5668; browser &#x2500;&#x2500;&#x6d88;&#x606f; message&#x2500;&#x2500;&#x25b6; ChatService.send\n                                     &#x2502; resolve &#x5206;&#x914d; assignment&#xff08;&#x6bcf;&#x6b21; each call&#xff09;\n                                     &#x25bc;\n                                   CredentialVault.use(id, purpose=&quot;chat&quot;)\n                                     &#x2502; AES-256-GCM &#x89e3;&#x5bc6; decrypt + &#x8bbf;&#x95ee;&#x65e5;&#x5fd7; log\n                                     &#x25bc;\n                                   api_key: SecretStr &#x2500;&#x2500;&#x25b6; client.complete()\n                                     &#x2502;\n  &#x6d4f;&#x89c8;&#x5668; browser &#x25c0;&#x2500;&#x2500; &#x53ea;&#x56de;&#x590d;&#x6587;&#x672c; reply text only &#x2500;&#x2500;&#x2518;   key &#x4e0d;&#x7f13;&#x5b58; not cached\n&#x6bcf;&#x6b21;&#x591a;&#x4e00;&#x6b21;&#x89e3;&#x5bc6;&#xff0c;&#x6362;&#x6765;&#x540a;&#x9500;&#x5373;&#x65f6;&#x751f;&#x6548; &#xb7; extra decrypt, instant revocation\n</code></pre>","children":[],"payload":{"tag":"li","lines":"1586,1599"}}],"payload":{"tag":"li","lines":"1585,1599"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;&#x6bcf;&#x6b21;&#x8c03;&#x7528; LLM &#x524d;&#x90fd;&#x901a;&#x8fc7; CredentialVault.use &#x89e3;&#x5bc6;&#x4e00;&#x6b21; key&#xff0c;&#x5e76;&#x7559;&#x4e00;&#x884c;&#x8bbf;&#x95ee;&#x65e5;&#x5fd7;&#xff1b;key &#x4e0d;&#x7f13;&#x5b58;&#x3001;&#x4e0d;&#x8fd4;&#x56de;&#x7ed9;&#x4efb;&#x4f55;&#x5ba2;&#x6237;&#x7aef; &#xb7; decrypt the key through CredentialVault.use on every call, log the access, never cache it or return it","children":[],"payload":{"tag":"li","lines":"1600,1601"}},{"content":"&#x4e0d;&#x7528;&#x5728;&#x8fdb;&#x7a0b;&#x91cc;&#x7f13;&#x5b58; key &#xb7; Not caching the key in process&#xff1a;&#x540a;&#x9500;&#x540e;&#x8981;&#x7b49;&#x7f13;&#x5b58;&#x8fc7;&#x671f;&#x624d;&#x751f;&#x6548;&#xff0c;&#x8fdd;&#x80cc;&quot;&#x4e0b;&#x4e00;&#x6b21;&#x8c03;&#x7528;&#x5c31;&#x751f;&#x6548;&quot; &#xb7; revocation would wait for cache expiry, breaking &quot;takes effect on the next call&quot;","children":[],"payload":{"tag":"li","lines":"1601,1602"}},{"content":"&#x4e0d;&#x7528;&#x628a; key &#x53d1;&#x7ed9;&#x524d;&#x7aef;&#x76f4;&#x8fde;&#x63d0;&#x4f9b;&#x65b9; &#xb7; Not handing the key to the browser&#xff1a;&#x53c2;&#x8003;&#x5b9e;&#x73b0;&#x5c31;&#x662f;&#x628a;&#x89e3;&#x5bc6;&#x540e;&#x7684; key &#x8fd4;&#x56de;&#x7ed9;&#x754c;&#x9762;&#xff0c;&#x8fd9;&#x662f;&#x8981;&#x4fee;&#x7684;&#x7f3a;&#x9677; &#xb7; the reference implementation returned decrypted keys to the UI, the defect being fixed","children":[],"payload":{"tag":"li","lines":"1602,1603"}},{"content":"&#x4e0d;&#x7528;&#x73af;&#x5883;&#x53d8;&#x91cf;&#x653e; key &#xb7; Not environment variables&#xff1a;&#x6ca1;&#x6cd5;&#x6309;&#x7ec4;&#x5206;&#x914d;&#x3001;&#x8f6e;&#x6362;&#x548c;&#x5ba1;&#x8ba1;&#x6bcf;&#x6b21;&#x4f7f;&#x7528; &#xb7; no per-group assignment, rotation or per-use audit","children":[],"payload":{"tag":"li","lines":"1603,1604"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x6bcf;&#x6b21;&#x8c03;&#x7528;&#x591a;&#x4e00;&#x6b21;&#x89e3;&#x5bc6;&#x548c;&#x4e00;&#x6b21;&#x65e5;&#x5fd7;&#x5199;&#x5165;&#xff0c;&#x7ea6; 1 ms &#xb7; one extra decrypt and log write per call, about 1 ms","children":[],"payload":{"tag":"li","lines":"1604,1605"}},{"content":"&#x6765;&#x6e90; &#xb7; Source&#xff1a;docs/adr/0013-llm-access.md &#x51b3;&#x7b56; 2&#x3001;&#x5907;&#x9009;&#x65b9;&#x6848;&#x4e0e;&#x540e;&#x679c; &#xb7; ADR-0013 decision 2, alternatives and consequences","children":[],"payload":{"tag":"li","lines":"1605,1606"}}],"payload":{"tag":"li","lines":"1599,1606"}},{"content":"&#x2463; &#x6211;&#x7684;&#x6848;&#x4f8b; &#xb7; My case","children":[{"content":"&#x6211;&#x4f7f;&#x7528; CredentialVault &#x5728;&#x6bcf;&#x4e2a;&#x8bf7;&#x6c42;&#x4e2d;&#x83b7;&#x53d6; LLM &#x5bc6;&#x94a5;&#xff0c;&#x786e;&#x4fdd;&#x5bc6;&#x94a5;&#x6c38;&#x4e0d;&#x8fd4;&#x56de;&#x7ed9; UI&#x3002;","children":[],"payload":{"tag":"li","lines":"1607,1608"}},{"content":"I used the CredentialVault to fetch the LLM key on every request, ensuring the key is never returned to the UI.","children":[],"payload":{"tag":"li","lines":"1608,1609"}}],"payload":{"tag":"li","lines":"1606,1609"}},{"content":"&#x2464; &#x4ee3;&#x7801; &#xb7; Code&#xff1a;<code>apps/api/src/govapi/services/chat.py @ b4db244</code> &#xb7; &#x4ee3;&#x7801;&#x5728;&#x79c1;&#x6709;&#x4ed3;&#x5e93;&#xff0c;&#x672c;&#x5730;&#x5bfc;&#x56fe;&#x91cc;&#x770b; &#xb7; private repo, see the local map","children":[],"payload":{"tag":"li","lines":"1609,1610"}},{"content":"&#x2465; &#x8bc1;&#x636e; &#xb7; Evidence&#xff08;2026-09-23&#xff09;","children":[{"content":"&quot;+ - key &#x53ea;&#x4ece; vault &#x53d6;&#x3002; &#x6bcf;&#x6b21;&#x8c03;&#x7528;&#x90fd;&#x901a;&#x8fc7; <code>CredentialVault</code>&quot;","children":[],"payload":{"tag":"li","lines":"1611,1612"}}],"payload":{"tag":"li","lines":"1610,1612"}},{"content":"&#x9762;&#x8bd5;&#x600e;&#x4e48;&#x95ee; &#xb7; Asked as&#xff1a;&#x5728;&#x751f;&#x4ea7;&#x7cfb;&#x7edf;&#x4e2d;&#xff0c;&#x4f60;&#x4f7f;&#x7528;&#x54ea;&#x4e9b;&#x7b56;&#x7565;&#x6765;&#x7ba1;&#x7406;&#x7b2c;&#x4e09;&#x65b9;&#x670d;&#x52a1;&#x7684;&#x51ed;&#x8bc1;&#xff1f; &#xb7; What strategies can you use to manage credentials for third-party services in a production system?","children":[],"payload":{"tag":"li","lines":"1612,1614"}}],"payload":{"tag":"h4","lines":"1580,1581"}}],"payload":{"tag":"h3","lines":"1578,1579"}},{"content":"&#x53ef;&#x89c2;&#x6d4b;&#x6027;&#x4e0e;&#x8c03;&#x8bd5; &#xb7; Observability &amp; Debugging","children":[{"content":"&#x63a9;&#x7801;&#x7b56;&#x7565;&#x52a8;&#x4f5c;&#x6392;&#x5e8f; &#xb7; Mask Policy Action Ranking","children":[{"content":"&#x2460; &#x901a;&#x7528;&#x56de;&#x7b54; &#xb7; General answer","children":[{"content":"&#x5f53;&#x591a;&#x4e2a;&#x7b56;&#x7565;&#x52a8;&#x4f5c;&#x9002;&#x7528;&#x65f6;&#xff0c;&#x6839;&#x636e;&#x4f18;&#x5148;&#x7ea7;&#x548c;&#x6a21;&#x5f0f;&#x8fdb;&#x884c;&#x6392;&#x5e8f;&#xff1b;&#x63a9;&#x7801;&#x5e94;&#x4f4d;&#x4e8e;&#x963b;&#x6b62;&#x548c;&#x76d1;&#x89c6;&#x4e4b;&#x95f4;&#x3002;","children":[],"payload":{"tag":"li","lines":"1619,1620"}},{"content":"When multiple policy actions apply, rank them by priority and mode; mask should be considered between block and watch.","children":[],"payload":{"tag":"li","lines":"1620,1621"}}],"payload":{"tag":"li","lines":"1618,1621"}},{"content":"&#x2461; &#x539f;&#x7406; &#xb7; How it works","children":[{"content":"\n<pre data-lines=\"1622,1634\"><code class=\"language-text\">&#x6309;&#x5143;&#x7ec4;&#x53d6;&#x6700;&#x5927;&#x503c;&#xff0c;&#x4e0e;&#x8f93;&#x5165;&#x987a;&#x5e8f;&#x65e0;&#x5173; &#xb7; max() over a rank tuple, order-free\n  _rank(rule) = (priority, STRICTNESS[action], MODE[mode], policy_id)\n                  &#x2460; &#x5148;&#x6bd4;   &#x2461; &#x518d;&#x6bd4;            &#x2462; &#x518d;&#x6bd4;      &#x2463; &#x5b9a;&#x5e8f; tie-break\n  STRICTNESS:  allow 0 &#x2500;&#x25b6; watch 1 &#x2500;&#x25b6; mask 2 &#x2500;&#x25b6; block 3\n                                      &#x25b2; &#x4ecb;&#x4e8e;&#x4e24;&#x8005;&#x4e4b;&#x95f4; between\n  &#x89c4;&#x5219; rules &#x2500;&#x2500;&#x7b5b;&#x9009; filter(active, category)&#x2500;&#x2500;&#x25b6; max(key=_rank) &#x2500;&#x2500;&#x25b6; Decision\n                                      &#x2502;\n             should_mask = action==&quot;mask&quot;&#xff08;&#x4efb;&#x4f55;&#x6a21;&#x5f0f; any mode&#xff09;\n             should_block = block &#x4e14; enforce&#xff08;only in enforce&#xff09;\n&#x9ad8;&#x4f18;&#x5148;&#x7ea7; allow &#x538b;&#x8fc7;&#x4f4e;&#x4f18;&#x5148;&#x7ea7; block &#xb7; priority beats strictness by design\n</code></pre>","children":[],"payload":{"tag":"li","lines":"1622,1634"}}],"payload":{"tag":"li","lines":"1621,1634"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;mask &#x4f5c;&#x4e3a;&#x7b2c;&#x56db;&#x79cd;&#x52a8;&#x4f5c;&#xff0c;&#x4f18;&#x5148;&#x7ea7;&#x6700;&#x9ad8;&#x8005;&#x80dc;&#xff1b;&#x5e73;&#x5c40;&#x6309;&#x4e25;&#x683c;&#x7a0b;&#x5ea6; block &gt; mask &gt; watch &gt; allow &#xb7; mask as a fourth action; highest priority wins, ties go to the strictest, block &gt; mask &gt; watch &gt; allow","children":[],"payload":{"tag":"li","lines":"1635,1636"}},{"content":"&#x4e0d;&#x7528;&#x628a; mask &#x505a;&#x6210;&#x72ec;&#x7acb;&#x7684;&quot;&#x5904;&#x7406;&#x65b9;&#x5f0f;&quot;&#x5b57;&#x6bb5; &#xb7; Not mask as a separate field&#xff1a;&#x4f1a;&#x51fa;&#x73b0; block + mask &#x8fd9;&#x79cd;&#x65e0;&#x610f;&#x4e49;&#x7ec4;&#x5408;&#xff0c;&#x8fd8;&#x8981;&#x7b2c;&#x4e8c;&#x5957;&#x4f18;&#x5148;&#x7ea7;&#x89c4;&#x5219; &#xb7; allows meaningless block + mask pairs and needs a second ranking rule","children":[],"payload":{"tag":"li","lines":"1636,1637"}},{"content":"&#x4e0d;&#x7528;&#x804a;&#x5929;&#x91cc;&#x4e00;&#x5f8b;&#x8131;&#x654f; &#xb7; Not always masking in chat&#xff1a;&#x540c;&#x4e00;&#x7c7b;&#x522b;&#x5728;&#x684c;&#x9762;&#x5ba2;&#x6237;&#x7aef;&#x548c;&#x804a;&#x5929;&#x91cc;&#x884c;&#x4e3a;&#x4e0d;&#x4e00;&#x81f4;&#xff0c;&#x4e5f;&#x6ca1;&#x6cd5;&#x653e;&#x884c;&#x5141;&#x8bb8;&#x7684;&#x7c7b;&#x522b; &#xb7; the same category would behave differently in chat and desktop, and allowed categories could not pass","children":[],"payload":{"tag":"li","lines":"1637,1638"}},{"content":"&#x4e0d;&#x7528;&#x5e73;&#x5c40;&#x53d6;&#x6700;&#x5bbd;&#x677e;&#x7684; &#xb7; Not the most lenient on ties&#xff1a;&#x5b89;&#x5168;&#x7b56;&#x7565;&#x51b2;&#x7a81;&#x65f6;&#x5e94;&#x504f;&#x5411;&#x4fdd;&#x62a4;&#x6570;&#x636e; &#xb7; a policy conflict should fail toward protecting data","children":[],"payload":{"tag":"li","lines":"1638,1639"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x8bc4;&#x4f30;&#x51fd;&#x6570;&#x3001;&#x7f16;&#x8f91;&#x5668;&#x3001;/ingest/policy &#x548c;&#x786e;&#x8ba4;&#x9884;&#x89c8;&#x90fd;&#x8981;&#x6539;&#xff0c;&#x76f8;&#x5173;&#x6d4b;&#x8bd5;&#x5168;&#x90e8;&#x6269;&#x5c55; &#xb7; evaluation, the editor, /ingest/policy and the enforce preview all change, with their tests","children":[],"payload":{"tag":"li","lines":"1639,1640"}},{"content":"&#x6765;&#x6e90; &#xb7; Source&#xff1a;docs/adr/0014-mask-policy-action.md &#x51b3;&#x7b56; 2 &#x4e0e;&#x5907;&#x9009;&#x65b9;&#x6848; &#xb7; ADR-0014 decision 2 and alternatives","children":[],"payload":{"tag":"li","lines":"1640,1641"}}],"payload":{"tag":"li","lines":"1634,1641"}},{"content":"&#x2463; &#x6211;&#x7684;&#x6848;&#x4f8b; &#xb7; My case","children":[{"content":"&#x6211;&#x7f16;&#x5199;&#x4e86;&#x6d4b;&#x8bd5;&#xff0c;&#x8bc4;&#x4f30;&#x5305;&#x542b;&#x63a9;&#x7801;&#x3001;&#x963b;&#x6b62;&#x548c;&#x76d1;&#x89c6;&#x52a8;&#x4f5c;&#x7684;&#x89c4;&#x5219;&#xff0c;&#x786e;&#x8ba4;&#x63a9;&#x7801;&#x6392;&#x5e8f;&#x6b63;&#x786e;&#x3002;","children":[],"payload":{"tag":"li","lines":"1642,1643"}},{"content":"I wrote tests that evaluate rules with mask, block, and watch actions, confirming mask ranks correctly.","children":[],"payload":{"tag":"li","lines":"1643,1644"}}],"payload":{"tag":"li","lines":"1641,1644"}},{"content":"&#x2464; &#x4ee3;&#x7801; &#xb7; Code&#xff1a;<code>apps/api/src/govapi/services/evaluation.py @ 90703bb</code> &#xb7; &#x4ee3;&#x7801;&#x5728;&#x79c1;&#x6709;&#x4ed3;&#x5e93;&#xff0c;&#x672c;&#x5730;&#x5bfc;&#x56fe;&#x91cc;&#x770b; &#xb7; private repo, see the local map","children":[],"payload":{"tag":"li","lines":"1644,1645"}},{"content":"&#x2465; &#x8bc1;&#x636e; &#xb7; Evidence&#xff08;2026-09-23&#xff09;","children":[{"content":"&quot;+ assert evaluate([_rule(&quot;watch&quot;), _rule(&quot;mask&quot;)], &quot;email&quot;).action == &quot;mask&quot;&quot;","children":[],"payload":{"tag":"li","lines":"1646,1647"}}],"payload":{"tag":"li","lines":"1645,1647"}},{"content":"&#x9762;&#x8bd5;&#x600e;&#x4e48;&#x95ee; &#xb7; Asked as&#xff1a;&#x4f60;&#x5982;&#x4f55;&#x5904;&#x7406;&#x53ef;&#x80fd;&#x51b2;&#x7a81;&#x7684;&#x591a;&#x79cd;&#x7b56;&#x7565;&#x52a8;&#x4f5c;&#xff0c;&#x4f8b;&#x5982;&#x963b;&#x6b62;&#x3001;&#x63a9;&#x7801;&#x548c;&#x76d1;&#x89c6;&#xff1f; &#xb7; How do you handle multiple policy actions that may conflict, such as block, mask, and watch?","children":[],"payload":{"tag":"li","lines":"1647,1649"}}],"payload":{"tag":"h4","lines":"1616,1617"}}],"payload":{"tag":"h3","lines":"1614,1615"}},{"content":"&#x5927;&#x6a21;&#x578b;&#x4e0e;&#x667a;&#x80fd;&#x4f53;&#x8bbe;&#x8ba1; &#xb7; LLM / AI Agent Design","children":[{"content":"LLM &#x63d0;&#x4f9b;&#x5546;&#x62bd;&#x8c61; &#xb7; LLM Provider Abstraction","children":[{"content":"&#x2460; &#x901a;&#x7528;&#x56de;&#x7b54; &#xb7; General answer","children":[{"content":"&#x901a;&#x8fc7;&#x5b9a;&#x4e49;&#x901a;&#x7528;&#x63a5;&#x53e3;&#x548c;&#x5177;&#x4f53;&#x5b9e;&#x73     start, end, content_hash, model, embedding  &#x2502;\n  &#x2514;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2518;\n  &#x67e5;&#x8be2; query: ORDER BY embedding &lt;=&gt; :q LIMIT k   &#x540c;&#x4e00;&#x4e8b;&#x52a1; same transaction\n&#x8981;&#x6362; pgvector &#x955c;&#x50cf;&#xff1b;&#x8d85;&#x5927;&#x89c4;&#x6a21;&#x624d;&#x9700;&#x4e13;&#x7528;&#x5e93; &#xb7; dedicated store only at huge scale\n</code></pre>","children":[],"payload":{"tag":"li","lines":"1735,1749"}}],"payload":{"tag":"li","lines":"1734,1749"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;&#x5728;&#x73b0;&#x6709; Postgres &#x91cc;&#x88c5; pgvector&#xff0c;&#x53ea;&#x5efa;&#x4e00;&#x5f20; file_chunks &#x8868;&#x5b58;&#x5411;&#x91cf; &#xb7; pgvector in the existing Postgres, with one file_chunks table for vectors","children":[],"payload":{"tag":"li","lines":"1750,1751"}},{"content":"&#x4e0d;&#x7528;&#x5916;&#x90e8;&#x5411;&#x91cf;&#x5e93;&#xff08;Pinecone&#x3001;Weaviate&#x3001;Qdrant&#xff09;&#xb7; Not an external vector DB&#xff1a;&#x591a;&#x4e00;&#x4e2a;&#x8981;&#x4fdd;&#x62a4;&#x7684;&#x670d;&#x52a1;&#xff0c;&#x6570;&#x636e;&#x91cf;&#x4e5f;&#x7528;&#x4e0d;&#x7740; &#xb7; one more service to secure, and the data volume does not need it","children":[],"payload":{"tag":"li","lines":"1751,1752"}},{"content":"&#x4e0d;&#x7528; Elasticsearch / OpenSearch &#x5411;&#x91cf;&#x68c0;&#x7d22; &#xb7; Not Elasticsearch vectors&#xff1a;&#x8981;&#x591a;&#x8fd0;&#x7ef4;&#x4e00;&#x4e2a;&#x96c6;&#x7fa4;&#xff0c;&#x6743;&#x9650;&#x8fc7;&#x6ee4;&#x8fd8;&#x5f97;&#x548c; Postgres &#x540c;&#x6b65; &#xb7; another cluster to run, with visibility filters to sync from Postgres","children":[],"payload":{"tag":"li","lines":"1752,1753"}},{"content":"&#x4e0d;&#x7528; FAISS &#x653e;&#x5728;&#x8fdb;&#x7a0b;&#x5185;&#x5b58; &#xb7; Not in-process FAISS&#xff1a;&#x4e0d;&#x6301;&#x4e45;&#x3001;&#x4e0d;&#x8de8;&#x8fdb;&#x7a0b;&#xff0c;&#x4e5f;&#x6ca1;&#x6cd5;&#x548c;&#x6587;&#x4ef6;&#x53ef;&#x89c1;&#x6027;&#x5728;&#x4e00;&#x6761; SQL &#x91cc;&#x8fc7;&#x6ee4; &#xb7; not durable or shared, and cannot filter by file visibility in one SQL query","children":[],"payload":{"tag":"li","lines":"1753,1754"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x8981;&#x6362;&#x6570;&#x636e;&#x5e93;&#x955c;&#x50cf;&#xff1b;&#x5411;&#x91cf;&#x4e0a;&#x5230;&#x5343;&#x4e07;&#x7ea7;&#x65f6; Postgres &#x7684;&#x68c0;&#x7d22;&#x6027;&#x80fd;&#x548c;&#x8c03;&#x4f18;&#x4e0d;&#x5982;&#x4e13;&#x7528;&#x5e93; &#xb7; a new database image; at tens of millions of vectors Postgres trails dedicated engines","children":[],"payload":{"tag":"li","lines":"1754,1755"}},{"content":"&#x4ec0;&#x4e48;&#x65f6;&#x5019;&#x6362; &#xb7; Switch when&#xff1a;&#x5411;&#x91cf;&#x91cf;&#x7ea7;&#x6216;&#x67e5;&#x8be2;&#x5ef6;&#x8fdf;&#x8d85;&#x51fa;&#x5355;&#x4e2a; Postgres &#x80fd;&#x627f;&#x53d7;&#x7684;&#x8303;&#x56f4; &#xb7; vector count or query latency outgrows a single Postgres","children":[],"payload":{"tag":"li","lines":"1755,1756"}},{"content":"&#x6765;&#x6e90; &#xb7; Source&#xff1a;docs/adr/0015-vector-store-and-embeddings.md &#x51b3;&#x7b56; 1 &#x4e0e;&#x5907;&#x9009;&#x65b9;&#x6848; &#xb7; ADR-0015 decision 1 and alternatives","children":[],"payload":{"tag":"li","lines":"1756,1757"}}],"payload":{"tag":"li","lines":"1749,1757"}},{"content":"&#x2463; &#x6211;&#x7684;&#x6848;&#x4f8b; &#xb7; My case","children":[{"content":"&#x6211;&#x6dfb;&#x52a0;&#x4e86;&#x4e00;&#x4e2a; file_chunks &#x8868;&#xff0c;&#x5305;&#x542b;&#x5411;&#x91cf;&#x5217;&#xff0c;&#x5e76;&#x521b;&#x5efa;&#x4e86; HNSW &#x4f59;&#x5f26;&#x7d22;&#x5f15;&#xff0c;&#x4ee5;&#x652f;&#x6301;&#x6587;&#x6863;&#x5757;&#x7684;&#x6700;&#x8fd1;&#x90bb;&#x641c;&#x7d22;&#x3002;","children":[],"payload":{"tag":"li","lines":"1758,1759"}},{"content":"I added a file_chunks table with a vector column and created an HNSW cosine index to support nearest neighbor search for document chunks.","children":[],"payload":{"tag":"li","lines":"1759,1760"}}],"payload":{"tag":"li","lines":"1757,1760"}},{"content":"&#x2464; &#x4ee3;&#x7801; &#xb7; Code&#xff1a;<code>apps/api/src/govapi/migrations/versions/fe333607c6c1_retrieval_pgvector_file_chunks_index_.py @ 02d0b6c</code> &#xb7; &#x4ee3;&#x7801;&#x5728;&#x79c1;&#x6709;&#x4ed3;&#x5e93;&#xff0c;&#x672c;&#x5730;&#x5bfc;&#x56fe;&#x91cc;&#x770b; &#xb7; private repo, see the local map","children":[],"payload":{"tag":"li","lines":"1760,1761"}},{"content":"&#x2465; &#x8bc1;&#x636e; &#xb7; Evidence&#xff08;2026-09-23&#xff09;","children":[{"content":"&quot;feat(api): file_chunks (positions + vector(768), no text), index_jobs, files.index_status&quot;","children":[],"payload":{"tag":"li","lines":"1762,1763"}}],"payload":{"tag":"li","lines":"1761,1763"}},{"content":"&#x9762;&#x8bd5;&#x600e;&#x4e48;&#x95ee; &#xb7; Asked as&#xff1a;&#x5982;&#x4f55;&#x5728;&#x5173;&#x7cfb;&#x578b;&#x6570;&#x636e;&#x5e93;&#x4e2d;&#x5b58;&#x50a8;&#x548c;&#x67e5;&#x8be2;&#x9ad8;&#x7ef4;&#x5d4c;&#x5165;&#xff1f; &#xb7; How would you store and query high-dimensional embeddings in a relational database?","children":[],"payload":{"tag":"li","lines":"1763,1765"}}],"payload":{"tag":"h4","lines":"1729,1730"}},{"content":"&#x4ec5;&#x5b58;&#x50a8;&#x5d4c;&#x5165;&#x548c;&#x5143;&#x6570;&#x636e; &#xb7; Storing only embeddings and metadata","children":[{"content":"&#x2460; &#x901a;&#x7528;&#x56de;&#x7b54; &#xb7; General answer","children":[{"content":"&#x4ec5;&#x5b58;&#x50a8;&#x5d4c;&#x5165;&#x548c;&#x5143;&#x6570;&#x636e;&#x53ef;&#x4ee5;&#x51cf;&#x5c11;&#x5b58;&#x50a8;&#x5360;&#x7528;&#xff0c;&#x63d0;&#x9ad8;&#x9690;&#x79c1;&#xff0c;&#x5e76;&#x52a0;&#x901f;&#x76f8;&#x4f3c;&#x5ea6;&#x67e5;&#x8be2;&#x3002;","children":[],"payload":{"tag":"li","lines":"1768,1769"}},{"content":"Storing only embeddings and metadata reduces storage footprint, improves privacy, and speeds up similarity queries.","children":[],"payload":{"tag":"li","lines":"1769,1770"}}],"payload":{"tag":"li","lines":"1767,1770"}},{"content":"&#x2461; &#x539f;&#x7406; &#xb7; How it works","children":[{"content":"\n<pre data-lines=\"1771,1786\"><code class=\"language-text\">&#x5206;&#x5757;&#x53ea;&#x5b58;&#x4f4d;&#x7f6e;&#x3001;&#x6307;&#x7eb9;&#x3001;&#x5411;&#x91cf; &#xb7; chunk = pointer + fingerprint + vector, no text\n  &#x6587;&#x4ef6; file&#xff08;&#x5bf9;&#x8c61;&#x5b58;&#x50a8; object store&#xff0c;&#x5df2;&#x52a0;&#x5bc6; encrypted&#xff09;\n     &#x2502; extract_text &#x2192; chunk &#x2192; [start, end)\n     &#x25bc;\n  file_chunks &#x884c; row: file_id &#x2502; start &#x2502; end &#x2502; sha256 &#x2502; model &#x2502; vector(768)\n                                     &#x6ca1;&#x6709; text &#x5217; &#xb7; no text column\n  &#x68c0;&#x7d22; retrieval:\n  &#x5411;&#x91cf;&#x547d;&#x4e2d; hit &#x2500;&#x25b6; &#x8bfb;&#x539f;&#x6587; read file &#x2500;&#x25b6; text[start:end] &#x2500;&#x25b6; &#x54c8;&#x5e0c;&#x4e00;&#x81f4;&#xff1f;hash match?\n                                                    &#x2502;&#x662f; yes      &#x2502;&#x5426; no\n                                                    &#x25bc;            &#x25bc;\n                                             &#x8131;&#x654f;&#x540e;&#x5165;&#x63d0;&#x793a;&#x8bcd;   &#x4e22;&#x5f03;&#x5e76;&#x91cd;&#x5efa;&#x7d22;&#x5f15;\n                                             mask &#x2192; prompt    drop + reindex\n&#x68c0;&#x7d22;&#x591a;&#x8bfb;&#x4e00;&#x6b21;&#x6587;&#x4ef6;&#xff0c;&#x4f46;&#x6ca1;&#x6709;&#x7b2c;&#x4e8c;&#x4efd;&#x6587;&#x672c; &#xb7; extra read, but no second copy of text\n</code></pre>","children":[],"payload":{"tag":"li","lines":"1771,1786"}}],"payload":{"tag":"li","lines":"1770,1786"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;&#x5206;&#x5757;&#x884c;&#x53ea;&#x5b58;&#x6587;&#x4ef6; id&#x3001;&#x5b57;&#x7b26;&#x533a;&#x95f4;&#x3001;&#x5185;&#x5bb9;&#x54c8;&#x5e0c;&#x3001;&#x6a21;&#x578b; id &#x548c; 768 &#x7ef4;&#x5411;&#x91cf;&#xff0c;&#x68c0;&#x7d22;&#x65f6;&#x4ece;&#x6587;&#x4ef6;&#x5b58;&#x50a8;&#x8bfb;&#x539f;&#x6587;&#x518d;&#x5207;&#x7247; &#xb7; chunk rows keep file id, offsets, content hash, model id and a 768-dim vector; text is re-read and sliced at query time","children":[],"payload":{"tag":"li","lines":"1787,1788"}},{"content":"&#x4e0d;&#x7528;&#x53e6;&#x5b58;&#x4e00;&#x4efd;&#x5206;&#x5757;&#x6587;&#x672c; &#xb7; Not a second copy of chunk text&#xff1a;&#x654f;&#x611f;&#x6587;&#x672c;&#x591a;&#x4e00;&#x5904;&#x8981;&#x4fdd;&#x62a4;&#x3001;&#x5220;&#x9664;&#x548c;&#x5ba1;&#x8ba1;&#x7684;&#x5730;&#x65b9;&#xff0c;&#x53c2;&#x8003;&#x5b9e;&#x73b0;&#x6b63;&#x662f;&#x8fd9;&#x4e48;&#x505a;&#x7684; &#xb7; a second place to protect, delete and audit, the reference implementation&apos;s defect","children":[],"payload":{"tag":"li","lines":"1788,1789"}},{"content":"&#x4e0d;&#x7528;&#x53ea;&#x5b58;&#x5411;&#x91cf;&#x4e0d;&#x5b58;&#x54c8;&#x5e0c; &#xb7; Not vectors without a hash&#xff1a;&#x539f;&#x6587;&#x4ef6;&#x53d8;&#x4e86;&#x4e5f;&#x53d1;&#x73b0;&#x4e0d;&#x4e86;&#xff0c;&#x4f1a;&#x8fd4;&#x56de;&#x5bf9;&#x4e0d;&#x4e0a;&#x7684;&#x7247;&#x6bb5; &#xb7; a changed file would go unnoticed and return mismatched slices","children":[],"payload":{"tag":"li","lines":"1789,1790"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x6bcf;&#x6b21;&#x68c0;&#x7d22;&#x90fd;&#x8981;&#x591a;&#x8bfb;&#x4e00;&#x6b21;&#x6587;&#x4ef6;&#x5b58;&#x50a8;&#xff1b;&#x54c8;&#x5e0c;&#x5bf9;&#x4e0d;&#x4e0a;&#x8981;&#x4e22;&#x5f03;&#x5206;&#x5757;&#x5e76;&#x91cd;&#x65b0;&#x7d22;&#x5f15; &#xb7; every retrieval re-reads the file store, and a hash mismatch forces a re-index","children":[],"payload":{"tag":"li","lines":"1790,1791"}},{"content":"&#x6765;&#x6e90; &#xb7; Source&#xff1a;docs/adr/0015-vector-store-and-embeddings.md &#x51b3;&#x7b56; 2 &#x4e0e;&#x80cc;&#x666f;&#xff1b;spec/m5b-retrieval.md R5 &#xb7; ADR-0015 decision 2 and background; spec m5b-retrieval R5","children":[],"payload":{"tag":"li","lines":"1791,1792"}}],"payload":{"tag":"li","lines":"1786,1792"}},{"content":"&#x2463; &#x6211;&#x7684;&#x6848;&#x4f8b; &#xb7; My case","children":[{"content":"&#x6211;&#x8bbe;&#x8ba1;&#x4e86; FileChunk &#x6a21;&#x578b;&#xff0c;&#x4ec5;&#x4fdd;&#x7559;&#x504f;&#x79fb;&#x91cf;&#x3001;&#x54c8;&#x5e0c;&#x3001;&#x6a21;&#x578b; ID &#x548c; 768 &#x7ef4;&#x5411;&#x91cf;&#xff0c;&#x7701;&#x7565;&#x539f;&#x59cb;&#x6587;&#x672c;&#x3002;","children":[],"payload":{"tag":"li","lines":"1793,1794"}},{"content":"I designed the FileChunk model to keep offsets, hash, model id, and a 768-dim vector, omitting the original text.","children":[],"payload":{"tag":"li","lines":"1794,1795"}}],"payload":{"tag":"li","lines":"1792,1795"}},{"content":"&#x2464; &#x4ee3;&#x7801; &#xb7; Code&#xff1a;<code>apps/api/src/govapi/models/retrieval.py @ 02d0b6c</code> &#xb7; &#x4ee3;&#x7801;&#x5728;&#x79c1;&#x6709;&#x4ed3;&#x5e93;&#xff0c;&#x672c;&#x5730;&#x5bfc;&#x56fe;&#x91cc;&#x770b; &#xb7; private repo, see the local map","children":[],"payload":{"tag":"li","lines":"1795,1796"}},{"content":"&#x2465; &#x8bc1;&#x636e; &#xb7; Evidence&#xff08;2026-09-23&#xff09;","children":[{"content":"&quot;Spec m5b-retrieval R4, R5, R11 (ADR-0015): chunks keep offsets, a hash, the model and a 768-dimension vector, never text; nearest chunks come back by cosine distance.&quot;","children":[],"payload":{"tag":"li","lines":"1797,1798"}}],"payload":{"tag":"li","lines":"1796,1798"}},{"content":"&#x9762;&#x8bd5;&#x600e;&#x4e48;&#x95ee; &#xb7; Asked as&#xff1a;&#x4ec5;&#x5b58;&#x50a8;&#x5d4c;&#x5165;&#x800c;&#x975e;&#x539f;&#x59cb;&#x6587;&#x672c;&#x7684;&#x597d;&#x5904;&#x662f;&#x4ec0;&#x4e48;&#xff1f; &#xb7; What are the benefits of storing only embeddings instead of raw text?","children":[],"payload":{"tag":"li","lines":"1798,1800"}}],"payload":{"tag":"h4","lines":"1765,1766"}},{"content":"HNSW &#x7d22;&#x5f15;&#x7528;&#x4e8e;&#x8fd1;&#x4f3c;&#x6700;&#x8fd1;&#x90bb;&#x641c;&#x7d22; &#xb7; HNSW index for approximate nearest neighbor search","children":[{"content":"&#x2460; &#x901a;&#x7528;&#x56de;&#x7b54; &#xb7; General answer","children":[{"content":"HNSW&#xff08;&#x5c42;&#x6b21;&#x53ef;&#x5bfc;&#x822a;&#x5c0f;&#x4e16;&#x754c;&#xff09;&#x662f;&#x4e00;&#x79cd;&#x57fa;&#x4e8e;&#x56fe;&#x7684;&#x7d22;&#x5f15;&#xff0c;&#x63d0;&#x4f9b;&#x5b50;&#x7ebf;&#x6027;&#x65f6;&#x95f4;&#x590d;&#x6742;&#x5ea6;&#x7684;&#x5feb;&#x901f;&#x8fd1;&#x4f3c;&#x6700;&#x8fd1;&#x90bb;&#x67e5;&#x8be2;&#x3002;","children":[],"payload":{"tag":"li","lines":"1803,1804"}},{"content":"HNSW (Hierarchical Navigable Small World) is a graph-based index that provides fast approximate nearest neighbor queries with sub-linear time complexity.","children":[],"payload":{"tag":"li","lines":"1804,1805"}}],"payload":{"tag":"li","lines":"1802,1805"}},{"content":"&#x2461; &#x539f;&#x7406; &#xb7; How it works","children":[{"content":"\n<pre data-lines=\"1806,1819\"><code class=\"language-text\">&#x5206;&#x5c42;&#x56fe;&#xff1a;&#x4e0a;&#x5c42;&#x8fdc;&#x8df3;&#xff0c;&#x4e0b;&#x5c42;&#x7cbe;&#x641c; &#xb7; layered graph: long hops on top, refine below\n  L2   A &#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500; F                 &#x5165;&#x53e3; entry point\n       &#x2502;                     &#x2502;\n  L1   A &#x2500;&#x2500;&#x2500;&#x2500; C &#x2500;&#x2500;&#x2500;&#x2500; F &#x2500;&#x2500;&#x2500;&#x2500; H                  &#x8d2a;&#x5fc3;&#x8d70;&#x5411;&#x66f4;&#x8fd1;&#x7684;&#x70b9; greedy to closer\n       &#x2502;      &#x2502;      &#x2502;\n  L0   A&#x2500;B&#x2500;C&#x2500;D&#x2500;E&#x2500;F&#x2500;G&#x2500;H&#x2500;I&#x2500;J   &#x25c0;&#x2500;&#x2500; &#x67e5;&#x8be2; q &#x5728;&#x6b64;&#x7ec6;&#x641c; refine near q\n  &#x66b4;&#x529b; brute force: &#x6bd4;&#x8f83;&#x5168;&#x90e8; N &#x884c; O(N)\n  HNSW: &#x6bcf;&#x5c42;&#x53ea;&#x770b;&#x90bb;&#x5c45; &#x2248; O(log N)&#xff0c;&#x7ed3;&#x679c;&#x8fd1;&#x4f3c; approximate\n  &#x7d22;&#x5f15; index: USING hnsw (embedding vector_cosine_ops)\n  &#x67e5;&#x8be2;&#x987b;&#x7528;&#x540c;&#x4e00;&#x8ddd;&#x79bb; &lt;=&gt;&#xff08;&#x4f59;&#x5f26; cosine&#xff09;&#x624d;&#x4f1a;&#x8d70;&#x7d22;&#x5f15; &#xb7; query must use &lt;=&gt; to hit it\n&#x5efa;&#x7d22;&#x5f15;&#x6162;&#x3001;&#x5360;&#x5185;&#x5b58;&#x3001;&#x53ec;&#x56de;&lt;100% &#xb7; build cost; small tables scan faster anyway\n</code></pre>","children":[],"payload":{"tag":"li","lines":"1806,1819"}}],"payload":{"tag":"li","lines":"1805,1819"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;&#x5728; file_chunks.embedding &#x4e0a;&#x5efa; pgvector &#x7684; HNSW &#x4f59;&#x5f26;&#x7d22;&#x5f15; &#xb7; a pgvector HNSW cosine index on the file_chunks vector column","children":[],"payload":{"tag":"li","lines":"1820,1821"}},{"content":"&#x4e0d;&#x7528; IVFFlat &#xb7; Not IVFFlat&#xff1a;&#x8981;&#x5148;&#x6709;&#x6570;&#x636e;&#x624d;&#x80fd;&#x8bad;&#x7ec3;&#x805a;&#x7c7b;&#x4e2d;&#x5fc3;&#xff0c;&#x6570;&#x636e;&#x53d8;&#x4e86;&#x53ec;&#x56de;&#x4f1a;&#x4e0b;&#x964d;&#xff0c;&#x8981;&#x5b9a;&#x671f;&#x91cd;&#x5efa; &#xb7; needs data before building its lists, and recall drops as data changes unless rebuilt","children":[],"payload":{"tag":"li","lines":"1821,1822"}},{"content":"&#x4e0d;&#x7528;&#x4e0d;&#x5efa;&#x7d22;&#x5f15;&#x3001;&#x5168;&#x8868;&#x626b;&#x63cf; &#xb7; Not a sequential scan&#xff1a;&#x7ed3;&#x679c;&#x7cbe;&#x786e;&#xff0c;&#x4f46;&#x5ef6;&#x8fdf;&#x968f;&#x5206;&#x5757;&#x6570;&#x7ebf;&#x6027;&#x589e;&#x957f; &#xb7; exact, but latency grows linearly with chunk count","children":[],"payload":{"tag":"li","lines":"1822,1823"}},{"content":"&#x4e0d;&#x7528; L2 &#x6216;&#x5185;&#x79ef;&#x8ddd;&#x79bb; &#xb7; Not L2 or inner product&#xff1a;&#x68c0;&#x7d22;&#x9608;&#x503c;&#x6309;&#x4f59;&#x5f26;&#x8ddd;&#x79bb; &#x2264; 0.35 &#x5b9a;&#x4e49;&#xff0c;&#x7d22;&#x5f15;&#x8981;&#x548c;&#x67e5;&#x8be2;&#x7684;&#x8ddd;&#x79bb;&#x7b97;&#x5b50;&#x4e00;&#x81f4; &#xb7; the threshold is cosine distance &#x2264; 0.35, and the index must match the query operator","children":[],"payload":{"tag":"li","lines":"1823,1824"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x5efa;&#x7d22;&#x5f15;&#x6162;&#x3001;&#x5360;&#x5185;&#x5b58;&#x591a;&#xff0c;&#x800c;&#x4e14;&#x662f;&#x8fd1;&#x4f3c;&#x7ed3;&#x679c;&#xff0c;&#x5076;&#x5c14;&#x4f1a;&#x6f0f;&#x6389;&#x771f;&#x6b63;&#x6700;&#x8fd1;&#x7684;&#x5206;&#x5757; &#xb7; slower builds, more memory, and approximate results that can miss the true nearest chunk","children":[],"payload":{"tag":"li","lines":"1824,1825"}},{"content":"&#x6765;&#x6e90; &#xb7; Source&#xff1a;&#x901a;&#x7528;&#x7406;&#x7531;&#xff0c;&#x4ed3;&#x5e93;&#x91cc;&#x6ca1;&#x6709;&#x8bb0;&#x5f55;&#x4e3a;&#x4ec0;&#x4e48;&#x4e0d;&#x7528;&#x522b;&#x7684; &#xb7; general reasoning; the repo records no reason","children":[],"payload":{"tag":"li","lines":"1825,1826"}}],"payload":{"tag":"li","lines":"1819,1826"}},{"content":"&#x2463; &#x6211;&#x7684;&#x6848;&#x4f8b; &#xb7; My case","children":[{"content":"&#x6211;&#x5728; file_chunks &#x7684;&#x5411;&#x91cf;&#x5217;&#x4e0a;&#x521b;&#x5efa;&#x4e86; HNSW &#x4f59;&#x5f26;&#x7d22;&#x5f15;&#xff0c;&#x4ee5;&#x52a0;&#x901f;&#x76f8;&#x5173;&#x6587;&#x6863;&#x5757;&#x7684;&#x68c0;&#x7d22;&#x3002;","children":[],"payload":{"tag":"li","lines":"1827,1828"}},{"content":"I created an HNSW cosine index on the vector column of file_chunks to accelerate retrieval of relevant document chunks.","children":[],"payload":{"tag":"li","lines":"1828,1829"}}],"payload":{"tag":"li","lines":"1826,1829"}},{"content":"&#x2464; &#x4ee3;&#x7801; &#xb7; Code&#xff1a;<code>apps/api/src/govapi/models/retrieval.py @ 02d0b6c</code> &#xb7; &#x4ee3;&#x7801;&#x5728;&#x79c1;&#x6709;&#x4ed3;&#x5e93;&#xff0c;&#x672c;&#x5730;&#x5bfc;&#x56fe;&#x91cc;&#x770b; &#xb7; private repo, see the local map","children":[],"payload":{"tag":"li","lines":"1829,1830"}},{"content":"&#x2465; &#x8bc1;&#x636e; &#xb7; Evidence&#xff08;2026-09-23&#xff09;","children":[{"content":"&quot;Migration fe333607c6c1 enables pgvector and adds an HNSW cosine index; round trip and alembic check clean.&quot;","children":[],"payload":{"tag":"li","lines":"1831,1832"}}],"payload":{"tag":"li","lines":"1830,1832"}},{"content":"&#x9762;&#x8bd5;&#x600e;&#x4e48;&#x95ee; &#xb7; Asked as&#xff1a;&#x5982;&#x4f55;&#x5728; Postgres &#x4e2d;&#x5b9e;&#x73b0;&#x8fd1;&#x4f3c;&#x6700;&#x8fd1;&#x90bb;&#x641c;&#x7d22;&#xff1f; &#xb7; How do you implement approximate nearest neighbor search in Postgres?","children":[],"payload":{"tag":"li","lines":"1832,1834"}}],"payload":{"tag":"h4","lines":"1800,1801"}}],"payload":{"tag":"h3","lines":"1727,1728"}},{"content":"&#x5e76;&#x53d1;&#x4e0e;&#x5f02;&#x6b65; &#xb7; Concurrency &amp; Async","children":[{"content":"&#x4f7f;&#x7528; httpx &#x548c; SQLAlchemy &#x7684;&#x5f02;&#x6b65;&#x6d4b;&#x8bd5; &#xb7; Async testing with httpx and SQLAlchemy","children":[{"content":"&#x2460; &#x901a;&#x7528;&#x56de;&#x7b54; &#xb7; General answer","children":[{"content":"&#x5f02;&#x6b65;&#x6d4b;&#x8bd5;&#x4f7f;&#x7528; async/await &#x5e76;&#x53d1;&#x6267;&#x884c; I/O &#x7ed1;&#x5b9a;&#x64cd;&#x4f5c;&#xff0c;&#x5229;&#x7528; httpx.AsyncClient &#x548c; SQLAlchemy &#x7684; async_sessionmaker &#x7b49;&#x5e93;&#x3002;","children":[],"payload":{"tag":"li","lines":"1839,1840"}},{"content":"Async tests use async/await to run I/O-bound operations concurrently, leveraging libraries like httpx.AsyncClient and SQLAlchemy&apos;s async_sessionmaker.","children":[],"payload":{"tag":"li","lines":"1840,1841"}}],"payload":{"tag":"li","lines":"1838,1841"}},{"content":"&#x2461; &#x539f;&#x7406; &#xb7; How it works","children":[{"content":"\n<pre data-lines=\"1842,1858\"><code class=\"language-text\">&#x540c;&#x4e00;&#x4e8b;&#x4ef6;&#x5faa;&#x73af;&#xff1a;&#x5148;&#x8c03;&#x63a5;&#x53e3;&#xff0c;&#x518d;&#x67e5;&#x5e93; &#xb7; one loop: call the API, then check the DB\n  pytest-asyncio &#x6d4b;&#x8bd5; test\n     &#x2502; await _upload(client)\n     &#x25bc;\n  httpx.AsyncClient &#x2500;&#x2500;ASGI &#x8fdb;&#x7a0b;&#x5185; in-process&#x2500;&#x2500;&#x25b6; FastAPI app &#x2500;&#x2500;&#x25b6; Postgres\n     &#x2502; 201 + file_id                                        &#x25b2;\n     &#x25bc;                                                      &#x2502;\n  async with session_factory() as session: &#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2518;\n     session.add(FileChunk&#x2026;) &#x2192; await commit()\n     await session.execute(select(&#x2026; cosine_distance &#x2026;))\n     &#x2502;\n     &#x25bc;\n  assert &#x884c;&#x5e8f; row order == [10, 20]\n&#x76f4;&#x63a5;&#x5199;&#x5e93;&#x7ed5;&#x8fc7;&#x670d;&#x52a1;&#x5c42; &#xb7; verifies storage, not the indexing path\n</code></pre>","children":[],"payload":{"tag":"li","lines":"1842,1858"}}],"payload":{"tag":"li","lines":"1841,1858"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;&#x7528; httpx.AsyncClient &#x901a;&#x8fc7; ASGI &#x76f4;&#x63a5;&#x8c03;&#x5e94;&#x7528;&#x4e0a;&#x4f20;&#x6587;&#x4ef6;&#xff0c;&#x518d;&#x7528;&#x5f02;&#x6b65; session &#x67e5;&#x5e93;&#x9a8c;&#x8bc1;&#x5206;&#x5757; &#xb7; httpx.AsyncClient over ASGI to upload, then an async session to check the stored chunks","children":[],"payload":{"tag":"li","lines":"1859,1860"}},{"content":"&#x4e0d;&#x7528; FastAPI &#x7684;&#x540c;&#x6b65; TestClient &#xb7; Not the sync TestClient&#xff1a;&#x5b83;&#x5728;&#x53e6;&#x4e00;&#x4e2a;&#x7ebf;&#x7a0b;&#x8dd1;&#x4e8b;&#x4ef6;&#x5faa;&#x73af;&#xff0c;&#x548c;&#x5f02;&#x6b65; session&#x3001;fixture &#x6df7;&#x7528;&#x5bb9;&#x6613;&#x51fa;&#x5faa;&#x73af;&#x51b2;&#x7a81; &#xb7; it runs its own event loop in a thread, which clashes with async sessions and fixtures","children":[],"payload":{"tag":"li","lines":"1860,1861"}},{"content":"&#x4e0d;&#x7528;&#x8d77;&#x771f;&#x670d;&#x52a1;&#x5668;&#x518d;&#x53d1; HTTP &#xb7; Not a live server over the network&#xff1a;&#x6162;&#xff0c;&#x8fd8;&#x8981;&#x7ba1;&#x7aef;&#x53e3;&#x548c;&#x8fdb;&#x7a0b; &#xb7; slower, and needs ports and processes managed","children":[],"payload":{"tag":"li","lines":"1861,1862"}},{"content":"&#x4e0d;&#x7528;&#x53ea; mock &#x6570;&#x636e;&#x5e93;&#x5c42; &#xb7; Not mocking the repository&#xff1a;&#x6d4b;&#x4e0d;&#x5230; pgvector &#x7684;&#x771f;&#x5b9e;&#x5b58;&#x50a8;&#x548c;&#x67e5;&#x8be2; &#xb7; would not exercise the real pgvector storage and query","children":[],"payload":{"tag":"li","lines":"1862,1863"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x8981; pytest-asyncio &#x4e4b;&#x7c7b;&#x63d2;&#x4ef6;&#xff0c;fixture &#x4f5c;&#x7528;&#x57df;&#x548c;&#x4e8b;&#x4ef6;&#x5faa;&#x73af;&#x914d;&#x7f6e;&#x66f4;&#x5bb9;&#x6613;&#x51fa;&#x9519; &#xb7; needs an async pytest plugin, and loop and fixture scopes are easy to get wrong","children":[],"payload":{"tag":"li","lines":"1863,1864"}},{"content":"&#x6765;&#x6e90; &#xb7; Source&#xff1a;&#x901a;&#x7528;&#x7406;&#x7531;&#xff0c;&#x4ed3;&#x5e93;&#x91cc;&#x6ca1;&#x6709;&#x8bb0;&#x5f55;&#x4e3a;&#x4ec0;&#x4e48;&#x4e0d;&#x7528;&#x522b;&#x7684; &#xb7; general reasoning; the repo records no reason","children":[],"payload":{"tag":"li","lines":"1864,1865"}}],"payload":{"tag":"li","lines":"1858,1865"}},{"content":"&#x2463; &#x6211;&#x7684;&# #x7528;&#x56de;&#x7b54; &#xb7; General answer","children":[{"content":"&#x9488;&#x5bf9;&#x4f59;&#x5f26;&#x76f8;&#x4f3c;&#x5ea6;&#x641c;&#x7d22;&#x7684;&#x5355;&#x5143;&#x6d4b;&#x8bd5;&#x901a;&#x5e38;&#x4f1a;&#x9a8c;&#x8bc1;&#x6700;&#x8fd1;&#x90bb;&#x51fd;&#x6570;&#x662f;&#x5426;&#x8fd4;&#x56de;&#x9884;&#x671f;&#x7684;&#x5411;&#x91cf;&#xff0c;&#x65b9;&#x6cd5;&#x662f;&#x6bd4;&#x8f83;&#x5df2;&#x77e5;&#x5d4c;&#x5165;&#x4e4b;&#x95f4;&#x7684;&#x4f59;&#x5f26;&#x8ddd;&#x79bb;&#x3002;&#x6d4b;&#x8bd5;&#x4f1a;&#x65ad;&#x8a00;&#x8fd4;&#x56de;&#x7684;&#x7d22;&#x5f15;&#x4e0e;&#x771f;&#x5b9e;&#x503c;&#x4e00;&#x81f4;&#xff0c;&#x5e76;&#x4e14;&#x76f8;&#x4f3c;&#x5ea6;&#x5206;&#x6570;&#x5728;&#x53ef;&#x63a5;&#x53d7;&#x7684;&#x8bef;&#x5dee;&#x8303;&#x56f4;&#x5185;&#x3002;&#x8fd9;&#x6837;&#x53ef;&#x4ee5;&#x53ca;&#x65f6;&#x53d1;&#x73b0;&#x8ddd;&#x79bb;&#x8ba1;&#x7b97;&#x6216;&#x7d22;&#x5f15;&#x903b;&#x8f91;&#x7684;&#x56de;&#x5f52;&#x3002;","children":[],"payload":{"tag":"li","lines":"1878,1879"}},{"content":"Unit tests for cosine similarity search typically verify that the nearest-neighbor function returns the expected vectors by comparing cosine distances between known embeddings. They assert that the returned indices match the ground truth and that the similarity scores fall within an acceptable tolerance. These tests help catch regressions in the distance calculation or indexing logic.","children":[],"payload":{"tag":"li","lines":"1879,1880"}}],"payload":{"tag":"li","lines":"1877,1880"}},{"content":"&#x2461; &#x539f;&#x7406; &#xb7; How it works","children":[{"content":"\n<pre data-lines=\"1881,1894\"><code class=\"language-text\">&#x7528;&#x6b63;&#x4ea4;&#x5355;&#x4f4d;&#x5411;&#x91cf;&#x9020;&#x51fa;&quot;&#x7b54;&#x6848;&#x5df2;&#x77e5;&quot;&#x7684;&#x6570;&#x636e; &#xb7; orthogonal unit vectors give a known answer\n  chunk0 = e0 = [1,0,0,&#x2026;]   start 0\n  chunk1 = e1 = [0,1,0,&#x2026;]   start 10\n  chunk2 = e2 = [0,0,1,&#x2026;]   start 20\n  q = normalize(e1 + 0.2&#xb7;e2) = [ xff1a;&#x4e0d;&#x505a;&#x7248;&#x672c;&#x3001;&#x4e0d;&#x6539;&#x5df2;&#x6709;&#x8868;&#xff0c;&#x4e5f;&#x6ca1;&#x6709;&#x56de;&#x6eda; &#xb7; no versions, no changes to existing tables, no downgrade","children":[],"payload":{"tag":"li","lines":"1973,1974"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x90e8;&#x7f72;&#x591a;&#x4e00;&#x6b65;&#xff1b;&#x8fc1;&#x79fb;&#x5931;&#x8d25;&#x4f1a;&#x6321;&#x4f4f;&#x6574;&#x4e2a;&#x90e8;&#x7f72;&#xff0c;prod &#x8fc1;&#x79fb;&#x8fd8;&#x8981;&#x4eba;&#x5de5;&#x5ba1;&#x6279; &#xb7; an extra deploy step; a failed migration stops the deploy, and prod needs approval","children":[],"payload":{"tag":"li","lines":"1974,1975"}},{"content":"&#x6765;&#x6e90; &#xb7; Source&#xff1a;spec/m6-cloud.md R8&#x3001;intent/m6-cloud.md &#x95ee;&#x9898;&#x63cf;&#x8ff0;&#x3001;CLAUDE.md &#xa7;3&#xff08;&#x4ed3;&#x5e93;&#xff09;&#xff1a;&#x6ca1;&#x6709;&#x4efb;&#x4f55;&#x4e1c;&#x897f;&#x81ea;&#x52a8;&#x8dd1;&#x8fc1;&#x79fb; &#xb7; spec m6-cloud R8, the M6 intent, and repo CLAUDE.md &#xa7;3: nothing runs migrations automatically","children":[],"payload":{"tag":"li","lines":"1975,1976"}}],"payload":{"tag":"li","lines":"1969,1976"}},{"content":"&#x2463; &#x6211;&#x7684;&#x6848;&#x4f8b; &#xb7; My case","children":[{"content":"&#x6211;&#x5728; CLAUDE.md &#x91cc;&#x5199;&#x4e0b;&#x8fc1;&#x79fb;&#x89c4;&#x5219;&#xff1a;schema &#x6539;&#x52a8;&#x53ea;&#x8d70; Alembic&#xff0c;&#x5e76;&#x5217;&#x51fa;&#x5df2;&#x5e94;&#x7528;&#x7684; revision&#xff1b;&#x8fc1;&#x79fb;&#x4e0d;&#x5728;&#x542f;&#x52a8;&#x65f6;&#x81ea;&#x52a8;&#x8fd0;&#x884c;&#xff0c;&#x7531; make migrate&#x3001;CI &#x6216;&#x5355;&#x72ec;&#x7684;&#x8fc1;&#x79fb;&#x4efb;&#x52a1;&#x663e;&#x5f0f;&#x6267;&#x884c;&#xff0c;&#x542f;&#x52a8;&#x53ea;&#x540c;&#x6b65;&#x53c2;&#x8003;&#x6570;&#x636e;&#x3002;","children":[],"payload":{"tag":"li","lines":"1977,1978"}},{"content":"I wrote the migration rules into CLAUDE.md: schema changes go only through Alembic, and the applied revisions are listed. Nothing runs migrations at startup; make migrate, CI or a separate migration task applies them explicitly, and startup only re-syncs reference data.","children":[],"payload":{"tag":"li","lines":"1978,1979"}}],"payload":{"tag":"li","lines":"1976,1979"}},{"content":"&#x2464; &#x4ee3;&#x7801; &#xb7; Code&#xff1a;<code>.github/workflows/ci.yml @ e7ca0af</code> &#xb7; &#x4ee3;&#x7801;&#x5728;&#x79c1;&#x6709;&#x4ed3;&#x5e93;&#xff0c;&#x672c;&#x5730;&#x5bfc;&#x56fe;&#x91cc;&#x770b; &#xb7; private repo, see the local map","children":[],"payload":{"tag":"li","lines":"1979,1980"}},{"content":"&#x2465; &#x8bc1;&#x636e; &#xb7; Evidence&#xff08;2026-09-24&#xff09;","children":[{"content":"&quot;-<strong>[Fact]</strong> 2026-09-22: five revisions (<code>users</code>; <code>rbac and auth tables</code>&quot;","children":[],"payload":{"tag":"li","lines":"1981,1982"}}],"payload":{"tag":"li","lines":"1980,1982"}},{"content":"&#x7ecf;&#x5178;&#x8ffd;&#x95ee; Classic follow-ups&#xff1a;How would you manage database schema migrations? | What commands are used to create and apply migrations in Alembic? | What are the differences between MyISAM and InnoDB?","children":[],"payload":{"tag":"li","lines":"1982,1984"}}],"payload":{"tag":"h4","lines":"1950,1951"}}],"payload":{"tag":"h3","lines":"1948,1949"}},{"content":"&#x5206;&#x5e03;&#x5f0f;&#x7cfb;&#x7edf; &#xb7; Distributed Systems","children":[{"content":"&#x5ba1;&#x8ba1;&#x94fe;&#x951a;&#x5b9a; &#xb7; Audit Chain Anchoring","children":[{"content":"&#x2460; &#x901a;&#x7528;&#x56de;&#x7b54; &#xb7; General answer","children":[{"content":"&#x5728;&#x5206;&#x5e03;&#x5f0f;&#x7cfb;&#x7edf;&#x4e2d;&#xff0c;&#x901a;&#x8fc7;&#x52a0;&#x5bc6;&#x94fe;&#x5f0f;&#x8bb0;&#x5f55;&#x5e76;&#x5c06;&#x94fe;&#x951a;&#x5b9a;&#x5230;&#x6301;&#x4e45;&#x5b58;&#x50a8;&#x6765;&#x5b9e;&#x73b0;&#x9632;&#x7be1;&#x6539;&#x65e5;&#x5fd7;&#x3002;","children":[],"payload":{"tag":"li","lines":"1989,1990"}},{"content":"In distributed systems, tamper-proof logs are achieved by cryptographically chaining entries and anchoring the chain to a durable store.","children":[],"payload":{"tag":"li","lines":"1990,1991"}}],"payload":{"tag":"li","lines":"1988,1991"}},{"content":"&#x2461; &#x539f;&#x7406; &#xb7; How it works","children":[{"content":"\n<pre data-lines=\"1992,2005\"><code class=\"language-text\">&#x54c8;&#x5e0c;&#x94fe; + &#x5916;&#x90e8;&#x4e0d;&#x53ef;&#x6539;&#x5199;&#x7684;&#x951a;&#x70b9; &#xb7; hash chain + immutable external anchor\n  &#x4e8b;&#x4ef6; events: e1 &#x2500;&#x2500;h1&#x2500;&#x2500;&#x25b6; e2 &#x2500;&#x2500;h2&#x2500;&#x2500;&#x25b6; e3 &#x2500;&#x2500;h3 (head)\n               h_n = hash(h_{n-1} &#x2016; e_n)\n  &#x6bcf;&#x5c0f;&#x65f6; hourly (EventBridge): govapi-audit-anchor\n     &#x2502; verify() &#x6574;&#x94fe; whole chain\n     &#x251c;&#x2500; &#x65ad;&#x4e86; broken &#x2500;&#x25b6; &#x4e0d;&#x5199;&#x951a;&#x70b9; nothing anchored, exit 1\n     &#x2514;&#x2500; &#x5b8c;&#x597d; ok &#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x25b6; put {seq, hash, at} &#x2500;&#x25b6; S3 Object Lock (compliance)\n                                             &#x65b0;&#x5bf9;&#x8c61; new object&#xff0c;&#x4fdd;&#x7559;&#x671f;&#x5185;&#x4e0d;&#x53ef;&#x5220;&#x6539;\n  verify --anchor: &#x7b2c; seq &#x884c;&#x4ecd;&#x987b;&#x7b49;&#x4e8e;&#x951a;&#x5b9a;&#x54c8;&#x5e0c; &#xb7; row at seq must still match\n     &#x5220;&#x6389;&#x6700;&#x65b0;&#x51e0;&#x884c;&#x6216;&#x4ece;&#x951a;&#x70b9;&#x524d;&#x91cd;&#x5199; &#x2500;&#x25b6; &#x88ab;&#x53d1;&#x73b0; &#xb7; deleting newest rows is detected\n&#x4e24;&#x6b21;&#x951a;&#x5b9a;&#x4e4b;&#x95f4;&#x53ea;&#x80fd;&#x9760;&#x94fe;&#x672c;&#x8eab; &#xb7; between anchors only the chain protects\n</code></pre>","children":[],"payload":{"tag":"li","lines":"1992,2005"}}],"payload":{"tag":"li","lines":"1991,2005"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;&#x6bcf;&#x5c0f;&#x65f6;&#x4e00;&#x4e2a;&#x5b9a;&#x65f6;&#x4efb;&#x52a1;&#x5148;&#x6821;&#x9a8c;&#x54c8;&#x5e0c;&#x94fe;&#xff0c;&#x518d;&#x628a; {seq, hash, at} &#x4f5c;&#x4e3a;&#x65b0;&#x5bf9;&#x8c61;&#x5199;&#x8fdb;&#x5f00;&#x4e86; Object Lock&#xff08;&#x5408;&#x89c4;&#x6a21;&#x5f0f;&#xff0c;&#x4fdd;&#x7559; 1 &#x5e74;&#xff09;&#x7684; S3 &#x6876; &#xb7; an hourly job verifies the hash chain, then writes {seq, hash, at} to an S3 bucket with Object Lock compliance mode, 1-year retention","children":[],"payload":{"tag":"li","lines":"2006,2007"}},{"content":"&#x4e0d;&#x7528;&#x53ea;&#x9760;&#x5e93;&#x91cc;&#x7684;&#x54c8;&#x5e0c;&#x94fe; &#xb7; Not the in-database chain alone&#xff1a;&#x5220;&#x6389;&#x6700;&#x65b0;&#x51e0;&#x884c;&#x540e;&#x5269;&#x4e0b;&#x7684;&#x94fe;&#x4ecd;&#x7136;&#x81ea;&#x6d3d;&#xff0c;&#x53d1;&#x73b0;&#x4e0d;&#x4e86; &#xb7; deleting the newest rows leaves a self-consistent chain, so truncation goes unnoticed","children":[],"payload":{"tag":"li","lines":"2007,2008"}},{"content":"&#x4e0d;&#x7528;&#x533a;&#x5757;&#x94fe;&#x6216;&#x516c;&#x5171;&#x8d26;&#x672c; &#xb7; Not a blockchain&#xff1a;&#x6210;&#x672c;&#x548c;&#x590d;&#x6742;&#x5ea6;&#x8fdc;&#x8d85;&#x9700;&#x8981;&#xff0c;&#x4e00;&#x4e2a;&#x4e0d;&#x53ef;&#x6539;&#x5199;&#x7684;&#x5916;&#x90e8;&#x5b58;&#x50a8;&#x5c31;&#x591f;&#x4e86; &#xb7; far more cost and complexity than one immutable external store","children":[],"payload":{"tag":"li","lines":"2008,2009"}},{"content":"&#x4e0d;&#x7528; Amazon QLDB &#x4e4b;&#x7c7b;&#x8d26;&#x672c;&#x6570;&#x636e;&#x5e93; &#xb7; Not a ledger database like QLDB&#xff1a;&#x8981;&#x628a;&#x5ba1;&#x8ba1;&#x6570;&#x636e;&#x8fc1;&#x8fc7;&#x53bb;&#xff0c;&#x800c;&#x4e14; QLDB &#x5df2;&#x505c;&#x6b62;&#x670d;&#x52a1; &#xb7; means moving audit data into it, and QLDB has been discontinued","children":[],"payload":{"tag":"li","lines":"2009,2010"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x6700;&#x591a;&#x6709;&#x4e00;&#x5c0f;&#x65f6;&#x7684;&#x7a97;&#x53e3;&#xff1b;&#x4e24;&#x6b21;&#x951a;&#x5b9a;&#x4e4b;&#x95f4;&#x5220;&#x6389;&#x7684;&#x884c;&#x67e5;&#x4e0d;&#x51fa; &#xb7; up to an hour&apos;s window: rows deleted between anchors are not caught","children":[],"payload":{"tag":"li","lines":"2010,2011"}},{"content":"&#x6765;&#x6e90; &#xb7; Source&#xff1a;intent/m6-cloud.md&#xff08;&#x8ba9;&#x5220;&#x9664;&#x6700;&#x65b0;&#x884c;&#x53ef;&#x88ab;&#x53d1;&#x73b0;&#xff09;&#x4e0e; ebba560&#xff1a;&#x94fe;&#x65ad;&#x4e86;&#x5c31;&#x4e0d;&#x951a;&#x5b9a; &#xb7; M6 intent (make deleting the newest rows detectable) and ebba560: a broken chain is not anchored","children":[],"payload":{"tag":"li","lines":"2011,2012"}}],"payload":{"tag":"li","lines":"2005,2012"}},{"content":"&#x2463; &#x6211;&#x7684;&#x6848;&#x4f8b; &#xb7; My case","children":[{"content":"&#x6211;&#x6dfb;&#x52a0;&#x4e86;&#x4e00;&#x4e2a;&#x951a;&#x5b9a;&#x4efb;&#x52a1;&#xff0c;&#x9a8c;&#x8bc1;&#x5ba1;&#x8ba1;&#x94fe;&#x540e;&#x4ec5;&#x5728;&#x94fe;&#x5b8c;&#x6574;&#x65f6;&#x5411; GOVAPI_ANCHOR_BUCKET &#x5199;&#x5165;&#x65b0;&#x5bf9;&#x8c61;&#x3002;","children":[],"payload":{"tag":"li","lines":"2013,2014"}},{"content":"I added an anchor job that verifies the audit chain and writes a new object to GOVAPI_ANCHOR_BUCKET only if the chain is intact.","children":[],"payload":{"tag":"li","lines":"2014,2015"}}],"payload":{"tag":"li","lines":"2012,2015"}},{"content":"&#x2464; &#x4ee3;&#x7801; &#xb7; Code&#xff1a;<code>apps/api/src/govapi/cli.py @ ebba560</code> &#xb7; &#x4ee3;&#x7801;&#x5728;&#x79c1;&#x6709;&#x4ed3;&#x5e93;&#xff0c;&#x672c;&#x5730;&#x5bfc;&#x56fe;&#x91cc;&#x770b; &#xb7; private repo, see the local map","children":[],"payload":{"tag":"li","lines":"2015,2016"}},{"content":"&#x2465; &#x8bc1;&#x636e; &#xb7; Evidence&#xff08;2026-09-24&#xff09;","children":[{"content":"&quot;- The anchor job verifies the chain, then writes {seq, hash, at} as a new object to GOVAPI_ANCHOR_BUCKET&quot;","children":[],"payload":{"tag":"li","lines":"2017,2018"}}],"payload":{"tag":"li","lines":"2016,2018"}},{"content":"&#x9762;&#x8bd5;&#x600e;&#x4e48;&#x95ee; &#xb7; Asked as&#xff1a;&#x5982;&#x4f55;&#x8bbe;&#x8ba1;&#x4e00;&#x4e2a;&#x7cfb;&#x7edf;&#x4ee5;&#x786e;&#x4fdd;&#x5206;&#x5e03;&#x5f0f;&#x670d;&#x52a1;&#x4e2d;&#x7684;&#x5ba1;&#x8ba1;&#x65e5;&#x5fd7;&#x9632;&#x7be1;&#x6539;&#xff1f; &#xb7; How would you design a system to ensure audit logs are tamper-proof across distributed services?","children":[],"payload":{"tag":"li","lines":"2018,2020"}}],"payload":{"tag":"h4","lines":"1986,1987"}}],"payload":{"tag":"h3","lines":"1984,1985"}},{"content":"&#x6d4b;&#x8bd5;&#x7b56;&#x7565; &#xb7; Testing Strategy","children":[{"content":"&#x4f60;&#x5728;&#x5e94;&#x7528;&#x7a0b;&#x5e8f;&#x4e2d;&#x4f7f;&#x7528;&#x54ea;&#x4e9b;&#x7b56;&#x7565;&#x6765;&#x6d4b;&#x8bd5;&#x6587;&#x4ef6;&#x5904;&#x7406;&#x548c;&#x5185;&#x5bb9; sniffing&#xff1f; &#xb7; What strategies do you use to test file handling and content sniffing in your application?","children":[{"content":"&#x2460; &#x901a;&#x7528;&#x56de;&#x7b54; &#xb7; General answer","children":[{"content":"&#x5355;&#x5143;&#x6d4b;&#x8bd5;&#x9a8c;&#x8bc1;&#x5355;&#x4e2a;&#x7ec4;&#x4ef6;&#x7684;&#x72ec;&#x7acb;&#x884c;&#x4e3a;&#xff0c;&#x96c6;&#x6210;&#x6d4b;&#x8bd5;&#x9a8c;&#x8bc1;&#x7ec4;&#x4ef6;&#x4e4b;&#x95f4;&#x7684;&#x4ea4;&#x4e92;&#x3002;Mock &#x7528;&#x4e8e;&#x9694;&#x79bb;&#x5916;&#x90e8;&#x4f9d;&#x8d56;&#xff0c;TDD &#x9f13;&#x52b1;&#x5148;&#x5199;&#x6d4b;&#x8bd5;&#x540e;&#x5b9e;&#x73b0;&#x3002;","children":[],"payload":{"tag":"li","lines":"2025,2026"}},{"content":"Unit tests validate individual components in isolation, while integration tests verify interactions between components. Mocking is used to isolate external dependencies, and Test-Driven Development encourages writing tests before implementation.","children":[],"payload":{"tag":"li","lines":"2026,2027"}}],"payload":{"tag":"li","lines":"2024,2027"}},{"content":"&#x2461; &#x539f;&#x7406; &#xb7; How it works","children":[{"content":"\n<pre data-lines=\"2028,2040\"><code class=\"language-text\">&#x5148;&#x65ad;&#x8a00;&#x5939;&#x5177;&#x662f;&#x771f;&#x7684;&#xff0c;&#x518d;&#x6d4b;&#x51fd;&#x6570; &#xb7; assert the fixture is real, then the code\n  &#x4e4b;&#x524d; before:  io.BytesIO(b&quot;%PDF-1.4\\n&quot;) &#x2500;&#x25b6; &#x6587;&#x4ef6;&#x5934;&#x88ab;&#x8986;&#x76d6; header overwritten\n               pypdf &#x4ecd;&#x8bfb;&#x5f97;&#x5230;&#x6b63;&#x6587; still reads &#x2500;&#x25b6; &#x6d4b;&#x8bd5;&#x901a;&#x8fc7; passes, &#x5939;&#x5177;&#x5047; fake\n  &#x5192;&#x70df;&#x6d4b;&#x8bd5; smoke: &#x540c;&#x6837;&#x7684;&quot;PDF&quot;&#x88ab; sniff &#x5b58;&#x6210; text/plain\n  &#x4e4b;&#x540e; after:\n    _pdf_with_text(&quot;Travel policy&quot;)\n      &#x251c;&#x2500; assert data.startswith(b&quot;%PDF-&quot;)            &#x5939;&#x5177; fixture\n      &#x251c;&#x2500; assert sniff(data[:16], data, name) == &quot;application/pdf&quot;  &#x55c5;&#x63a2; sniff\n      &#x2514;&#x2500; assert &quot;Travel policy&quot; in extract_text(...)  &#x62bd;&#x53d6; extract\n&#x55c5;&#x63a2;&#x770b;&#x5b57;&#x8282;&#x4e0d;&#x770b;&#x6269;&#x5c55;&#x540d;&#xff1b;&#x624b;&#x5199;&#x5939;&#x5177;&#x4e5f;&#x4f1a;&#x9519; &#xb7; hand-made fixtures can lie too\n</code></pre>","children":[],"payload":{"tag":"li","lines":"2028,2040"}}],"payload":{"tag":"li","lines":"2027,2040"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;&#x6d4b;&#x8bd5;&#x81ea;&#x5df1;&#x9020;&#x4e00;&#x4e2a;&#x4ee5; %PDF-1.4 &#x5f00;&#x5934;&#x7684;&#x5b57;&#x8282;&#x6d41;&#xff0c;&#x76f4;&#x63a5;&#x65ad;&#x8a00; sniff &#x8fd4;&#x56de; application/pdf &#xb7; build bytes that start with %PDF-1.4 and assert sniff returns application/pdf","children":[],"payload":{"tag":"li","lines":"2041,2042"}},{"content":"&#x4e0d;&#x7528;&#x53ea;&#x770b;&#x4e0b;&#x6e38;&#x89e3;&#x6790;&#x662f;&#x5426;&#x6210;&#x529f; &#xb7; Not trusting the parser alone&#xff1a;pypdf &#x5934;&#x88ab;&#x8986;&#x76d6;&#x4e86;&#x4e5f;&#x7167;&#x6837;&#x8bfb;&#x51fa;&#x6b63;&#x6587;&#xff0c;&#x628a;&#x95ee;&#x9898;&#x85cf;&#x4f4f;&#x4e86; &#xb7; pypdf still read the body with its header overwritten, which hid the bug","children":[],"payload":{"tag":"li","lines":"2042,2043"}},{"content":"&#x4e0d;&#x7528;&#x4fe1;&#x4efb;&#x5ba2;&#x6237;&#x7aef;&#x7ed9;&#x7684; Content-Type &#x6216;&#x6269;&#x5c55;&#x540d; &#xb7; Not the client&apos;s Content-Type or extension&#xff1a;&#x7528;&#x6237;&#x53ef;&#x63a7;&#xff0c;&#x53ef;&#x4ee5;&#x4f2a;&#x9020; &#xb7; client-controlled and easily spoofed","children":[],"payload":{"tag":"li","lines":"2043,2044"}},{"content":"&#x4e0d;&#x7528;&#x4ed3;&#x5e93;&#x91cc;&#x653e;&#x771f;&#x5b9e; PDF &#x6837;&#x672c; &#xb7; Not real PDF fixtures&#xff1a;&#x4f53;&#x79ef;&#x5927;&#xff0c;&#x53ef;&#x80fd;&#x5e26;&#x654f;&#x611f;&#x5185;&#x5bb9;&#xff0c;&#x4e5f;&#x770b;&#x4e0d;&#x51fa;&#x6d4b;&#x7684;&#x662f;&#x54ea;&#x4e2a;&#x5b57;&#x8282; &#xb7; bulky, may carry real content, and hides which bytes matter","children":[],"payload":{"tag":"li","lines":"2044,2045"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x624b;&#x5199;&#x5b57;&#x8282;&#x53ea;&#x8986;&#x76d6;&#x5934;&#x90e8;&#x5224;&#x65ad;&#xff0c;&#x590d;&#x6742;&#x6216;&#x7578;&#x5f62; PDF &#x8981;&#x53e6;&#x5916;&#x8865;&#x6837;&#x672c; &#xb7; hand-built bytes cover the header check only; malformed PDFs need extra cases","children":[],"payload":{"tag":"li","lines":"2045,2046"}},{"content":"&#x6765;&#x6e90; &#xb7; Source&#xff1a;598e36c&#xff1a;BytesIO &#x4ece; 0 &#x5199;&#x5165;&#x8986;&#x76d6;&#x4e86;&#x5934;&#xff0c;pypdf &#x4ecd;&#x80fd;&#x8bfb;&#x6b63;&#x6587;&#xff0c;&#x6240;&#x4ee5;&#x6d4b;&#x8bd5;&#x540c;&#x65f6;&#x68c0;&#x67e5; sniff &#xb7; 598e36c: the header was overwritten, pypdf hid it, so the test now also checks sniffing","children":[],"payload":{"tag":"li","lines":"2046,2047"}}],"payload":{"tag":"li","lines":"2040,2047"}},{"content":"&#x2463; &#x6211;&#x7684;&#x6848;&#x4f8b; &#xb7; My case","children":[{"content":"&# children":[{"content":"Static analysis tools like tflint and checkov scan Terraform code for syntax errors, best practices, and policy violations before deployment.","children":[],"payload":{"tag":"li","lines":"2058,2059"}}],"payload":{"tag":"li","lines":"2057,2059"}},{"content":"&#x2461; &#x539f;&#x7406; &#xb7; How it works","children":[{"content":"\n<pre data-lines=\"2060,2074\"><code class=\"language-text\">plan &#x4e4b;&#x524d;&#x3001;&#x4e0d;&#x8fde; AWS &#x5c31;&#x62e6;&#x4f4f;&#x8fdd;&#x89c4; &#xb7; catch violations before any plan\n  PR &#x6539;&#x52a8; infra/**\n     &#x2502;\n     &#x25bc; job: static&#xff08;&#x65e0; AWS &#x6743;&#x9650; no AWS access&#xff09;\n  tofu fmt -check &#x2500;&#x25b6; tofu validate &#x2500;&#x25b6; diff dev/prod main.tf &#x2500;&#x25b6; tflint &#x2500;&#x25b6; checkov\n                                                                          &#x2502;\n                                         check-iam-policies.py &#x25c0;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2518;\n     &#x2502; &#x5168;&#x90e8;&#x901a;&#x8fc7; all pass&#xff08;checkov 403 passed, 0 failed&#xff09;\n     &#x25bc; needs: static\n  job: plan-dev&#xff08;OIDC &#x53ea;&#x8bfb;&#x89d2;&#x8272; read-only role&#xff09;&#x2500;&#x25b6; &#x8ba1;&#x5212;&#x8d34;&#x5230; PR &#xb7; plan on the PR\n  &#x6bcf;&#x4e2a; skip &#x90fd;&#x5728;&#x884c;&#x5185;&#x5199;&#x539f;&#x56e0; &#xb7; every skip states its reason inline\n&#x9759;&#x6001;&#x68c0;&#x67e5;&#x770b;&#x4e0d;&#x5230;&#x771f;&#x5b9e;&#x8d26;&#x6237; &#xb7; no live state; each skip needs human review\n</code></pre>","children":[],"payload":{"tag":"li","lines":"2060,2074"}}],"payload":{"tag":"li","lines":"2059,2074"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;infra.yml &#x91cc;&#x5148;&#x8dd1; tofu fmt&#x3001;validate&#x3001;tflint&#xff08;aws &#x89c4;&#x5219;&#x96c6;&#xff09;&#x548c; checkov&#xff0c;&#x5168;&#x90e8;&#x901a;&#x8fc7;&#x624d;&#x51fa; plan&#xff1b;&#x6bcf;&#x4e2a;&#x8df3;&#x8fc7;&#x90fd;&#x5728;&#x884c;&#x5185;&#x5199;&#x7406;&#x7531; &#xb7; infra.yml runs tofu fmt, validate, tflint and checkov before any plan; every skip carries its reason inline","children":[],"payload":{"tag":"li","lines":"2075,2076"}},{"content":"&#x4e0d;&#x7528;&#x53ea;&#x9760; tofu plan &#xb7; Not plan alone&#xff1a;plan &#x53ea;&#x8bc1;&#x660e;&#x80fd;&#x8dd1;&#xff0c;&#x4e0d;&#x67e5;&#x516c;&#x5f00;&#x6876;&#x3001;&#x672a;&#x52a0;&#x5bc6;&#x8fd9;&#x7c7b;&#x7b56;&#x7565;&#x95ee;&#x9898; &#xb7; plan proves it runs, not that buckets are private or storage encrypted","children":[],"payload":{"tag":"li","lines":"2076,2077"}},{"content":"&#x4e0d;&#x7528; tfsec &#xb7; Not tfsec&#xff1a;&#x5df2;&#x5e76;&#x5165; Trivy&#xff0c;checkov &#x89c4;&#x5219;&#x66f4;&#x5168;&#xff0c;&#x4e5f;&#x80fd;&#x51fa; SARIF &#xb7; merged into Trivy; checkov covers more policies","children":[],"payload":{"tag":"li","lines":"2077,2078"}},{"content":"&#x4e0d;&#x7528; OPA / Sentinel &#x81ea;&#x5199;&#x7b56;&#x7565; &#xb7; Not OPA or Sentinel&#xff1a;&#x8981;&#x81ea;&#x5df1;&#x5199;&#x548c;&#x7ef4;&#x62a4;&#x89c4;&#x5219;&#xff0c;&#x4e00;&#x4eba;&#x9879;&#x76ee;&#x5148;&#x7528;&#x73b0;&#x6210;&#x89c4;&#x5219;&#x96c6; &#xb7; custom policies to write and maintain; off-the-shelf rules first","children":[],"payload":{"tag":"li","lines":"2078,2079"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x8bef;&#x62a5;&#x8981;&#x9010;&#x6761;&#x52a0;&#x8df3;&#x8fc7;&#x6ce8;&#x91ca;&#xff1b;&#x9759;&#x6001;&#x626b;&#x63cf;&#x770b;&#x4e0d;&#x5230;&#x8fd0;&#x884c;&#x65f6;&#x5b9e;&#x9645;&#x6743;&#x9650; &#xb7; false positives need inline skips, and static scans cannot see runtime permissions","children":[],"payload":{"tag":"li","lines":"2079,2080"}},{"content":"&#x6765;&#x6e90; &#xb7; Source&#xff1a;&#x901a;&#x7528;&#x7406;&#x7531;&#xff0c;&#x4ed3;&#x5e93;&#x91cc;&#x6ca1;&#x6709;&#x8bb0;&#x5f55;&#x4e3a;&#x4ec0;&#x4e48;&#x4e0d;&#x7528;&#x522b;&#x7684; &#xb7; general reasoning; the repo records no reason","children":[],"payload":{"tag":"li","lines":"2080,2081"}}],"payload":{"tag":"li","lines":"2074,2081"}},{"content":"&#x2463; &#x6211;&#x7684;&#x6848;&#x4f8b; &#xb7; My case","children":[{"content":"I ran tflint and checkov as part of the infra.yml workflow, ensuring 403 checks passed and no failures before any plan was applied.","children":[],"payload":{"tag":"li","lines":"2082,2083"}}],"payload":{"tag":"li","lines":"2081,2083"}},{"content":"&#x2464; &#x4ee3;&#x7801; &#xb7; Code&#xff1a;<code>.github/workflows/infra.yml @ 99929d4</code> &#xb7; &#x4ee3;&#x7801;&#x5728;&#x79c1;&#x6709;&#x4ed3;&#x5e93;&#xff0c;&#x672c;&#x5730;&#x5bfc;&#x56fe;&#x91cc;&#x770b; &#xb7; private repo, see the local map","children":[],"payload":{"tag":"li","lines":"2083,2084"}},{"content":"&#x2465; &#x8bc1;&#x636e; &#xb7; Evidence&#xff08;2026-09-24&#xff09;","children":[{"content":"&quot;tofu validate, tflint (aws ruleset 0.49.0) and checkov 3.3.19 pass: 403 passed, 0 failed; each skip carries its reason inline.&quot;","children":[],"payload":{"tag":"li","lines":"2085,2087"}}],"payload":{"tag":"li","lines":"2084,2087"}}],"payload":{"tag":"h4","lines":"2055,2056"}},{"content":"&#x7aef;&#x5230;&#x7aef; UI &#x5e03;&#x5c40;&#x6d4b;&#x8bd5; &#xb7; End-to-End UI Layout Testing","children":[{"content":"&#x2460; &#x901a;&#x7528;&#x56de;&#x7b54; &#xb7; General answer","children":[{"content":"&#x7aef;&#x5230;&#x7aef; UI &#x5e03;&#x5c40;&#x6d4b;&#x8bd5;&#x9a8c;&#x8bc1;&#x7528;&#x6237;&#x754c;&#x9762;&#x5728;&#x4e0d;&#x540c;&#x6d4f;&#x89c8;&#x5668;&#x548c;&#x8bbe;&#x5907;&#x4e0a;&#x7684;&#x6e32;&#x67d3;&#x662f;&#x5426;&#x6b63;&#x786e;&#x3002;&#x4f7f;&#x7528; Playwright &#x6216; Puppeteer &#x7b49;&#x5de5;&#x5177;&#xff0c;&#x4f60;&#x53ef;&#x4ee5;&#x81ea;&#x52a8;&#x5316;&#x6d4f;&#x89c8;&#x5668;&#x4ea4;&#x4e92;&#xff0c;&#x6355;&#x83b7;&#x622a;&#x56fe;&#x5e76;&#x6bd4;&#x8f83;&#x5e03;&#x5c40;&#x6307;&#x68 ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x6a21;&#x5757;&#x63a5;&#x53e3;&#x4e00;&#x6539;&#xff0c;&#x6240;&#x6709;&#x73af;&#x5883;&#x90fd;&#x8981;&#x8ddf;&#x7740;&#x6539; &#xb7; changing a module interface ripples through every environment","children":[],"payload":{"tag":"li","lines":"2181,2182"}},{"content":"&#x6765;&#x6e90; &#xb7; Source&#xff1a;&#x901a;&#x7528;&#x7406;&#x7531;&#xff0c;&#x4ed3;&#x5e93;&#x91cc;&#x6ca1;&#x6709;&#x8bb0;&#x5f55;&#x4e3a;&#x4ec0;&#x4e48;&#x4e0d;&#x7528;&#x522b;&#x7684; &#xb7; general reasoning; the repo records no reason","children":[],"payload":{"tag":"li","lines":"2182,2183"}}],"payload":{"tag":"li","lines":"2176,2183"}},{"content":"&#x2463; &#x6211;&#x7684;&#x6848;&#x4f8b; &#xb7; My case&#xff1a;&#x6ca1;&#x6709;&#x53ef;&#x9a8c;&#x8bc1;&#x7684;&#x6848;&#x4f8b; &#xb7; no verified case","children":[],"payload":{"tag":"li","lines":"2183,2185"}}],"payload":{"tag":"h4","lines":"2158,2159"}},{"content":"GitHub Actions Workflow Design","children":[{"content":"&#x2460; &#x901a;&#x7528;&#x56de;&#x7b54; &#xb7; General answer","children":[{"content":"A well-structured GitHub Actions workflow separates concerns into reusable jobs, uses caching, and enforces approvals for protected branches.","children":[],"payload":{"tag":"li","lines":"2188,2189"}}],"payload":{"tag":"li","lines":"2187,2189"}},{"content":"&#x2461; &#x539f;&#x7406; &#xb7; How it works","children":[{"content":"\n<pre data-lines=\"2190,2204\"><code class=\"language-text\">&#x6309;&#x804c;&#x8d23;&#x62c6;&#x5206;&#xff0c;&#x5171;&#x7528;&#x4e00;&#x4e2a;&#x90e8;&#x7f72;&#x6d41;&#x7a0b; &#xb7; split by duty, share one reusable deploy\n  PR &#x2500;&#x2500;&#x25b6; ci.yml&#xff08;lint, test&#xff09;    PR infra/** &#x2500;&#x2500;&#x25b6; infra.yml&#xff08;static &#x2192; plan-dev&#xff09;\n                &#x2502; main &#x4e0a;&#x6210;&#x529f; green on main\n                &#x25bc; workflow_run\n         deploy-dev.yml: build &#x2192; SBOM &#x2192; cosign sign &#x2192; attest &#x2500;&#x2510;\n                                                              &#x25bc;\n  &#x624b;&#x52a8; manual &#x2500;&#x25b6; deploy-prod.yml &#x2500;(same digests)&#x2500;&#x25b6; _deploy.yml (workflow_call)\n     SHA &#x987b;&#x5728; main on main              1 &#x9a8c;&#x7b7e;&#x548c;&#x6765;&#x6e90; verify sig + provenance\n     prod &#x9700;&#x8d1f;&#x8d23;&#x4eba;&#x6279;&#x51c6; owner approval   2 &#x6309; digest &#x6ce8;&#x518c; register by digest\n                                        3 &#x8fc1;&#x79fb;&#x4efb;&#x52a1;&#x5e76;&#x7b49;&#x5f85; migrate, wait\n                                        4 &#x6eda;&#x52a8;&#x5e76;&#x7b49;&#x7a33;&#x5b9a; roll, services-stable\nwith: &#x91cc;&#x4e0d;&#x80fd;&#x7528; env&#xff0c;&#x8868;&#x8fbe;&#x5f0f;&#x8981;&#x91cd;&#x590d; &#xb7; env is unavailable in with:\n</code></pre>","children":[],"payload":{"tag":"li","lines":"2190,2204"}}],"payload":{"tag":"li","lines":"2189,2204"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;infra.yml &#x5728; PR &#x4e0a;&#x67e5; IaC &#x548c;&#x51fa; plan&#xff1b;deploy-dev &#x5728; main &#x7684; CI &#x901a;&#x8fc7;&#x540e;&#x6784;&#x5efa;&#x3001;&#x7b7e;&#x540d;&#x3001;&#x90e8;&#x7f72;&#xff1b;deploy-prod &#x624b;&#x52a8;&#x52a0;&#x5ba1;&#x6279;&#xff1b;&#x5171;&#x7528; _deploy.yml &#xb7; infra.yml checks and plans on PR; deploy-dev builds, signs and deploys after green CI; deploy-prod is manual and approved; both use _deploy.yml","children":[],"payload":{"tag":"li","lines":"2205,2206"}},{"content":"&#x4e0d;&#x7528;&#x4e00;&#x4e2a;&#x5927;&#x5de5;&#x4f5c;&#x6d41;&#x5305;&#x63fd;&#x4e00;&#x5207; &#xb7; Not one workflow for everything&#xff1a;&#x6743;&#x9650;&#x53ea;&#x80fd;&#x53d6;&#x6700;&#x5927;&#x7684;&#x90a3;&#x4e2a;&#xff0c;prod &#x5ba1;&#x6279;&#x4e5f;&#x4e0d;&#x597d;&#x5355;&#x72ec;&#x52a0; &#xb7; permissions widen to the largest job, and prod approval is hard to isolate","children":[],"payload":{"tag":"li","lines":"2206,2207"}},{"content":"&#x4e0d;&#x7528;&#x6bcf;&#x6b21; push &#x5230; main &#x5c31;&#x76f4;&#x63a5;&#x90e8;&#x7f72; &#xb7; Not deploying every push&#xff1a;&#x53c2;&#x8003;&#x5b9e;&#x73b0;&#x4e0d;&#x8dd1;&#x6d4b;&#x8bd5;&#x5c31;&#x90e8;&#x7f72;&#xff0c;&#x8fd8;&#x7528;&#x7ba1;&#x7406;&#x5458;&#x89d2;&#x8272; &#xb7; the reference implementation deployed every push without tests, using an admin role","children":[],"payload":{"tag":"li","lines":"2207,2208"}},{"content":"&#x4e0d;&#x7528; prod &#x91cd;&#x65b0;&#x6784;&#x5efa;&#x955c;&#x50cf; &#xb7; Not rebuilding for prod&#xff1a;prod &#x76f4;&#x63a5;&#x7528; dev &#x5df2;&#x7b7e;&#x540d;&#x7684;&#x540c;&#x4e00;&#x6458;&#x8981;&#xff0c;&#x9a8c;&#x8bc1;&#x8fc7;&#x7684;&#x5c31;&#x662f;&#x4e0a;&#x7ebf;&#x7684; &#xb7; prod promotes dev&apos;s signed digests, so what was verified is what ships","children":[],"payload":{"tag":"li","lines":"2208,2209"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x51e0;&#x4e2a;&#x5de5;&#x4f5c;&#x6d41;&#x4e4b;&#x95f4;&#x9760; workflow_run &#x548c;&#x53ef;&#x590d;&#x7528;&#x5de5;&#x4f5c;&#x6d41;&#x4e32;&#x8d77;&#x6765;&#xff0c;&#x6392;&#x67e5;&#x94fe;&#x8def;&#x66f4;&#x957f; &#xb7; workflows chained by workflow_run and a reusable workflow are harder to trace","children":[],"payload":{"tag":"li","lines":"2209,2210"}},{"content":"&#x6765;&#x6e90; &#xb7; Source&#xff1a;intent/m6-cloud.md &#x95ee;&#x9898;&#x63cf;&#x8ff0;&#x3001;spec/m6-cloud.md R11&#x2013;R12&#x3001;99929d4 &#xb7; M6 intent problem statement, spec m6-cloud R11&#x2013;R12, 99929d4","children":[],"payload":{"tag":"li","lines":"2210,2211"}}],"payload":{"tag":"li","lines":"2204,2211"}},{"content":"&#x2463; &#x6211;&#x7684;&#x6848;&#x4f8b; &#xb7; My case","children":[{"content":"I created separate workflows for infra validation, dev deployment, and prod promotion, using a shared _deploy.yml that verifies signatures and performs rollouts.","children":[],"payload":{"tag":"li","lines":"2212,2213"}}],"payload":{"tag":"li","lines":"2211,2213"}},{"content":"&#x2464; &#x4ee3;&#x7801; &#xb7; Code&#xff1a;<code>.github/workflows/deploy-prod.yml @ 99929d4</code> &#xb7; &#x4ee3;&#x7801;&#x5728;&#x79c1;&#x6709;&#x4ed3;&#x5e93;&#xff0c;&#x672c;&#x5730;&#x5bfc;&#x56fe;&#x91cc;&#x770b; &#xb7; private repo, see the local map","children":[],"payload":{"tag":"li","lines":"2213,2214"}},{"content":"&#x2465; &#x8bc1;&#x636e; &#xb7; Evidence&#xff08;2026-09-24&#xff09;","children":[{"content":"&quot;infra.yml: fmt, validate, tflint, checkov, IAM check; dev plan through the read-only role, attached to the PR once the role exists.&quot;","children":[],"payload":{"tag":"li","lines":"2215,2216"}}],"payload":{"tag":"li","lines":"2214,2216"}},{"content":"&#x9762;&#x8bd5;&#x600e;&#x4e48;&#x95ee; &#xb7; Asked as&#xff1a;How would you design a GitHub Actions workflow to automate infrastructure validation and deployment?","children":[],"payload":{"tag":"li","lines":"2216,2218"}}],"payload":{"tag":"h4","lines":"2185,2186"}},{"content":"Q: How would you structure Terraform modules to promote reuse and maintainability?","children":[{"content":"&#x2460; &#x901a;&#x7528;&#x56de;&#x7b54; &#xb7; General answer","children":[{"content":"Use modules to encapsulate reusable infrastructure patterns, parameterize with variables, and expose outputs for composition.","children":[],"payload":{"tag":"li","lines":"2221,2222"}}],"payload":{"tag":"li","lines":"2220,2222"}},{"content":"&#x2461; &#x539f;&#x7406; &#xb7; How it works","children":[{"content":"\n<pre data-lines=\"2223,2237\"><code class=\"language-text\">&#x4e00;&#x4efd;&#x6839;&#x914d;&#x7f6e;&#x3001;&#x591a;&#x4efd; tfvars &#xb7; one root config; differences live in tfvars\n  &#x250c;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500; &#x5171;&#x4eab; shared: envs/*/main.tf&#xff08;&#x9010;&#x5b57;&#x76f8;&#x540c; identical&#xff09;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2510;\n  &#x2502; module &quot;data&quot;    { source = &quot;../../modules/data&quot;    &#x2026; }                  &#x2502;\n  &#x2502; module &quot;compute&quot; { source = &quot;../../modules/compute&quot;                      &#x2502;\n  &#x2502;                    secret_arns = module.data.secret_arns }              &#x2502;\n  &#x2514;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2518;\n           &#x25b2; &#x53d8;&#x91cf; variables&#xff08;&#x6709;&#x9ed8;&#x8ba4;&#x503c; defaults, &#x5e26;&#x8bf4;&#x660e; descriptions&#xff09;\n  dev.tfvars: private_tasks=false, deletion_protection=false\n  prod.tfvars: private_tasks=true,  deletion_protection=true\n  &#x6a21;&#x5757;&#x4e4b;&#x95f4;&#x53ea;&#x7ecf; outputs &#x76f8;&#x8fde; &#xb7; modules talk only through outputs\n  &#x72b6;&#x6001;&#x6309;&#x73af;&#x5883;&#x5206;&#x5f00; separate state per env&#xff08;backend.tf&#xff09;\n&#x5171;&#x4eab; main.tf &#x53ef;&#x67e5;&#x6f02;&#x79fb;&#xff1b;&#x72ec;&#x6709;&#x8d44;&#x6e90;&#x8981;&#x9760;&#x5f00;&#x5173; &#xb7; env-only resources need flags\n</code></pre>","children":[],"payload":{"tag":"li","lines":"2223,2237"}}],"payload":{"tag":"li","lines":"2222,2237"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;modules/ &#x653e;&#x6309;&#x804c;&#x8d23;&#x62c6;&#x5206;&#x7684;&#x6a21;&#x5
