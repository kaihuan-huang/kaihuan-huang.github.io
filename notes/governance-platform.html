g":"li","lines":"2252,2268"}}],"payload":{"tag":"li","lines":"2251,2268"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;GitHub Actions &#x7684; YAML &#x5de5;&#x4f5c;&#x6d41;&#xff0c;&#x6309;&#x4e8b;&#x4ef6;&#x89e6;&#x53d1;&#xff0c;jobs &#x9ed8;&#x8ba4;&#x5e76;&#x884c;&#xff0c;&#x7528; needs &#x6392;&#x987a;&#x5e8f; &#xb7; GitHub Actions YAML workflows triggered by events, jobs parallel by default and ordered with needs","children":[],"payload":{"tag":"li","lines":"2269,2270"}},{"content":"&#x4e0d;&#x7528; Jenkins &#xb7; Not Jenkins&#xff1a;&#x8981;&#x81ea;&#x5df1;&#x8fd0;&#x7ef4;&#x670d;&#x52a1;&#x5668;&#x548c;&#x63d2;&#x4ef6;&#xff0c;&#x8fd8;&#x8981;&#x53e6;&#x5916;&#x7ba1;&#x51ed;&#x636e; &#xb7; a server and plugins to run, with its own credential store","children":[],"payload":{"tag":"li","lines":"2270,2271"}},{"content":"&#x4e0d;&#x7528; GitLab CI &#x6216; CircleCI &#xb7; Not GitLab CI or CircleCI&#xff1a;&#x4ee3;&#x7801;&#x5728; GitHub &#x4e0a;&#xff0c;&#x539f;&#x751f;&#x96c6;&#x6210;&#x3001;OIDC &#x548c;&#x73af;&#x5883;&#x5ba1;&#x6279;&#x66f4;&#x987a; &#xb7; the code lives on GitHub, whose OIDC and environment approvals integrate natively","children":[],"payload":{"tag":"li","lines":"2271,2272"}},{"content":"&#x4e0d;&#x7528;&#x672c;&#x5730;&#x811a;&#x672c;&#x624b;&#x52a8;&#x90e8;&#x7f72; &#xb7; Not local deploy scripts&#xff1a;&#x4e0d;&#x53ef;&#x5ba1;&#x8ba1;&#xff0c;&#x4e5f;&#x6321;&#x4e0d;&#x4f4f;&#x6ca1;&#x8fc7;&#x6d4b;&#x8bd5;&#x7684;&#x4ee3;&#x7801; &#xb7; unaudited, and nothing stops untested code","children":[],"payload":{"tag":"li","lines":"2272,2273"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x7ed1;&#x5b9a; GitHub&#xff1b;YAML &#x91cc;&#x7684;&#x6761;&#x4ef6;&#x548c;&#x8868;&#x8fbe;&#x5f0f;&#x5199;&#x9519;&#x4e86;&#x53ea;&#x80fd;&#x63a8;&#x4e0a;&#x53bb;&#x624d;&#x53d1;&#x73b0; &#xb7; tied to GitHub, and YAML expression mistakes surface only after a push","children":[],"payload":{"tag":"li","lines":"2273,2274"}},{"content":"&#x6765;&#x6e90; &#xb7; Source&#xff1a;&#x901a;&#x7528;&#x7406;&#x7531;&#xff0c;&#x4ed3;&#x5e93;&#x91cc;&#x6ca1;&#x6709;&#x8bb0;&#x5f55;&#x4e3a;&#x4ec0;&#x4e48;&#x4e0d;&#x7528;&#x522b;&#x7684; &#xb7; general reasoning; the repo records no reason","children":[],"payload":{"tag":"li","lines":"2274,2275"}}],"payload":{"tag":"li","lines":"2268,2275"}},{"content":"&#x2463; &#x6211;&#x7684;&#x6848;&#x4f8b; &#xb7; My case&#xff1a;&#x6ca1;&#x6709;&#x53ef;&#x9a8c;&#x8bc1;&#x7684;&#x6848;&#x4f8b; &#xb7; no verified case","children":[],"payload":{"tag":"li","lines":"2275,2276"}},{"content":"&#x7ecf;&#x5178;&#x8ffd;&#x95ee; Classic follow-ups&#xff1a;How to create dependencies between jobs so one job runs after another? | True or False? In Github Actions, jobs are executed in parallel by default","children":[],"payload":{"tag":"li","lines":"2276,2278"}}],"payload":{"tag":"h4","lines":"2246,2247"}},{"content":"Q: &#x5728; GitHub Actions &#x4e2d;&#xff0c;workflow_dispatch &#x662f;&#x4ec0;&#x4e48;&#xff1f;&#x4f55;&#x65f6;&#x4f7f;&#x7528;&#x5b83;&#xff1f; &#xb7; What is workflow_dispatch in GitHub Actions and when would you use it?","children":[{"content":"&#x2460; &#x901a;&#x7528;&#x56de;&#x7b54; &#xb7; General answer","children":[{"content":"<code>workflow_dispatch</code> &#x662f; GitHub Actions &#x7684;&#x4e00;&#x79cd;&#x4e8b;&#x4ef6;&#xff0c;&#x5141;&#x8bb8;&#x901a;&#x8fc7; GitHub UI &#x6216; API &#x624b;&#x52a8;&#x89e6;&#x53d1;&#x5de5;&#x4f5c;&#x6d41;&#x3002;&#x5b83;&#x5728;&#x9700;&#x8981;&#x6309;&#x9700;&#x8fd0;&#x884c;&#x90e8;&#x7f72;&#x6216;&#x5176;&#x4ed6;&#x4efb;&#x52a1;&#x65f6;&#x975e;&#x5e38;&#x6709;&#x7528;&#xff0c;&#x800c;&#x4e0d;&#x662f;&#x5728;&#x63a8;&#x9001;&#x6216; PR &#x65f6;&#x81ea;&#x52a8;&#x89e6;&#x53d1;&#x3002;&#x53ef;&#x4ee5;&#x5728;&#x5de5;&#x4f5c;&#x6d41;&#x6587;&#x4ef6;&#x7684; <code>on:</code> &#x952e;&#x4e0b;&#x8fdb;&#x884c;&#x914d;&#x7f6e;&#x3002;","children":[],"payload":{"tag":"li","lines":"2281,2282"}},{"content":"The <code>workflow_dispatch</code> event in GitHub Actions lets you trigger a workflow manually through the GitHub UI or API. It is useful when you need to run a deployment or other job on demand rather than automatically on a push or pull request. The event is configured in the workflow file under the <code>on:</code> key.","children":[],"payload":{"tag":"li","lines":"2282,2283"}}],"payload":{"tag":"li","lines":"2280,2283"}},{"content":"&#x2461; &#x539f;&#x7406; &#xb7; How it works","children":[{"content":"\n<pre data-lines=\"2284,2299\"><code class=\"language-text\">workflow_dispatch&#xff1a;&#x624b;&#x52a8;&#x89e6;&#x53d1;&#xff0c;&#x53ef;&#x5e26;&#x8f93;&#x5165; &#xb7; manual trigger with typed inputs\n  &#x81ea;&#x52a8; automatic                          &#x624b;&#x52a8; manual\n  push / PR / workflow_run                GitHub UI &quot;Run workflow&quot; &#x6216; API\n        &#x2502;                                        &#x2502; inputs: sha (required)\n        &#x25bc;                                        &#x25bc;\n  &#x6bcf;&#x6b21;&#x4e8b;&#x4ef6;&#x90fd;&#x8dd1; every event                &#x53ea;&#x5728;&#x6709;&#x4eba;&#x51b3;&#x5b9a;&#x65f6;&#x8dd1; when someone decides\n        &#x2502;                                        &#x2502;\n        &#x25bc;                                        &#x25bc;\n  &#x9002;&#x5408; fits: test, build                  &#x9002;&#x5408; fits: &#x751f;&#x4ea7;&#x53d1;&#x5e03;&#x3001;&#x91cd;&#x65b0;&#x90e8;&#x7f72;&#x3001;&#x4e00;&#x6b21;&#x6027;\n                                          prod release, redeploy, one-off jobs\n  &#x914d;&#x5408; with: environment &#x4fdd;&#x62a4;&#x89c4;&#x5219; protection rules &#x2500;&#x25b6; &#x5ba1;&#x6279;&#x4eba; required reviewer\n  &#x9650;&#x5236;&#x5206;&#x652f; restrict branch: github.ref == &apos;refs/heads/main&apos;\n&#x624b;&#x52a8;&#x89e6;&#x53d1;&#x672c;&#x8eab;&#x4e0d;&#x8bbe;&#x95e8;&#x69db;&#xff1b;&#x5fc5;&#x987b;&#x914d;&#x73af;&#x5883;&#x5ba1;&#x6279;&#x548c;&#x5206;&#x652f;&#x68c0;&#x67e5; &#xb7; on its own it gates nothing\n</code></pre>","children":[],"payload":{"tag":"li","lines":"2284,2299"}}],"payload":{"tag":"li","lines":"2283,2299"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;&#x5728; on: &#x4e0b;&#x52a0; workflow_dispatch&#xff0c;&#x5141;&#x8bb8;&#x4ece;&#x754c;&#x9762;&#x6216; API &#x624b;&#x52a8;&#x89e6;&#x53d1;&#xff0c;&#x6bd4;&#x5982;&#x9996;&#x6b21;&#x90e8;&#x7f72;&#x6216; prod &#x53d1;&#x5e03; &#xb7; add workflow_dispatch under on: for manual runs from the UI or API, e.g. a first deploy or a prod release","children":[],"payload":{"tag":"li","lines":"2300,2301"}},{"content":"&#x4e0d;&#x7528;&#x63a8;&#x4e00;&#x4e2a;&#x7a7a;&#x63d0;&#x4ea4;&#x6765;&#x89e6;&#x53d1; &#xb7; Not an empty commit&#xff1a;&#x6c61;&#x67d3;&#x5386;&#x53f2;&#xff0c;&#x8fd8;&#x4f1a;&#x987a;&#x5e26;&#x89e6;&#x53d1;&#x522b;&#x7684;&#x5de5;&#x4f5c;&#x6d41; &#xb7; pollutes history and triggers other workflows too","children":[],"payload":{"tag":"li","lines":"2301,2302"}},{"content":"&#x4e0d;&#x7528; repository_dispatch &#xb7; Not repository_dispatch&#xff1a;&#x8981;&#x5916;&#x90e8;&#x8c03; API &#x5e26; token&#xff0c;&#x754c;&#x9762;&#x4e0a;&#x6ca1;&#x6709;&#x6309;&#x94ae; &#xb7; needs an external API call with a token and has no UI button","children":[],"payload":{"tag":"li","lines":"2302,2303"}},{"content":"&#x4e0d;&#x7528;&#x5b9a;&#x65f6; schedule &#xb7; Not a schedule&#xff1a;&#x53d1;&#x5e03;&#x65f6;&#x95f4;&#x5e94;&#x7531;&#x4eba;&#x51b3;&#x5b9a;&#xff0c;&#x4e0d;&#x8be5;&#x6309;&#x949f;&#x70b9;&#x8dd1; &#xb7; releases should happen when a person decides, not on a clock","children":[],"payload":{"tag":"li","lines":"2303,2304"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x8c01;&#x90fd;&#x80fd;&#x70b9;&#x7684;&#x8bdd;&#x5c31;&#x662f;&#x540e;&#x95e8;&#xff0c;&#x8981;&#x9650;&#x5236;&#x -build-provenance&#xff08;&#x8c01;&#x3001;&#x4ece;&#x54ea;&#x4e2a; commit &#x6784;&#x5efa; who, which commit&#xff09;\n     &#x2514;&#x2500;&#x25b6; attest-sbom\n     &#x2502;\n     &#x25bc; _deploy.yml\n  cosign verify --certificate-identity + gh attestation verify &#x2500;&#x25b6; &#x5931;&#x8d25;&#x5373;&#x505c;\n  prod &#x590d;&#x5236;&#x540c;&#x4e00; digest&#xff0c;&#x4ece;&#x4e0d;&#x91cd;&#x5efa; &#xb7; prod copies the same digest, never rebuilds\n&#x7b7e;&#x540d;&#x8bc1;&#x660e;&#x6765;&#x6e90;&#xff0c;&#x4e0d;&#x8bc1;&#x660e;&#x6ca1;&#x6f0f;&#x6d1e; &#xb7; provenance is not a vulnerability scan\n</code></pre>","children":[],"payload":{"tag":"li","lines":"2421,2436"}}],"payload":{"tag":"li","lines":"2420,2436"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;&#x6bcf;&#x4e2a;&#x63d0;&#x4ea4;&#x53ea;&#x6784;&#x5efa;&#x4e00;&#x6b21; arm64 &#x955c;&#x50cf;&#xff0c;&#x7528; syft &#x51fa; SBOM&#x3001;cosign &#x65e0;&#x5bc6;&#x94a5;&#x7b7e;&#x540d;&#x3001;attest-build-provenance &#x51fa;&#x6765;&#x6e90;&#x8bc1;&#x660e;&#xff0c;&#x90e8;&#x7f72;&#x524d;&#x5148;&#x9a8c;&#x8bc1; &#xb7; build arm64 images once per commit with a syft SBOM, keyless cosign signing and build provenance, verified before deploy","children":[],"payload":{"tag":"li","lines":"2437,2438"}},{"content":"&#x4e0d;&#x7528;&#x6709;&#x5bc6;&#x94a5;&#x7684; cosign &#x7b7e;&#x540d; &#xb7; Not key-based cosign&#xff1a;&#x79c1;&#x94a5;&#x8981;&#x957f;&#x671f;&#x4fdd;&#x5b58;&#x548c;&#x8f6e;&#x6362;&#xff0c;&#x8fdd;&#x80cc; CI &#x4e0d;&#x7559;&#x957f;&#x671f;&#x5bc6;&#x94a5; &#xb7; a long-lived private key to store and rotate, against no long-lived CI secrets","children":[],"payload":{"tag":"li","lines":"2438,2439"}},{"content":"&#x4e0d;&#x7528; Docker Content Trust&#xff08;Notary v1&#xff09;&#xb7; Not Docker Content Trust&#xff1a;&#x751f;&#x6001;&#x57fa;&#x672c;&#x505c;&#x6ede;&#xff0c;ECR &#x548c; GitHub & payload":{"tag":"li","lines":"2490,2491"}}],"payload":{"tag":"li","lines":"2488,2491"}},{"content":"&#x2461; &#x539f;&#x7406; &#xb7; How it works","children":[{"content":"\n<pre data-lines=\"2492,2505\"><code class=\"language-text\">&#x56fa;&#x5b9a;&#x7248;&#x672c;&#x4ee4;&#x724c;&#x8ba9;&#x9996;&#x6b21;&#x5199;&#x5165;&#x53ea;&#x6210;&#x529f;&#x4e00;&#x6b21; &#xb7; a fixed token makes the first put unique\n  IaC &#x5efa;&#x7a7a; secret&#xff08;&#x65e0;&#x503c; no value&#xff09;\n  &#x4efb;&#x52a1; A task A                         &#x4efb;&#x52a1; B task B&#xff08;&#x540c;&#x65f6;&#x542f;&#x52a8; same time&#xff09;\n  get &#x2192; NotFound                        get &#x2192; NotFound\n  KMS &#x751f;&#x6210; generate blobA               KMS &#x751f;&#x6210; generate blobB\n  put(blobA, token=FIRST) &#x2713; &#x6210;&#x529f; wins\n                                        put(blobB, token=FIRST) &#x2717; ResourceExists\n                                        get &#x2192; blobA &#x25c0; &#x7528; A &#x7684; key uses A&apos;s\n  &#x7ed3;&#x679c; result: &#x4e24;&#x4e2a;&#x4efb;&#x52a1;&#x7684; keyed_hash &#x76f8;&#x540c; &#xb7; both tasks hash identically\n  &#x4e4b;&#x524d; before: &#x65e0;&#x4ee4;&#x724c; no token &#x2500;&#x25b6; B &#x8986;&#x76d6; A&#xff0c;&#x5df2;&#x7b97;&#x51fa;&#x7684;&#x54c8;&#x5e0c;&#x5168;&#x90e8;&#x5931;&#x6548; &#xb7; B overwrote A\n&#x53ea;&#x9632;&#x9996;&#x6b21;&#x5199;&#x5165;&#x7ade;&#x4e89; &#xb7; later key rotation needs its own versioning\n</code></pre>","children":[],"payload":{"tag":"li","lines":"2492,2505"}}],"payload":{"tag":"li","lines":"2491,2505"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;IaC &#x5148;&#x5efa;&#x7a7a;&#x5bc6;&#x94a5;&#xff0c;&#x4efb;&#x52a1;&#x7528; PutSecretValue &#x52a0;&#x56fa;&#x5b9a; ClientRequestToken &#x586b;&#x503c;&#xff0c;&#x540c;&#x65f6;&#x542f;&#x52a8;&#x7684;&#x7b2c;&#x4e8c;&#x4e2a;&#x4e any production system.","children":[],"payload":{"tag":"li","lines":"2527,2528"}}],"payload":{"tag":"li","lines":"2525,2528"}},{"content":"&#x2461; &#x539f;&#x7406; &#xb7; How it works","children":[{"content":"\n<pre data-lines=\"2529,2541\"><code class=\"language-text\">&#x5bb9;&#x5668;&#x81ea;&#x62a5;&#x5065;&#x5eb7;&#xff0c;&#x7f16;&#x6392;&#x5668;&#x636e;&#x6b64;&#x5904;&#x7406; &#xb7; container reports health, orchestrator acts\n  Docker / ECS &#x6bcf; 30s every 30s\n     &#x2502; HEALTHCHECK CMD python urllib &#x2192; GET /health&#xff08;&#x8d85;&#x65f6; timeout 4s&#xff09;\n     &#x25bc;\n  /health &#x2500;&#x2500;&#x25b6; &#x6570;&#x636e;&#x5e93; ping&#xff08;&#x77ed;&#x8fde;&#x63a5;&#x8d85;&#x65f6; short connect timeout&#xff09;\n     &#x251c;&#x2500; 200 &#x2500;&#x25b6; healthy &#x2500;&#x25b6; ALB &#x7ee7;&#x7eed;&#x8f6c;&#x53d1; keeps routing\n     &#x2514;&#x2500; 503 / &#x8d85;&#x65f6; timeout &#xd7;3 retries &#x2500;&#x25b6; unhealthy &#x2500;&#x25b6; &#x66ff;&#x6362;&#x4efb;&#x52a1; replace task\n  start-period 20s&#xff1a;&#x542f;&#x52a8;&#x671f;&#x95f4;&#x7684;&#x5931;&#x8d25;&#x4e0d;&#x8ba1;&#x6570; &#xb7; failures during start-up don&apos;t count\n  &#x7528; python &#x800c;&#x975e; curl&#xff1a;&#x8fd0;&#x884c;&#x955c;&#x50cf;&#x91cc;&#x6ca1;&#x6709; curl &#xb7; runtime image has no curl\n&#x7ed1;&#x5b9a;&#x6570;&#x636e;&#x5e93;&#x7684;&#x68c0;&#x67e5;&#x4f1a;&#x8ba9;&#x6240;&#x6709;&#x4efb;&#x52a1;&#x4e00;&#x8d77;&#x91cd;&#x542f; &#xb7; DB-coupled checks restart all\n</code></pre>","children":[],"payload":{"tag":"li","lines":"2529,2541"}}],"payload":{"tag":"li","lines":"2528,2541"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;API &#x66b4;&#x9732; /health&#xff0c;&#x955c;&#x50cf;&#x91cc;&#x7528; Docker HEALTHCHECK &#x8c03;&#x5b83;&#xff0c;&#x90e8;&#x7f72;&#x540e;&#x7684;&#x5192;&#x70df;&#x6d4b;&#x8bd5;&#x4e5f;&#x5148;&#x67e5; /health &#xb7; the API exposes /health, the image&apos;s HEALTHCHECK calls it, and the post-deploy smoke checks it first","children":[],"payload":{"tag":"li","lines":"2542,2543"}},{"content":"&#x4e0d;&#x7528;&#x53ea;&#x770b;&#x8fdb;&#x7a0b;&#x662f;&#x5426;&#x5b58;&#x6d3b; &#xb7; Not process liveness alone&#xff1a;&#x8fdb;&#x7a0b;&#x5728;&#x4f46;&#x5361;&#x6b7b;&#x6216;&#x8d77;&#x4e0d;&#x6765;&#x4f9d;&#x8d56;&#x65f6;&#xff0c;&#x7f16;&#x6392;&#x5668;&#x770b;&#x4e0d;&#x51fa;&#x6765; &#xb7; a hung process or failed dependency still looks alive","children":[],"payload":{"tag":"li","lines":"2543,2544"}},{"content":"&#x4e0d;&#x7528;&#x62ff;&#x4e1a;&#x52a1;&#x63a5;&#x53e3;&#x5f53;&#x5065;&#x5eb7;&#x68c0;&#x67e5; &#xb7; Not a business endpoint&#xff1a;&#x8981;&#x9274;&#x6743;&#xff0c;&#x8fd8;&#x4f1a;&#x4ea7;&#x751f;&#x4e1a;&#x52a1;&#x65e5;&#x5fd7;&#x548c;&#x8d1f;&#x8f7d; &#xb7; needs auth and adds business logs and load","children":[],"payload":{"tag":"li","lines":"2544,2545"}},{"content":"&#x4e0d;&#x7528; /health &#x91cc;&#x67e5;&#x6240;&#x6709;&#x4e0b;&#x6e38; &#xb7; Not deep checks of every dependency&#xff1a;&#x4e0b;&#x6e38;&#x6296;&#x4e00;&#x4e0b;&#x6240;&#x6709;&#x4efb;&#x52a1;&#x90fd;&#x88ab;&#x5224;&#x4e0d;&#x5065;&#x5eb7;&#xff0c;&#x8fde;&#x9501;&#x91cd;&#x542f; &#xb7; a downstream blip marks every task unhealthy and cascades restarts","children":[],"payload":{"tag":"li","lines":"2545,2546"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x6d45;&#x68c0;&#x67e5;&#x53ef;&#x80fd;&#x6f0f;&#x6389;&#x6570;&#x636e;&#x5e93;&#x8fde;&#x4e0d;&#x4e0a;&#x8fd9;&#x7c7b;&#x95ee;&#x9898;&#xff0c;&#x8981;&#x9760;&#x544a;&#x8b66;&#x8865; &#xb7; a shallow check can miss a lost database, so alarms must cover it","children":[],"payload":{"tag":"li","lines":"2546,2547"}},{"content":"&#x6765;&#x6e90; &#xb7; Source&#xff1a;&#x901a;&#x7528;&#x7406;&#x7531;&#xff0c;&#x4ed3;&#x5e93;&#x91cc;&#x6ca1;&#x6709;&#x8bb0;&#x5f55;&#x4e3a;&#x4ec0;&#x4e48;&#x4e0d;&#x7528;&#x522b;&#x7684; &#xb7; general reasoning; the repo #x63d0;&#x793a;&#x65f6;&#xff0c;&#x4f60;&#x6709;&#x54ea;&#x4e9b;&#x8003;&#x8651;&#xff1f; &#xb7; What considerations do you have when designing system prompts for LLM-based chat systems?","children":[{"content":"&#x2460; &#x901a;&#x7528;&#x56de;&#x7b54; &#xb7; General answer","children":[{"content":"&#x63d0;&#x793a;&#x8bcd;&#x8981;&#x6e05;&#x6670;&#x3001;&#x65e0;&#x6b67;&#x4e49;&#xff0c;&#x907f;&#x514d;&#x5360;&#x4f4d;&#x7b26;&#x6a21;&#x5f0f;&#x5bfc;&#x81f4;&#x8bef;&#x89e3;&#x3002;&#x9a8c;&#x8bc1;&#x63d0;&#x793a;&#x8bcd;&#x4e0d;&#x5305;&#x542b;&#x53ef;&#x88ab;&#x66ff;&#x6362;&#x6216;&#x8bef;&#x7528;&#x7684; token&#x3002;","children":[],"payload":{"tag":"li","lines":"2561,2562"}},{"content":"Ensure prompts are clear, unambiguous, and free of placeholder patterns that could be misinterpreted. Validate that the prompt does not contain tokens that could be replaced or misused by the model.","children":[],"payload":{"tag":"li","lines":"2562,2563"}}],"payload":{"tag":"li","lines":"2560,2563"}},{"content":"&#x2461; &#x539f;&#x7406; &#xb7; How it works","children":[{"content":"\n<pre data-lines=\"2564,2579\"><code class=\"language-text\">&#x6a21;&#x578b;&#x4f1a;&#x7167;&#x6284;&#x63d0;&#x793a;&#x8bcd;&#x91cc;&#x7684;&#x4f8b;&#x5b50; &#xb7; models copy prompt examples verbatim\n  &#x4e4b;&#x524d; before:\n  SYSTEM_PROMPT &#x542b;&#x793a;&#x4f8b; contains example &quot;[Email 1]&quot;\n     &#x2502; &#x6a21;&#x578b;&#x7167;&#x6284; model copies it\n     &#x25bc;\n  &#x56de;&#x590d; reply: &quot;&#x8bf7;&#x8054;&#x7cfb; [Email 1]&quot;&#xff08;&#x80cc;&#x540e;&#x6ca1;&#x6709;&#x771f;&#x5b9e;&#x503c; nothing behind it&#xff09;\n     &#x2502; &#x6d4f;&#x89c8;&#x5668;&#x8fd8;&#x539f;&#x5360;&#x4f4d;&#x7b26; browser restores placeholders\n     &#x25bc;\n  &#x53ef;&#x80fd;&#x88ab;&#x8fd8;&#x539f;&#x6210;&#x65e0;&#x5173;&#x7684;&#x771f;&#x5b9e;&#x503c; &#xb7; could restore to an unrelated real value\n  &#x4e4b;&#x540e; after:\n  test: assert PLACEHOLDER.search(SYSTEM_PROMPT) is None\n     &#x2514;&#x2500; &#x540c;&#x4e00;&#x4e2a;&#x6b63;&#x5219;&#x7ea6;&#x675f;&#x63d0;&#x793a;&#x8bcd;&#x548c;&#x8fd8;&#x539f; &#xb7; one regex for prompt and restore\n&#x53ea;&#x6321;&#x5360;&#x4f4d;&#x7b26;&#x5f62;&#x72b6;&#xff0c;&#x4e0d;&#x9632;&#x63d0;&#x793a;&#x6ce8;&#x5165; &#xb7; does not address prompt injection\n</code></pre>","children":[],"payload":{"tag":"li","lines":"2564,2579"}}],"payload":{"tag":"li","lines":"2563,2579"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;&#x7cfb;&#x7edf;&#x63d0;&#x793a;&#x53ea;&#x7528;&#x6587;&#x5b57;&#x63cf;&#x8ff0;&#x5360;&#x4f4d;&#x7b26;&#x7684;&#x683c;&#x5f0f;&#xff08;&#x65b9;&#x62ec;&#x53f7;&#x91cc;&#x7c7b;&#x522b;&#x52a0;&#x7f16;&#x53f7;&#xff09;&#xff0c;&#x4e0d;&#x7ed9;&#x5177;&#x4f53;&#x4f8b;&#x5b50;&#xff0c;&#x5e76;&#x7528;&#x6d4b;&#x8bd5;&#x65ad;&#x8a00;&#x63d0;&#x793a;&#x91cc;&#x5339;&#x914d;&#x4e0d;&#x5230;&#x5360;&#x4f4d;&#x7b26;&#x6b63;&#x5219; &#xb7; the system prompt describes the placeholder format in words, gives no example, and a test asserts the placeholder regex finds nothing","children":[],"payload":{"tag":"li","lines":"2580,2581"}},{"content":"&#x4e0d;&#x7528;&#x5728;&#x63d0;&#x793a;&#x91cc;&#x7ed9; [Email 1] &#x8fd9;&#x6837;&#x7684;&#x4f8b;&#x5b50; &#xb7; Not an example like [Email 1]&#xff1a;&#x6a21;&#x578b;&#x4f1a;&#x7167;&#x6284;&#xff0c;&#x6d4f;&#x89c8;&#x5668;&#x968f;&#x540e;&#x4f1a;&#x628a;&#x6284;&#x6765;&#x7684;&#x5360;&#x4f4d;&#x7b26;&quot;&#x8fd8;&#x539f;&quot;&#x6210;&#x65e0;&#x5173;&#x7684;&#x771f;&#x5b9e;&#x503c; &#xb7; the model copies it, and the browser may later restore the copy to an unrelated real value","children":[],"payload":{"tag":"li","lines":"2581,2582"}},{"content":"&#x4e0d;&#x7528;&#x53ea;&#x9760;&#x4eba;&#x5de5;&#x5ba1;&#x63d0;&#x793a;&#x8bcd; &#xb7; Not prompt review alone&#xff1a;&#x6539;&#x4e00;&#x6b21;&#x63aa;&#x8f9e;&#x5c31;&#x53ef;&#x80fd;&#x91cd;&#x65b0;&#x5f15;&#x5165;&#x4f8b;&#x5b50;&#xff0c;&#x6d4b;&#x8bd5;&#x6bcf;&#x6b21;&#x90fd;&#x6321; &#xb7; one wording change can bring an example back; the test catches it every time","children":[],"payload":{"tag":"li","lines":"2582,2583"}},{"content":"&#x4e0d;&#x7528;&#x8f93;&#x51fa;&#x540e;&#x8fc7;&#x6ee4;&#x7f16;&#x9020;&#x7684;&#x5360;&#x4f4d;&#x7b26; &#xb7; Not filtering invented placeholders afterwards&#xff1a;&#x53ea;&#x80fd;&#x8865;&#x6551;&#xff0c;&#x6e90;&#x5934;&#x4e0d;&#x7ed9;&#x4f8b;&#x5b50;&#x66f4;&#x53ef;&#x9760; &#xb7; a patch after the fact; not offering an example fixes the cause","children":[],"payload":{"tag":"li","lines":"2583,2584"}},{"content":"&#x4ee3;&#x4ef7; &#xb7; Cost&#xff1a;&#x6ca1;&#x6709;&#x4f8b;&#x5b50;&#xff0c;&#x90e8;&#x5206;&#x6a21;&#x578b;&#x4fdd;&#x7559;&#x5360;&#x4f4d;&#x7b26;&#x7684;&#x6548;&#x679c;&#x53ef;&#x80fd;&#x53d8;&#x5dee; &#xb7; without an example some models may keep placeholders less reliably","children":[],"payload":{"tag":"li","lines":"2584,2585"}},{"content":"&#x6765;&#x6e90; &#xb7; Source&#xff1a;2eb88ba &#x4ee3;&#x7801;&#x6ce8;&#x91ca;&#xff1a;&#x6a21;&#x578b;&#x4f1a;&#x7167;&#x6284;&#x4f8b;&#x5b50;&#xff0c;&#x6d4f;&#x89c8;&#x5668;&#x53ef;&#x80fd;&#x628a;&#x6284;&#x6765;&#x7684;&#x5360;&#x4f4d;&#x7b26;&#x8fd8;&#x539f;&#x6210;&#x65e0;&#x5173;&#x503c;&#xff08;M5b-b &#x5192;&#x70df;&#x65f6;&#x53d1;&#x73b0;&#xff09;&#xb7; 2eb88ba code comment: models copy examples and the browser could restore them (found in the M5b-b smoke)","children":[],"payload":{"tag":"li","lines":"2585,2586"}}],"payload":{"tag":"li","lines":"2579,2586"}},{"content":"&#x2463; &#x6211;&#x7684;&#x6848;&#x4f8b; &#xb7; My case","children":[{"content":"&#x6211;&#x6dfb;&#x52a0;&#x4e86;&#x4e00;&#x4e2a;&#x6d4b;&#x8bd5;&#xff0c;&#x786e;&#x8ba4;&#x7cfb;&#x7edf;&#x63d0;&#x793a;&#x4e0d;&#x5305;&#x542b;&#x4efb;&#x4f55;&#x5360;&#x4f4d;&#x7b26;&#x5f62;&#x72b6;&#x7684;&#x793a;&#x4f8b;&#xff0c;&#x9632;&#x6b62;&#x6a21;&#x578b;&#x751f;&#x6210;&#x610f;&#x5916;&#x5185;&#x5bb9;&#x3002;&#x8be5;&#x6d4b;&#x8bd5;&#x65ad;&#x8a00;&#x5360;&#x4f4d;&#x7b26;&#x6b63;&#x5219;&#x8868;&#x8fbe;&#x5f0f;&#x4e0d;&#x5339;&#x914d;&#x7cfb;&#x7edf;&#x63d0;&#x793a;&#x3002;","children":[],"payload":{"tag":"li","lines":"2587,2588"}},{"content":"I added a test to confirm that the system prompt does not contain any placeholder-shaped examples, preventing the model from generating unintended content. The test asserts that the placeholder regex does not match the system prompt.","children":[],"payload":{"tag":"li","lines":"2588,2589"}}],"payload":{"tag":"li","lines":"2586,2589"}},{"content":"&#x2464; &#x4ee3;&#x7801; &#xb7; Code&#xff1a;<code>apps/api/tests/test_chat_prompt.py @ 9045532</code> &#xb7; &#x4ee3;&#x7801;&#x5728;&#x79c1;&#x6709;&#x4ed3;&#x5e93;&#xff0c;&#x672c;&#x5730;&#x5bfc;&#x56fe;&#x91cc;&#x770b; &#xb7; private repo, see the local map","children":[],"payload":{"tag":"li","lines":"2589,2590"}},{"content":"&#x2465; &#x8bc1;&#x636e; &#xb7; Evidence&#xff08;2026-09-24&#xff09;","children":[{"content":"&quot;+assert PLACEHOLDER.search(SYSTEM_PROMPT) is None&quot;","children":[],"payload":{"tag":"li","lines":"2591,2592"}}],"payload":{"tag":"li","lines":"2590,2592"}},{"content":"&#x7ecf;&#x5178;&#x8ffd;&#x95ee; Classic follow-ups&#xff1a;What makes a prompt effective? | What are common pitfalls in designing an AI assistant? | How do you mitigate prompt injection?","children":[],"payload":{"tag":"li","lines":"2592,2594"}}],"payload":{"tag":"h4","lines":"2558,2559"}}],"payload":{"tag":"h3","lines":"2556,2557"}},{"content":"&#x5176;&#x4ed6; &#xb7; Other","children":[{"content":"Terraform &#x73af;&#x5883;&#x7279;&#x5b9a;&#x914d;&#x7f6e; &#xb7; Terraform Environment-Specific Configuration","children":[{"content":"&#x2460; &#x901a;&#x7528;&#x56de;&#x7b54; &#xb7; General answer","children":[{"content":"Terraform &#x6a21;&#x5757;&#x53ef;&#x4ee5;&#x901a;&#x8fc7;&#x8f93;&#x5165;&#x53d8;&#x91cf;&#x4e3a;&#x4e0d;&#x540c;&#x73af;&#x5883;&#x53c2;&#x6570;&#x5316;&#x3002;&#x901a;&#x8fc7;&#x5728;&#x5171;&#x4eab;&#x6a21;&#x5757;&#x4e2d;&#x5b9a;&#x4e49;&#x53d8;&#x91cf;&#xff0c;&#x5e76;&#x5728;&#x5404;&#x81ea;&#x7684; .tfvars &#x6587;&#x4ef6;&#x6216;&#x547d;&#x4ee4;&#x884c;&#x4e2d;&#x63d0;&#x4f9b;&#x73af;&#x5883;&#x7279;&#x5b9a;&#x7684;&#x503c;&#xff0c;&#x4f60;&#x53ef;&#x4ee5;&#x8986;&#x76d6;&#x9ed8;&#x8ba4;&#x503c;&#xff0c;&#x5b9e;&#x73b0; dev&#x3001;staging&#x3001;prod &#x7b49;&#x4e0d;&#x540c;&#x914d;&#x7f6e;&#x7684;&#x90e8;&#x7f72;&#x3002;","children":[],"payload":{"tag":"li","lines":"2599,2600"}},{"content":"Terraform modules can be parameterized per environment using input variables. By defining variables in a shared module and providing environment-specific values in separate .tfvars files or via the command line, you can override defaults and deploy different configurations for dev, staging, and prod.","children":[],"payload":{"tag":"li","lines":"2600,2601"}}],"payload":{"tag":"li","lines":"2598,2601"}},{"content":"&#x2461; &#x539f;&#x7406; &#xb7; How it works","children":[{"content":"\n<pre data-lines=\"2602,2617\"><code class=\"language-text\">&#x540c;&#x4e00;&#x6a21;&#x5757;&#xff0c;&#x9ed8;&#x8ba4;&#x5b89;&#x5168;&#xff0c;&#x73af;&#x5883;&#x8986;&#x76d6; &#xb7; same module, safe defaults, env overrides\n  modules/compute/variables.tf\n     chat_enabled              default false   &#x65b0;&#x529f;&#x80fd;&#x9ed8;&#x8ba4;&#x5173; new feature off\n     repositories_force_delete default false   &#x9ed8;&#x8ba4;&#x4e0d;&#x8bb8;&#x5220; default: keep\n            &#x25b2;                              &#x25b2;\n  envs/dev/main.tf                   envs/prod/main.tf&#xff08;&#x540c;&#x4e00;&#x6587;&#x4ef6; same file&#xff09;\n     chat_enabled = var.chat_enabled\n     repositories_force_delete = !var.deletion_protection\n            &#x25b2;                              &#x25b2;\n  dev.tfvars: deletion_protection=false  prod.tfvars: deletion_protection=true\n     &#x2192; destroy &#x53ef;&#x5220;&#x955c;&#x50cf;&#x4ed3;&#x5e93; repos deletable   &#x2192; &#x4fdd;&#x7559; kept\n  &#x5bb9;&#x5668;&#x73af;&#x5883; env: GOVAPI_CHAT_ENABLED = tostring(var.chat_enabled)\n&#x4e00;&#x4e2a;&#x53d8;&#x91cf;&#x6d3e;&#x751f;&#x53e6;&#x4e00;&#x4e2a;&#xff0c;&#x9690;&#x85cf;&#x4e86;&#x8026;&#x5408; &#xb7; deriving one flag from another hides coupling\n</code></pre>","children":[],"payload":{"tag":"li","lines":"2602,2617"}}],"payload":{"tag":"li","lines":"2601,2617"}},{"content":"&#x2462; &#x4e3a;&#x4ec0;&#x4e48;&#x9009;&#x5b83; &#xb7; Why this, not the alternatives","children":[{"content":"&#x9009;&#x5b83; &#xb7; Chose&#xff1a;dev &#x548c; prod &#x7684; main.tf &#x5b8c;&#x5168;&#x76f8;&#x540c;&#xff0c;&#x53ea;&#x5728; terraform.tfvars &#x548c;&#x72b6;&#x6001; key &#x4e0a;&#x4e0d;&#x540c;&#xff1b;&#x804a;&#x5929;&#x5f00;&#x5173;&#x6309;&#x73af;&#x5883;&#x8bbe;&#xff0c;&#x9ed8;&#x8ba4;&#x5173; &#xb7; identical main.tf for dev and prod, differing only in tfvars and state key; chat switch per environment, off by default","children":[],"payload":{"tag":"li","lines":"2618,2619"}},{"content":"&#x4e0d;&#x7528;&#x6bcf;&#x4e2a;&#x73af;&#x5883;&#x5404;&#x5199;&#x4e00;&#x5957;&#x914d;&#x7f6e; &#xb7; Not separate code per environment&#xff1a;&#x73af;&#x5883;&#x4f1a;&#x6162;&#x6162;&#x8dd1;&#x504f;&#xff0c;prod &#x90e8;&#x7f72;&#x7684;&#x4e0d;&#x662f;&#x6d4b;&#x8fc7;&#x7684;&#x914d;&#x7f6e; &#xb7; environments drift, and prod runs config that was never tested","children":[],"payload":{"tag":"li","lines":"2619,2620"}},{"content":"&#x4e0d;&#x7528;&#x5355;&#x4e00;&#x914d;&#x7f6e;&#x91cc;&#x5199; if env == prod &#xb7; Not env conditionals in one config&#xff1a;&#x6761;&#x4ef6;&#x6563;&#x5728;&#x5404;&#x5904;&#xff0c;&#x770b;&#x4e0d;&#x51fa;&#x4e24;&#x4e2a;&#x73af;&#x5883;&#x5230;&#x5e95;&#x5dee;&#x5728;&#x54ea; &#xb7; scattered conditionals hide what actually differs","children":[],"payload":{"tag":"li","lines":"2620,2621"}},{"content":"&#x4e0d;&#x7528;&#x547d;&#x4ee4;&#x884c; -var &#x4f20;&#x73af;&#x5883;&#x503c; &#xb7; Not -var on the command line&#xff1a;&#x4
